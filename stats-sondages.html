<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistiques — Sondages clients | Soucy Aquatik</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#004987; --navy:#0A2540; --aqua:#19B5C9; --paper:#F3F7FA; --ink:#1B2B3A;
  --muted:#5D7183; --amber:#F5A623; --green:#2E9E6B; --red:#D9534F; --line:#DCE6EE; --white:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--paper);min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 60px}

.hero{background:linear-gradient(160deg,var(--navy) 0%,var(--brand) 70%,#0A6FA8 100%);color:#fff;padding:30px 0 44px}
.hero .in{max-width:920px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:14px}
.hero img{width:44px;height:44px;border-radius:8px;border:1.5px solid rgba(255,255,255,.5)}
.hero h1{font-size:24px;font-weight:800}
.hero span{font-size:12.5px;letter-spacing:.1em;opacity:.85;font-weight:600}

/* Gate */
.gate{max-width:400px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 28px;text-align:center}
.gate h2{font-size:19px;color:var(--navy);margin-bottom:6px}
.gate p{font-size:13.5px;color:var(--muted);margin-bottom:18px}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-family:inherit;font-size:14.5px;margin-bottom:12px}
.gate button{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:13px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer}
.gate .err{color:var(--red);font-size:13px;margin-top:10px;min-height:16px}

.dash{display:none}
.selrow{display:flex;gap:10px;align-items:center;margin:26px 0 6px;flex-wrap:wrap}
.selrow select{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:14px;background:#fff}
.refresh{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--brand)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi .v{font-size:30px;font-weight:800;color:var(--navy)}
.kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi .stars{color:var(--amber);font-size:14px;margin-top:4px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.card h3{font-size:15px;color:var(--navy);margin-bottom:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar .lab{width:110px;flex:none;color:var(--muted)}
.bar .track{flex:1;height:16px;background:var(--paper);border-radius:8px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--aqua));border-radius:8px}
.bar .n{width:26px;text-align:right;font-weight:700;color:var(--navy);flex:none}

.nps-wrap{display:flex;align-items:center;gap:20px}
.nps-score{font-size:44px;font-weight:800;color:var(--navy)}
.nps-legend{font-size:12px;color:var(--muted);line-height:1.7}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

.comments{margin-top:16px}
.cmt{background:#F3F7FA;border-left:4px solid var(--aqua);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:10px;font-size:13.5px;color:var(--ink)}
.cmt .meta{font-size:11.5px;color:var(--muted);margin-top:5px}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.tag{display:inline-block;background:#E4F0F9;color:var(--brand);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;margin:0 6px 6px 0}
@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style>
</head>

async function load(cle){
  const slug=document.getElementById('sondageSelect').value;
  const res = await fetch(SB_URL+'/rest/v1/rpc/sondage_stats',{
    method:'POST',
    headers:{'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_slug:slug,p_cle:cle})
  });
  if(!res.ok) return false;
  const rows = await res.json();
  render(rows);
  return true;
}

function avg(arr){ const v=arr.filter(x=>x!=null); return v.length? (v.reduce((a,b)=>a+b,0)/v.length) : 0; }
function stars(n){ const r=Math.round(n); return '★'.repeat(r)+'☆'.repeat(5-r); }
function esc(s){ return (s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }

function render(rows){
  const c=document.getElementById('content');
  if(!rows.length){ c.innerHTML='<div class="empty">Aucune réponse pour le moment.</div>'; return; }

  const n=rows.length;
  const q2avg=avg(rows.map(r=>r.q2_qualite));
  const q3avg=avg(rows.map(r=>r.q3_clarte));
  const npsVals=rows.map(r=>r.q10_nps).filter(x=>x!=null);
  const promoters=npsVals.filter(x=>x>=9).length, passives=npsVals.filter(x=>x>=7&&x<=8).length, detractors=npsVals.filter(x=>x<=6).length;
  const npsScore= npsVals.length? Math.round((promoters-detractors)/npsVals.length*100) : 0;

  function counts(key,vals){
    const c={}; vals.forEach(v=>c[v]=(c[v]||0)+1);
    return c;
  }
  const q4c=counts('q4',rows.map(r=>r.q4_reponses).filter(Boolean));
  const q5c=counts('q5',rows.map(r=>r.q5_duree).filter(Boolean));
  const q6flat=rows.flatMap(r=>r.q6_sujets||[]);
  const q6c=counts('q6',q6flat);
  const q9flat=rows.flatMap(r=>r.q9_besoins||[]);
  const q9c=counts('q9',q9flat);

  function barsHtml(obj,total){
    return Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
      const pct= total? Math.round(v/total*100) : 0;
      return '<div class="bar"><span class="lab">'+esc(k)+'</span><div class="track"><div class="fill" style="width:'+pct+'%"></div></div><span class="n">'+v+'</span></div>';
    }).join('');
  }

  const comments = rows.filter(r=>r.q7_utile||r.q8_ameliorer||r.q11_commentaire).map(r=>{
    const parts=[];
    if(r.q7_utile) parts.push('<strong>👍 Utile :</strong> '+esc(r.q7_utile));
    if(r.q8_ameliorer) parts.push('<strong>🔧 À améliorer :</strong> '+esc(r.q8_ameliorer));
    if(r.q11_commentaire) parts.push('<strong>💬 </strong>'+esc(r.q11_commentaire));
    const who=[r.nom,r.fonction].filter(Boolean).join(' — ') || 'Anonyme';
    const date=new Date(r.created_at).toLocaleDateString('fr-CA');
    return '<div class="cmt">'+parts.join('<br>')+'<div class="meta">'+esc(who)+' · '+date+'</div></div>';
  }).join('');

  c.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="v">${n}</div><div class="l">Réponses reçues</div></div>
      <div class="kpi"><div class="v">${q2avg.toFixed(1)}/5</div><div class="l">Qualité générale</div><div class="stars">${stars(q2avg)}</div></div>
      <div class="kpi"><div class="v">${q3avg.toFixed(1)}/5</div><div class="l">Clarté des explications</div><div class="stars">${stars(q3avg)}</div></div>
      <div class="kpi"><div class="v">${npsScore}</div><div class="l">Score de recommandation (NPS)</div></div>
    </div>

    <div class="grid2">
      <div class="card"><h3>Réponses à vos questions</h3>${barsHtml(q4c,n)}</div>
      <div class="card"><h3>Durée de la formation</h3>${barsHtml(q5c,n)}</div>
      <div class="card"><h3>Sujets bien couverts</h3>${barsHtml(q6c,n)}</div>
      <div class="card"><h3>Besoins pour une prochaine formation</h3>${Object.keys(q9c).length?barsHtml(q9c,n):'<div style="color:var(--muted);font-size:13px">Aucune sélection.</div>'}</div>
    </div>

    <div class="card" style="margin-top:16px">
      <h3>Recommandation (NPS)</h3>
      <div class="nps-wrap">
        <div class="nps-score">${npsScore}</div>
        <div class="nps-legend">
          <div><span class="dot" style="background:var(--green)"></span>Promoteurs (9-10) : ${promoters}</div>
          <div><span class="dot" style="background:var(--amber)"></span>Passifs (7-8) : ${passives}</div>
          <div><span class="dot" style="background:var(--red)"></span>Détracteurs (0-6) : ${detractors}</div>
        </div>
      </div>
    </div>

    <div class="card comments" style="margin-top:16px">
      <h3>Commentaires reçus</h3>
      ${comments || '<div style="color:var(--muted);font-size:13px">Aucun commentaire pour l\'instant.</div>'}
    </div>
  `;
}
</script>
</body>
</html>
