<!doctype html>
<html lang="fr-CA" data-theme="papier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#004987">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Tournée">
<title>La Tournée — Soucy Aquatik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==TOKENS== */
:root{
  /* — Identité (ne pas modifier) — */
  --sa-marine:#004987;
  --sa-marine-900:#00233F;
  --sa-marine-700:#003766;
  --sa-marine-100:#DCE8F3;

  /* — Encre (neutres froids tirés du marine) — */
  --ink-950:#050E17;
  --ink-900:#0A1826;
  --ink-850:#0F2132;
  --ink-800:#152A3E;
  --ink-700:#223A51;
  --ink-600:#3A5068;
  --ink-500:#5C7187;
  --ink-400:#8697A8;
  --ink-300:#B4C0CB;
  --ink-200:#D6DDE3;
  --ink-100:#E9EDF1;
  --ink-50:#F4F6F8;
  --paper:#FFFFFF;

  /* — Signal : jaune bouée, l'unique couleur d'action — */
  --signal:#FFC400;
  --signal-600:#E0AA00;
  --signal-ink:#1C1500;

  /* — Réactifs : chaque paramètre porte la couleur de son test — */
  --rx-chlore:#C8157A;   /* DPD, magenta */
  --rx-combine:#8A1A5B;  /* DPD 3, prune */
  --rx-ph:#E2472B;       /* rouge phénol */
  --rx-alc:#2E7D32;      /* vert de bromocrésol */
  --rx-temp:#6A3FC8;     /* thermomètre */
  --rx-niveau:#004987;   /* marine */
  --rx-turb:#8C6A00;     /* ocre */
  --rx-cya:#0E7C86;      /* acide cyanurique */

  /* — États (réservés, jamais décoratifs) — */
  --ok:#0B8A4B;
  --warn:#D96C00;
  --crit:#CF1D3A;

  /* — Typographie — */
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --wide:118%;   /* titres : large, façon signalisation */
  --narrow:78%;  /* chiffres : condensé, façon marquage de profondeur */
  --t-2xs:11px; --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:19px;
  --t-xl:24px; --t-2xl:32px; --t-3xl:48px; --t-4xl:72px;

  /* — Espace (base 4) — */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;

  /* — Formes : angles francs, rayon minimal — */
  --r1:2px; --r2:4px; --r3:8px;
  --rule:1px; --rule-strong:3px;
  --touch:56px;          /* cible tactile terrain (gants) */
  --touch-min:48px;

  /* — Motif : corde de couloir — */
  --lane:repeating-linear-gradient(90deg,var(--signal) 0 14px,var(--sa-marine) 14px 28px,var(--paper) 28px 42px,var(--sa-marine) 42px 56px);

  --ease:cubic-bezier(.2,.7,.2,1);
}

/* Thème Papier (défaut terrain — lisible plein soleil) */
[data-theme="papier"]{
  --bg:var(--paper); --surface:var(--ink-50); --surface-2:var(--ink-100);
  --line:var(--ink-200); --line-strong:var(--ink-900);
  --text:var(--ink-950); --text-2:var(--ink-600); --text-3:var(--ink-500);
  --accent:var(--signal); --accent-ink:var(--signal-ink);
  --brand:var(--sa-marine); --brand-ink:#fff;
  --ok-bg:#E3F4EA; --warn-bg:#FFF0DE; --crit-bg:#FDE6EA;
  --focus:0 0 0 3px var(--ink-950),0 0 0 6px var(--signal);
}
/* Thème Encre (défaut gestion — salle de contrôle) */
[data-theme="encre"]{
  --bg:var(--ink-950); --surface:var(--ink-900); --surface-2:var(--ink-850);
  --line:var(--ink-800); --line-strong:var(--ink-600);
  --text:#EEF2F5; --text-2:var(--ink-300); --text-3:var(--ink-400);
  --accent:var(--signal); --accent-ink:var(--signal-ink);
  --brand:var(--sa-marine); --brand-ink:#fff;
  --ok:#2FC27A; --warn:#FF9A2E; --crit:#FF4D67;
  --rx-chlore:#F04AA3; --rx-combine:#D56BAA; --rx-ph:#FF6A4D; --rx-alc:#5DBB63;
  --rx-temp:#A488F0; --rx-niveau:#5AA3E6; --rx-turb:#D9B243; --rx-cya:#3FC1CB;
  --ok-bg:#0C2A1E; --warn-bg:#2E1C07; --crit-bg:#33101A;
  --focus:0 0 0 2px var(--ink-950),0 0 0 4px var(--signal);
}
/* ==/TOKENS== */

/* ════════════════ Base ════════════════ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:16px}
html[data-size="grand"]{font-size:18px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:1rem;line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:none;box-shadow:var(--focus)}
.num{font-stretch:var(--narrow);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mono{font-family:var(--mono);font-weight:500;letter-spacing:0}
.wide{font-stretch:var(--wide)}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:32px;height:32px;stroke-width:2.25}

/* ════════════════ Coquille ════════════════ */
.app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top::after{content:"";display:block;height:6px;background:var(--lane)}
.top-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4)}
.logo{width:44px;height:44px;flex:none;display:block}
.top-title{flex:1;min-width:0}
.top-title b{display:block;font-size:var(--t-lg);font-weight:850;font-stretch:var(--wide);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-title span{display:block;font-size:var(--t-xs);color:var(--text-2)}
.sync{display:flex;align-items:center;gap:6px;font-size:var(--t-xs);font-weight:600;color:var(--text-2);background:none;border:0;min-height:var(--touch-min);padding:0 var(--s2)}
.sync i{width:10px;height:10px;display:block;background:var(--ok)}
.sync[data-s="offline"] i{background:var(--warn)}
.sync[data-s="queue"] i{background:var(--signal)}

main{flex:1;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.screen{display:none;animation:in .22s var(--ease)}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink-950);color:#fff;
  padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;color:var(--ink-300);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  min-height:68px;font-size:var(--t-2xs);font-weight:650;position:relative}
.tab[aria-current="page"]{color:#fff}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:18%;right:18%;height:4px;background:var(--signal)}
.tab .dot{position:absolute;top:10px;right:calc(50% - 20px);width:10px;height:10px;background:var(--signal);border:2px solid var(--ink-950)}

/* ════════════════ Éléments ════════════════ */
.sec{padding:var(--s5) var(--s4) 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);border-top:var(--rule-strong) solid var(--line-strong);padding-top:var(--s2);margin-bottom:var(--s3)}
.sec-h h2{margin:0;font-size:var(--t-md);font-weight:800;font-stretch:var(--wide)}
.sec-h small{font-size:var(--t-xs);color:var(--text-2);font-weight:600}
h1.h{margin:0;font-size:var(--t-2xl);line-height:1.02;font-weight:900;font-stretch:var(--wide);letter-spacing:-.015em}
.lede{color:var(--text-2);font-size:var(--t-sm);margin:var(--s2) 0 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:var(--touch);padding:0 var(--s5);
  border:2px solid var(--line-strong);background:var(--bg);color:var(--text);font-weight:750;font-size:var(--t-md);border-radius:var(--r2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.dark{background:var(--ink-950);color:#fff;border-color:var(--ink-950)}
.btn.crit{background:var(--crit);color:#fff;border-color:var(--crit)}
.btn.ghost{border-color:var(--line)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

.chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-xs);font-weight:700;padding:3px 8px;border:1.5px solid currentColor;border-radius:var(--r1);line-height:1.2;white-space:nowrap}
.chip.rec{color:var(--sa-marine)}
[data-theme="encre"] .chip.rec{color:var(--rx-niveau)}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.crit{color:var(--crit)}
.chip.mute{color:var(--text-3)}
.chip.fill{background:var(--ink-950);color:#fff;border-color:var(--ink-950)}

/* Liste « registre » : pas de cartes, des lignes */
.ledger{list-style:none;margin:0;padding:0;border-top:var(--rule) solid var(--line)}
.ledger>li{border-bottom:var(--rule) solid var(--line)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--s3);width:100%;min-height:72px;padding:var(--s3) 0;
  background:none;border:0;text-align:left}
.lrow .t{font-size:var(--t-xl);line-height:1}
.lrow .t small{display:block;font-size:var(--t-2xs);font-weight:600;color:var(--text-3);font-stretch:100%;margin-top:3px;letter-spacing:0}
.lrow b{display:block;font-size:var(--t-md);font-weight:750;line-height:1.2}
.lrow .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:5px;font-size:var(--t-xs);color:var(--text-2)}
.lrow .meta .d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;width:100%}
.lrow .go-ic{color:var(--text-3)}
.lrow.done{opacity:.55}
.lrow.done b{text-decoration:line-through;text-decoration-thickness:2px}
.lrow.here{box-shadow:inset 6px 0 0 var(--signal);padding-left:var(--s4)}

/* Bloc punch */
.punch{margin:var(--s4) var(--s4) 0;background:var(--ink-950);color:#fff;border-radius:var(--r3);overflow:hidden}
.punch-top{padding:var(--s5) var(--s5) var(--s4)}
.punch-state{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-sm);font-weight:700;color:var(--ink-300)}
.punch-state i{width:12px;height:12px;background:var(--ok);display:block;animation:pulse 1.6s infinite}
.punch[data-s="pause"] .punch-state i{background:var(--signal);animation:none}
.punch[data-s="idle"] .punch-state i{background:var(--ink-500);animation:none}
@keyframes pulse{50%{opacity:.25}}
.punch-site{font-size:var(--t-2xl);font-weight:900;font-stretch:var(--wide);line-height:1.05;margin:var(--s2) 0 var(--s1)}
.punch-addr{font-size:var(--t-sm);color:var(--ink-300)}
.punch-clock{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin-top:var(--s4)}
.punch-clock .num{font-size:var(--t-4xl);line-height:.85;color:var(--signal)}
.punch-clock small{font-size:var(--t-xs);color:var(--ink-300);text-align:right}
.punch-acts{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--ink-800)}
.punch-acts button{background:none;border:0;border-right:1px solid var(--ink-800);color:#fff;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:var(--t-xs);font-weight:700}
.punch-acts button:last-child{border-right:0}
.punch-main{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:72px;padding:0 var(--s5);border:0;
  background:var(--signal);color:var(--signal-ink);font-size:var(--t-lg);font-weight:850;font-stretch:var(--wide)}
.punch-idle{padding:var(--s6) var(--s5)}
.punch-note{margin:0;padding:var(--s2) var(--s5) var(--s3);font-size:var(--t-xs);color:var(--ink-300);border-top:1px dashed var(--ink-700)}
.lrow .t.none{font-size:var(--t-md);color:var(--text-3)}
.mode-note{margin:var(--s4) var(--s4) 0;padding:var(--s3) var(--s4);border-left:6px solid var(--signal);background:var(--surface);font-size:var(--t-sm);color:var(--text-2)}
.mode-note b{color:var(--text)}
.punch-idle p{margin:var(--s2) 0 var(--s5);color:var(--ink-300);font-size:var(--t-sm)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.q{background:var(--bg);border:0;min-height:96px;padding:var(--s4);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-weight:750;font-size:var(--t-md)}
.q svg{color:var(--sa-marine)}
[data-theme="encre"] .q svg{color:var(--rx-niveau)}
.q.urg svg{color:var(--crit)}

/* ════════════════ Fiche technique adaptative ════════════════ */
.fiche-head{padding:var(--s5) var(--s4) var(--s4);background:var(--surface);border-bottom:var(--rule) solid var(--line)}
.contract{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s3)}
.seg{display:flex;gap:0;margin-top:var(--s4);border:2px solid var(--line-strong);border-radius:var(--r2);overflow:hidden}
.seg button{flex:1;min-height:var(--touch-min);border:0;background:var(--bg);font-weight:750;font-size:var(--t-sm);padding:0 var(--s2);border-right:2px solid var(--line-strong)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink-950);color:#fff}
[data-theme="encre"] .seg button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink)}
.progress{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s4);font-size:var(--t-xs);font-weight:700;color:var(--text-2)}
.lanebar{flex:1;height:10px;background:var(--surface-2);position:relative;overflow:hidden}
.lanebar i{position:absolute;inset:0 auto 0 0;background:var(--lane);transition:width .3s var(--ease)}

.param{padding:var(--s5) var(--s4);border-bottom:var(--rule) solid var(--line);position:relative}
.param::before{content:"";position:absolute;left:0;top:var(--s5);width:5px;height:28px;background:var(--rx,var(--ink-500))}
.p-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.p-name{font-weight:800;font-size:var(--t-md)}
.p-name small{display:block;font-size:var(--t-xs);font-weight:500;color:var(--text-2);margin-top:2px}
.req{color:var(--crit);font-weight:800}
.p-read{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3)}
.step{width:var(--touch);height:var(--touch);flex:none;border:2px solid var(--line-strong);background:var(--bg);border-radius:var(--r2);display:grid;place-items:center}
.step:active{background:var(--surface-2)}
.p-val{flex:1;text-align:center;min-width:0}
.p-val .num{font-size:var(--t-3xl);line-height:1}
.p-val .u{font-size:var(--t-sm);font-weight:700;color:var(--text-2);margin-left:4px}
.p-val .empty{color:var(--text-3)}
.scale{position:relative;margin-top:var(--s4);height:36px}
.scale-track{position:absolute;left:0;right:0;top:10px;height:14px;background:var(--crit-bg);border:1px solid var(--line)}
.scale-acc{position:absolute;top:0;bottom:0;background:var(--warn-bg)}
.scale-opt{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.85}
.scale-mark{position:absolute;top:2px;width:6px;height:30px;margin-left:-3px;background:var(--ink-950);box-shadow:0 0 0 2px var(--bg);transition:left .15s var(--ease)}
[data-theme="encre"] .scale-mark{background:#fff;box-shadow:0 0 0 2px var(--ink-950)}
.scale input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}
.scale-ticks{display:flex;justify-content:space-between;font-size:var(--t-2xs);color:var(--text-3);margin-top:2px;font-family:var(--mono)}
.verdict{display:flex;align-items:center;gap:var(--s2);margin-top:var(--s3);font-size:var(--t-sm);font-weight:700;min-height:24px}
.verdict.ok{color:var(--ok)} .verdict.warn{color:var(--warn)} .verdict.crit{color:var(--crit)} .verdict.none{color:var(--text-3);font-weight:600}
.choice{display:grid;gap:var(--s2);margin-top:var(--s3)}
.choice button{min-height:var(--touch);border:2px solid var(--line-strong);background:var(--bg);border-radius:var(--r2);font-weight:750;font-size:var(--t-md)}
.choice button[aria-pressed="true"]{background:var(--ink-950);color:#fff;border-color:var(--ink-950)}
[data-theme="encre"] .choice button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.choice button[aria-pressed="true"].bad{background:var(--crit);border-color:var(--crit);color:#fff}

.prod{display:grid;grid-template-columns:1fr auto;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:var(--rule) solid var(--line)}
.prod b{font-size:var(--t-md);font-weight:750;display:block}
.prod small{color:var(--text-2);font-size:var(--t-xs)}
.qty{display:flex;align-items:center;gap:var(--s1)}
.qty .num{min-width:64px;text-align:center;font-size:var(--t-xl)}
.qty .step{width:48px;height:48px}

.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s2)}
.ph{aspect-ratio:1;border:2px dashed var(--line-strong);border-radius:var(--r2);display:grid;place-items:center;background:var(--surface);position:relative;overflow:hidden;color:var(--text-2);font-size:var(--t-xs);font-weight:700;text-align:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.add{border-style:solid;background:var(--bg)}
.ph input{position:absolute;inset:0;opacity:0}
textarea,.field input,.field select{width:100%;border:2px solid var(--line-strong);border-radius:var(--r2);background:var(--bg);padding:var(--s3);font-size:var(--t-md);min-height:var(--touch)}
textarea{min-height:120px;resize:vertical}
.field{display:block;margin-bottom:var(--s4)}
.field>span{display:block;font-size:var(--t-sm);font-weight:750;margin-bottom:6px}

.savebar{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));z-index:10;background:var(--bg);border-top:var(--rule-strong) solid var(--line-strong);padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center}
.savebar .note{flex:1;font-size:var(--t-xs);font-weight:650;color:var(--text-2);line-height:1.25}

.empty-state{padding:var(--s10) var(--s5);text-align:left}
.empty-state .big{font-size:var(--t-xl);font-weight:850;font-stretch:var(--wide);line-height:1.1;margin:var(--s4) 0 var(--s2)}
.empty-state p{color:var(--text-2);margin:0 0 var(--s5)}

/* Tuiles demandes */
.req-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
.rq{min-height:128px;border:2px solid var(--line-strong);background:var(--bg);border-radius:var(--r3);padding:var(--s4);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;font-weight:800;font-size:var(--t-lg);font-stretch:var(--wide);text-decoration:none;color:inherit}
.rq small{display:block;font-weight:550;font-size:var(--t-xs);color:var(--text-2);font-stretch:100%;margin-top:2px}
.rq.urg{background:var(--crit);border-color:var(--crit);color:#fff}
.rq.urg small{color:#fff;opacity:.85}
.rq.call{background:var(--ink-950);border-color:var(--ink-950);color:#fff}
.rq.call small{color:var(--ink-300)}

/* Planning */
.day-h{display:flex;align-items:baseline;gap:var(--s2);padding:var(--s4) var(--s4) var(--s2);position:sticky;top:calc(62px + 6px + env(safe-area-inset-top));background:var(--bg);z-index:5}
.day-h b{font-size:var(--t-lg);font-weight:850;font-stretch:var(--wide)}
.day-h span{font-size:var(--t-xs);color:var(--text-2);font-weight:600}
.day-h.today b::after{content:"";display:inline-block;width:10px;height:10px;background:var(--signal);margin-left:8px;vertical-align:middle}
.series{display:flex;gap:var(--s2);overflow-x:auto;padding:0 var(--s4) var(--s2);scrollbar-width:none}
.serie{flex:none;width:236px;background:var(--surface);border-left:6px solid var(--sa-marine);padding:var(--s3) var(--s4);border-radius:0 var(--r2) var(--r2) 0}
.serie b{display:block;font-weight:800;font-size:var(--t-md);line-height:1.2}
.serie .when{font-size:var(--t-sm);font-weight:750;color:var(--sa-marine);margin-top:4px}
[data-theme="encre"] .serie .when{color:var(--rx-niveau)}
.serie small{display:block;color:var(--text-2);font-size:var(--t-xs);margin-top:6px}

/* Plus */
.menu-row{display:flex;align-items:center;gap:var(--s4);width:100%;min-height:80px;background:none;border:0;border-bottom:var(--rule) solid var(--line);text-align:left;padding:0 var(--s4)}
.menu-row b{display:block;font-size:var(--t-lg);font-weight:800;font-stretch:var(--wide)}
.menu-row small{display:block;font-size:var(--t-xs);color:var(--text-2)}
.menu-row .txt{flex:1}
.back{display:flex;align-items:center;gap:var(--s2);background:none;border:0;font-weight:750;min-height:var(--touch-min);padding:0 var(--s4);margin-top:var(--s2);color:var(--text-2)}

/* Hivernage */
.hv-count{display:flex;align-items:flex-end;gap:var(--s3);margin-top:var(--s4)}
.hv-count .num{font-size:var(--t-4xl);line-height:.85}
.hv-count span{font-size:var(--t-sm);color:var(--text-2);font-weight:650;padding-bottom:6px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);margin-top:var(--s2)}
.tri button{min-height:var(--touch-min);border:2px solid var(--line-strong);background:var(--bg);border-radius:var(--r2);font-weight:750;font-size:var(--t-sm)}
.tri button[aria-pressed="true"][data-v="oui"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tri button[aria-pressed="true"][data-v="non"]{background:var(--crit);border-color:var(--crit);color:#fff}
.tri button[aria-pressed="true"][data-v="na"]{background:var(--ink-600);border-color:var(--ink-600);color:#fff}
.chk{padding:var(--s4) 0;border-bottom:var(--rule) solid var(--line)}
.chk>b{font-weight:700;font-size:var(--t-md)}

/* Signature */
.sig{position:relative;border:2px solid var(--line-strong);border-radius:var(--r2);background:var(--paper);height:180px;touch-action:none}
.sig canvas{width:100%;height:100%;display:block}
.sig::after{content:"Signer ici";position:absolute;left:var(--s4);bottom:var(--s3);right:var(--s4);border-top:1.5px solid var(--ink-300);padding-top:4px;font-size:var(--t-xs);color:var(--ink-500);pointer-events:none}
.sig.signed::after{content:"Signé"}

/* Feuille (sheet) */
.sheet-bg{position:fixed;inset:0;background:rgba(5,14,23,.6);z-index:50;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--bg);border-top:6px solid var(--signal);
  max-height:88dvh;overflow:auto;padding:var(--s5) var(--s4) calc(var(--s5) + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s var(--ease)}
.sheet.on{transform:none}
.sheet-bg.on{display:block}
.sheet h3{margin:0 0 var(--s4);font-size:var(--t-xl);font-weight:900;font-stretch:var(--wide);line-height:1.1}
.search{position:relative;margin-bottom:var(--s3)}
.search input{width:100%;min-height:var(--touch);border:2px solid var(--line-strong);border-radius:var(--r2);padding:0 var(--s4) 0 48px;font-size:var(--t-md);background:var(--bg)}
.search svg{position:absolute;left:14px;top:16px;color:var(--text-2)}

.toast{position:fixed;left:var(--s4);right:var(--s4);bottom:calc(84px + env(safe-area-inset-bottom));z-index:60;max-width:528px;margin:0 auto;background:var(--ink-950);color:#fff;
  padding:var(--s4);font-weight:700;border-left:6px solid var(--signal);transform:translateY(20px);opacity:0;transition:.25s var(--ease);pointer-events:none;display:flex;gap:var(--s3);align-items:center}
.toast.on{transform:none;opacity:1}

.kv{display:grid;grid-template-columns:1fr 1fr;border-top:var(--rule) solid var(--line)}
.kv>div{padding:var(--s4) 0;border-bottom:var(--rule) solid var(--line)}
.kv>div:nth-child(odd){padding-right:var(--s3)}
.kv small{display:block;font-size:var(--t-xs);color:var(--text-2);font-weight:600}
.kv .num{font-size:var(--t-2xl);line-height:1.1}
.pill-note{font-size:var(--t-xs);color:var(--text-2);margin-top:var(--s2)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  },
  apply:function(raw,uid){

    function recOf(list){

    });
    raw.pt.filter(function(p){return p.emp===uid||norm(p.emp_nom)===norm(SEED.tech.nom);}).forEach(function(p){

function zoneOf(par,v){
  if(v==null||v==='')return 'none';
  if(par.t==='num'){if(v>=par.opt[0]&&v<=par.opt[1])return 'ok';if(v>=par.acc[0]&&v<=par.acc[1])return 'warn';return 'crit';}
  if(par.t==='bool')return v===par.bad?'crit':'ok';

}

function paramHTML(par,v){

      '<span class="scale-mark" style="left:'+(v==null?50:pct(v))+'%;'+(v==null?'opacity:.2':'')+'"></span>'+
      '<input type="range" min="'+par.min+'" max="'+par.max+'" step="'+par.step+'" value="'+(v==null?(par.opt[0]+par.opt[1])/2:v)+'" aria-label="'+esc(par.lbl)+'"></div>'+
      '<div class="scale-ticks"><span>'+fr(par.min,d)+'</span><span>'+fr(par.opt[0],d)+' – '+fr(par.opt[1],d)+'</span><span>'+fr(par.max,d)+'</span></div>';
  }else if(par.t==='bool'){
    h+='<div class="choice" style="grid-template-columns:1fr 1fr"><button data-c="oui" aria-pressed="'+(v==='oui')+'">Oui</button><button data-c="non" class="bad" aria-pressed="'+(v==='non')+'">Non</button></div>';

  }

function bindParam(par,vals){
  var box=$('[data-p="'+par.k+'"]');
  function set(v){
    vals[par.k]=v;DATA.save();
    box.outerHTML=paramHTML(par,v);bindParam(par,vals);
    renderFiche._upd&&renderFiche._upd();
  }
  if(par.t==='num'){
    var clamp=function(x){x=Math.round(x/par.step)*par.step;return Math.min(par.max,Math.max(par.min,+x.toFixed(3)));};
    $$('[data-d]',box).forEach(function(b){b.onclick=function(){
      var v=vals[par.k];if(v==null)v=(par.opt[0]+par.opt[1])/2;else v+=b.dataset.d==='+'?par.step:-par.step;
      haptic();set(clamp(v));
    };});
    var r=$('input[type=range]',box);
    r.oninput=function(){ // mise à jour légère pendant le glissement
      var v=clamp(+r.value),d=decs(par.step);vals[par.k]=v;
      $('.p-val',box).innerHTML='<span class="num">'+fr(v,d)+'</span>'+(par.u?'<span class="u">'+par.u+'</span>':'');
      $('.scale-mark',box).style.cssText='left:'+((v-par.min)/(par.max-par.min)*100)+'%';
      var z=zoneOf(par,v),vd=$('.verdict',box);vd.className='verdict '+z;vd.innerHTML=verdictTxt(par,v,z);
    };
    r.onchange=function(){set(clamp(+r.value));};
  }else{
    $$('[data-c]',box).forEach(function(b){b.onclick=function(){haptic();set(b.dataset.c);};});
  }
}
function shrink(file,max,cb){
  var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){
    var k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.72));};im.src=rd.result;};rd.readAsDataURL(file);
}

function signature(box){
  var c=$('canvas',box),ctx,drawing=false,has=false,last;
  function fit(){var r=c.getBoundingClientRect(),k=window.devicePixelRatio||1;c.width=r.width*k;c.height=r.height*k;ctx=c.getContext('2d');ctx.scale(k,k);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#050E17';}
  fit();
  function pt(e){var r=c.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
  c.addEventListener('pointerdown',function(e){drawing=true;last=pt(e);c.setPointerCapture(e.pointerId);});
  c.addEventListener('pointermove',function(e){if(!drawing)return;var p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;has=true;box.classList.add('signed');});
  c.addEventListener('pointerup',function(){drawing=false;});
  return {clear:function(){ctx.clearRect(0,0,c.width,c.height);has=false;box.classList.remove('signed');},signed:function(){return has;},data:function(){return c.toDataURL('image/png');}};
}

    '<div class="sec"><div class="sec-h"><h2>Observations</h2></div><textarea id="hvNotes" placeholder="Bris constatés, recommandations pour la réouverture…">'+esc(r.notes)+'</textarea></div>'+
    '<div class="sec"><div class="sec-h"><h2>Signature du représentant</h2></div><div class="sig" id="hvSig"><canvas></canvas></div></div>'+
    '<div class="savebar" style="margin-top:var(--s6)"><span class="note" id="hvNote"></span><button class="btn go" id="hvSend">'+ic('check')+'Remettre</button></div>';
  function upd(){var n=Object.keys(r.rep).length;$('#hvProg').textContent=n+' / '+total+' points';$('#hvBar').style.width=(n/total*100)+'%';$('#hvNote').textContent=n<total?'Brouillon enregistré sur l\'appareil.':'Complet. Signe puis remets.';}
  upd();
  $('#hvBack').onclick=function(){hvOpen=null;renderHivernage();};
  $$('.tri',el).forEach(function(g){$$('button',g).forEach(function(b){b.onclick=function(){r.rep[g.dataset.k]=b.dataset.v;$$('button',g).forEach(function(o){o.setAttribute('aria-pressed',o===b);});DATA.save();upd();haptic();};});});
  $('#hvNotes').oninput=function(e){r.notes=e.target.value;DATA.save();};
  var pad=signature($('#hvSig'));
  $('#hvSend').onclick=function(){if(Object.keys(r.rep).length<total){toast('Complète les '+total+' points');return;}if(!pad.signed()){toast('Signature requise');return;}
    r.etat='remis';r.sig=pad.data();DATA.save();DATA.enqueue();hvOpen=null;hvFiltre='afaire';toast('Rapport remis — '+x.site);renderHivernage();};
}

/* ════════════════ 5 · Demandes ════════════════ */
var REQ={materiel:{t:'Matériel',d:'Produits, pièces, outils',ph:'Quoi, combien, pour quel site?'},
  renfort:{t:'Renfort',d:'Un collègue sur place',ph:'Pourquoi, combien de temps?'},
  urgence:{t:'Urgence',d:'Bris, fuite, fermeture',ph:'Que se passe-t-il? Le bassin est-il fermé?'}};
function renderDemandes(){
  var el=$('#s-demandes'), st=DATA.state;
  $('#topSub').textContent='Le bureau répond en direct';
  el.innerHTML='<div class="sec" style="padding-top:var(--s5)"><div class="req-grid">'+
    '<button class="rq" data-req="materiel">'+ic('box','lg')+'<span>Matériel<small>'+REQ.materiel.d+'</small></span></button>'+
    '<button class="rq" data-req="renfort">'+ic('people','lg')+'<span>Renfort<small>'+REQ.renfort.d+'</small></span></button>'+
    '<button class="rq urg" data-req="urgence">'+ic('alert','lg')+'<span>Urgence<small>'+REQ.urgence.d+'</small></span></button>'+
    '<a class="rq call" href="tel:'+SEED.tech.tel_bureau+'">'+ic('phone','lg')+'<span>Appeler le bureau<small>418 872-1234</small></span></a>'+
    '</div></div>'+
    (DATA.mode!=='demo'?'<div class="mode-note" style="margin:var(--s4) 0 0">Mode essai : les demandes restent sur ton téléphone. Pour une vraie urgence, appelle le bureau.</div>':'')+
    '<div class="sec"><div class="sec-h"><h2>Mes demandes</h2><small>'+st.demandes.length+'</small></div><ul class="ledger">'+
    st.demandes.slice().reverse().map(function(d){return '<li><div class="lrow" style="grid-template-columns:auto 1fr"><span>'+ic({materiel:'box',renfort:'people',urgence:'alert'}[d.type],'lg')+'</span><span><b>'+esc(d.txt)+'</b><span class="meta">'+esc(REQ[d.type].t)+' · '+esc(d.quand)+'<span class="chip '+(d.etat==='Envoyée'?'warn':'ok')+'">'+esc(d.etat)+'</span></span></span></div></li>';}).join('')+
    '</ul></div>';
}
function openDemande(type){
  var r=REQ[type], p=DATA.state.punch, site=p.site?DATA.site(p.site):null;
  openSheet('<h3 id="sheetTitle" style="'+(type==='urgence'?'color:var(--crit)':'')+'">'+r.t+'</h3>'+
    '<label class="field"><span>Site</span><select id="rqSite">'+SEED.sites.map(function(s){return '<option value="'+s.id+'"'+(site&&s.id===site.id?' selected':'')+'>'+esc(s.nom)+'</option>';}).join('')+'</select></label>'+
    '<label class="field"><span>Détails</span><textarea id="rqTxt" placeholder="'+esc(r.ph)+'"></textarea></label>'+
    '<div class="row2"><button class="btn ghost" id="rqNo">Annuler</button><button class="btn '+(type==='urgence'?'crit':'go')+'" id="rqYes">Envoyer</button></div>');
  $('#rqNo').onclick=closeSheet;
  $('#rqYes').onclick=function(){var t=$('#rqTxt').value.trim();if(!t){$('#rqTxt').focus();return;}
    DATA.state.demandes.push({id:'d-'+Date.now(),type:type,txt:t,quand:'À l\'instant',etat:'Envoyée'});DATA.save();DATA.enqueue();closeSheet();toast(DATA.mode==='demo'?r.t+' envoyée au bureau':r.t+' notée (essai — non envoyée)');if(cur==='demandes')renderDemandes();};
  setTimeout(function(){$('#rqTxt').focus();},300);
}

/* ════════════════ 6 · Planning personnel ════════════════ */
function renderPlanning(){
  var el=$('#s-planning');
  $('#topSub').textContent='14 prochains jours';
  var base=new Date();base.setHours(12,0,0,0);var days=[];
  for(var i=0;i<14;i++){var d=new Date(base);d.setDate(base.getDate()+i);var iso=isoDay(d);
    days.push({d:d,i:i,jobs:SEED.agenda.filter(function(j){return j.date===iso;})});}
  var total=days.reduce(function(a,x){return a+x.jobs.length;},0);
  el.innerHTML=(SEED.series.length?'<div class="sec" style="padding-top:var(--s5)"><div class="sec-h"><h2>Mes visites récurrentes</h2><small>'+SEED.series.length+' série'+(SEED.series.length>1?'s':'')+'</small></div></div>'+
    '<div class="series">'+SEED.series.map(function(s){return '<div class="serie"><b>'+esc(s.titre)+'</b><div class="when">'+ic('repeat','sm')+' '+esc(s.quand)+(s.h?' · '+s.h:'')+'</div><small>Jusqu\'au '+esc(s.jusqua)+' — '+s.reste+' visite'+(s.reste>1?'s':'')+' restante'+(s.reste>1?'s':'')+'</small></div>';}).join('')+'</div>':'')+
    (total?'':'<div class="mode-note">Aucun job assigné dans les 14 prochains jours.</div>')+
    days.map(function(x){
      if(!x.jobs.length&&(x.d.getDay()===0||x.d.getDay()===6))return '';
      var lbl=x.i===0?"Aujourd'hui":x.i===1?'Demain':x.d.toLocaleDateString('fr-CA',{weekday:'long'});
      return '<div class="day-h '+(x.i===0?'today':'')+'"><b>'+lbl.charAt(0).toUpperCase()+lbl.slice(1)+'</b><span>'+x.d.toLocaleDateString('fr-CA',{day:'numeric',month:'long'})+' · '+x.jobs.length+' job'+(x.jobs.length>1?'s':'')+'</span></div>'+
        '<div style="padding:0 var(--s4)"><ul class="ledger">'+(x.jobs.length?x.jobs.map(function(j){var s=DATA.site(j.site);return '<li><div class="lrow '+(j.etat==='fait'?'done':'')+'" style="grid-template-columns:auto 1fr;min-height:64px">'+(j.h?'<span class="t num">'+j.h+'</span>':'<span class="t num none">—</span>')+'<span><b>'+esc(s?s.nom:'Site')+'</b><span class="meta">'+esc(j.type)+(j.desc?'<span class="d">'+esc(j.desc)+'</span>':'')+(j.rec?'<span class="chip rec">'+ic('repeat','sm')+esc(j.rec)+'</span>':'')+'</span></span></div></li>';}).join(''):'<li><div class="lrow" style="grid-template-columns:1fr;min-height:52px;color:var(--text-3)">Rien de prévu</div></li>')+'</ul></div>';
    }).join('');
}

/* ════════════════ 7 · Profil ════════════════ */
function renderProfil(){
  var el=$('#s-profil'),st=DATA.state,t=SEED.tech;
  $('#topSub').textContent=t.role;
  el.innerHTML='<button class="back" data-go="plus">'+ic('back','sm')+'Plus</button>'+
    '<div class="sec" style="padding-top:var(--s2)"><h1 class="h">'+esc(t.nom)+'</h1><p class="lede">'+esc(t.role)+' · '+esc(t.vehicule)+'</p></div>'+
    '<div class="sec"><div class="sec-h"><h2>Ma semaine</h2><small>lun. → aujourd\'hui</small></div>'+
    '<div class="kv"><div><small>Heures punchées</small><span class="num">'+fmtH(SEED.semaine.heures)+'</span></div><div><small>Visites</small><span class="num">'+SEED.semaine.visites+'</span></div>'+
    '<div><small>Relevés saisis</small><span class="num">'+(SEED.semaine.releves+st.releves.length)+'</span></div><div><small>Rapports hivernage</small><span class="num">'+Object.keys(st.hv).filter(function(k){return st.hv[k].etat==='remis';}).length+'</span></div></div>'+
    '<p class="pill-note">Heures à titre indicatif. La feuille de temps officielle est calculée et validée au bureau.</p></div>'+
    '<div class="sec"><div class="sec-h"><h2>Affichage</h2></div>'+
    '<div class="field"><span>Thème</span><div class="seg" style="margin-top:0" data-pref="theme"><button data-v="papier" aria-pressed="'+(st.pref.theme==='papier')+'">Plein jour</button><button data-v="encre" aria-pressed="'+(st.pref.theme==='encre')+'">Soir</button></div></div>'+
    '<div class="field"><span>Taille du texte</span><div class="seg" style="margin-top:0" data-pref="size"><button data-v="normal" aria-pressed="'+(st.pref.size==='normal')+'">Normale</button><button data-v="grand" aria-pressed="'+(st.pref.size==='grand')+'">Grande</button></div></div></div>'+
    '<div class="sec"><div class="sec-h"><h2>Données</h2></div><p style="margin:0 0 var(--s4)">'+modeTxt()+'</p>'+
    (DATA.mode!=='demo'?'<button class="btn ghost block" id="whoami" style="margin-bottom:var(--s3)">'+ic('user')+'Changer d\'utilisateur</button>':'')+
    '<p style="margin:0 0 var(--s4)">'+(st.queue?'<b>'+st.queue+'</b> élément'+(st.queue>1?'s':'')+'  gardé'+(st.queue>1?'s':'')+' sur l\'appareil (mode essai, rien n\'est envoyé).':'Aucune saisie locale.')+'</p>'+
    '<button class="btn ghost block" id="doSync">Recharger les données</button></div>'+
    '<div class="sec" style="padding-bottom:var(--s8)"><button class="btn block" id="logout">Se déconnecter</button><p class="pill-note mono">La Tournée · v1.1.0-lecture</p></div>';
  $$('[data-pref]',el).forEach(function(g){$$('button',g).forEach(function(b){b.onclick=function(){st.pref[g.dataset.pref]=b.dataset.v;DATA.save();applyPrefs();renderProfil();};});});
  $('#doSync').onclick=function(){if(!navigator.onLine){toast('Hors ligne — nouvel essai au retour du réseau');return;}boot(true);};
  if($('#whoami'))$('#whoami').onclick=function(){var c=REAL.cache();if(c)pickUser(c);};
  $('#logout').onclick=function(){toast('Déconnexion — branchée en phase 2');};
}
function applyPrefs(){
  var p=DATA.state.pref;document.documentElement.dataset.theme=p.theme;document.documentElement.dataset.size=p.size;
  $('meta[name=theme-color]').content=p.theme==='encre'?'#050E17':'#004987';
}

/* ════════════════ Feuille / synchro ════════════════ */
function openSheet(html){$('#sheet').innerHTML=html;$('#sheetBg').classList.add('on');requestAnimationFrame(function(){$('#sheet').classList.add('on');});}
function closeSheet(){$('#sheet').classList.remove('on');$('#sheetBg').classList.remove('on');}
$('#sheetBg').onclick=closeSheet;
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});
function modeTxt(){
  if(DATA.mode==='reel')return 'Données réelles de SOUCY OPS, en lecture seule (chargées à '+new Date(DATA.realAt).toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'})+').';
  if(DATA.mode==='cache')return 'Hors ligne : copie des données réelles du '+new Date(DATA.realAt).toLocaleString('fr-CA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})+'.';
  return 'Données de démonstration (serveur injoignable).';
}
var UI={sync:function(){
  var b=$('#sync'),m=DATA.mode;
  b.dataset.s=m==='reel'?'online':m==='cache'?'offline':'queue';
  $('span',b).textContent=m==='reel'?'Réel · lecture':m==='cache'?'Hors ligne':'Démo';
}};
$('#sync').onclick=function(){go('profil');};
window.addEventListener('online',UI.sync);window.addEventListener('offline',UI.sync);

/* ════════════════ Démarrage ════════════════ */
function pickUser(raw){
  var list=raw.comptes.filter(function(c){return c.role!=='admin';}).sort(function(a,b){return (a.prenom||'').localeCompare(b.prenom||'','fr');});
  openSheet('<h3 id="sheetTitle">Qui es-tu?</h3><p class="lede" style="margin:0 0 var(--s4)">Pour afficher tes jobs et ton planning. Mode essai : rien n\'est envoyé.</p><ul class="ledger">'+
    list.map(function(c){return '<li><button class="lrow" data-u="'+esc(c.id)+'"><span>'+ic('user','lg')+'</span><span><b>'+esc(((c.prenom||'')+' '+(c.nom||'')).trim()||c.id)+'</b><span class="meta">'+esc({employe:'Employé·e',superviseur:'Superviseur·e'}[c.role]||c.role||'')+'</span></span><span class="go-ic">'+ic('chev')+'</span></button></li>';}).join('')+'</ul>');
  $$('[data-u]',$('#sheet')).forEach(function(b){b.onclick=function(){DATA.state.uid=b.dataset.u;DATA.state.fiche=null;DATA.save();closeSheet();useReal(raw,'reel');};});
}
function useReal(raw,mode){
  if(!DATA.state.uid||!REAL.apply(raw,DATA.state.uid)){pickUser(raw);return;}
  DATA.mode=mode;DATA.realAt=raw.at;UI.sync();go(cur);
}
function boot(manual){
  var c=REAL.cache();
  if(c&&DATA.state.uid&&!manual)useReal(c,'cache');
  REAL.load().then(function(raw){useReal(raw,'reel');if(manual)toast('Données rechargées');})
    .catch(function(e){
      if(c){if(DATA.state.uid)useReal(c,'cache');else pickUser(c);}
      else{DATA.mode='demo';UI.sync();}
      if(manual||!c)toast('Serveur injoignable — '+(c?'copie locale':'démonstration'));
    });
}
applyPrefs();UI.sync();go('today');boot(false);
if('serviceWorker' in navigator&&location.protocol!=='file:'){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
