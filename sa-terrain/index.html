<!doctype html>
<html lang="fr-CA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirection — Soucy Aquatik</title>
<meta http-equiv="refresh" content="0; url=/terrain.html">
<script>
/* Ancien prototype retiré (03/10/2026) : l'app est maintenant /terrain.html.
   On désinstalle l'ancien service worker de ce dossier pour qu'aucune vieille copie ne soit plus affichée. */
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(/\/sa-terrain\//.test(r.scope))r.unregister();});});}catch(e){}
try{if(window.caches)caches.keys().then(function(ks){ks.forEach(function(k){if(/^sa-terrain-/.test(k))caches.delete(k);});});}catch(e){}
location.replace('/terrain.html'+location.search+location.hash);
</script></head>
<body style="font:16px system-ui,sans-serif;padding:24px">Cette adresse a changé. <a href="/terrain.html">Ouvrir la nouvelle version</a>.</body></html>
