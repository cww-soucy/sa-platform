<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte des sites — sa-admin</title>
<link rel="stylesheet" href="_ds/industry-e3224710-254a-4f99-a32f-75085300326e/styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<script src="sa-data.js"></script>
<style>
  html,body,#map{height:100%;margin:0}
  body{background:var(--color-bg)}
  .leaflet-container{background:var(--color-bg);font-family:var(--font-body)}
  .leaflet-tile-pane{filter:grayscale(1) contrast(.85) brightness(1.06)}
  .leaflet-tile-pane::after{content:""}
  .sa-site{box-sizing:border-box;width:14px;height:14px;border:1.5px solid var(--color-text);background:var(--color-bg)}
  .sa-site.fait{background:var(--color-accent-700);border-color:var(--color-accent-800)}
  .sa-site.alerte{background:repeating-linear-gradient(135deg,var(--color-text) 0 1.5px,var(--color-bg) 1.5px 4px)}
  .sa-tech{box-sizing:border-box;width:30px;height:30px;background:var(--color-text);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font:600 13px var(--font-heading);box-shadow:0 0 0 2px var(--color-bg),0 0 0 3.5px var(--color-text)}
  .sa-tech.route{background:var(--color-bg);color:var(--color-text);border:1.5px solid var(--color-text)}
  .leaflet-popup-content-wrapper{border-radius:0;border:1px solid var(--color-text);box-shadow:var(--shadow-md);background:var(--color-bg)}
  .leaflet-popup-tip{background:var(--color-bg);border:1px solid var(--color-text)}
  .leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.4}
  .leaflet-popup-content b{font:600 16px var(--font-heading);display:block;margin-bottom:2px}
  .leaflet-bar a{border-radius:0!important;color:var(--color-text)}
  .leaflet-bar{border-radius:0!important;border:1px solid var(--color-text)!important}
  .leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--color-bg) 85%,transparent)!important}
  .leaflet-control-attribution a{color:var(--color-accent-700)}
</style>
</head>
<body>
<div id="map"></div>
<script>
  const D = window.SA_DATA;
  const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([45.55, -72.25], 9);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 18, referrerPolicy: 'origin' }).addTo(map);
  const visited = new Set(['S02', 'S07', 'S08', 'S09', 'S12', 'S01', 'S15', 'S14', 'S19', 'S21']);
  const bounds = [];
  D.SITES.forEach(s => {
    const sal = D.SALLES[s.id];
    const cls = sal && [sal.pompe, sal.filtre, sal.dosage].includes('alerte') ? 'alerte' : visited.has(s.id) ? 'fait' : '';
    const icon = L.divIcon({ className: '', html: '<div class="sa-site ' + cls + '"></div>', iconSize: [14, 14], iconAnchor: [7, 7] });
    const t = D.tech(s.tech);
    L.marker([s.lat, s.lng], { icon }).addTo(map).bindPopup('<b>' + s.nom + '</b>' + D.TYPES[s.type].label + '<br>' + s.client + ' · ' + s.ville + '<br>Contrat ' + s.contrat + ' · ' + s.freq + '<br>Technicien : ' + t.nom + (sal && sal.note ? '<br><strong>' + sal.note + '</strong>' : ''));
    bounds.push([s.lat, s.lng]);
  });
  D.TECHS.filter(t => t.lat).forEach(t => {
    const s = t.site && D.site(t.site);
    const icon = L.divIcon({ className: '', html: '<div class="sa-tech ' + (t.statut === 'en route' ? 'route' : '') + '">' + t.ini + '</div>', iconSize: [30, 30], iconAnchor: [15, 15] });
    const off = t.statut === 'en route' ? 0 : 0.004;
    L.marker([t.lat + off, t.lng + off], { icon, zIndexOffset: 1000 }).addTo(map).bindPopup('<b>' + t.nom + '</b>' + (t.statut === 'punché' ? 'Punché depuis ' + t.depuis : t.statut === 'en route' ? 'En route depuis ' + t.depuis + ' → ' + (s ? s.nom : '') : 'En pause depuis ' + t.depuis) + (s ? '<br>' + s.nom + ' · ' + s.ville : '') + '<br>' + t.tel);
  });
  map.fitBounds(bounds, { padding: [40, 40] });
</script>
</body>
</html>
