<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SA Terrain"><meta name="theme-color" content="#f2f2f3">
<title>SA Terrain — La Tournée</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Industry — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.blueprint {
  position: relative;
  border: 1px solid var(--color-divider);
  border-radius: 0;
}
/* The overlay image treatments (halftone, duotone) clip their overlay
   (overflow:hidden); a blueprint wrapper draws its registration marks
   outside the box, so when both classes share a wrapper the frame must
   win. */
.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after {
  content: ""; position: absolute; background: currentColor;
}
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.duotone{position:relative;overflow:hidden}
.duotone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--color-accent);mix-blend-mode:color}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* — blueprint frame: components are wireframe objects (see .blueprint
     and .corner above) — square, transparent, hairline-bordered — */
.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }
.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }
.btn { border: 1px solid var(--color-divider); }
.btn-primary { border-color: var(--color-accent); }
.btn-ghost { border-color: transparent; }


html,body{margin:0;height:100%;background:var(--color-bg);-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{position:fixed;inset:0}
#app>div{height:100%}
button{font-family:inherit}
#login{position:fixed;inset:0;background:var(--color-bg);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#login form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:16px}
#login h1{margin:0;font-size:44px;line-height:1}
#login .input{font-size:18px;min-height:52px}
[data-hv="1"]:hover{background:var(--color-accent-100) !important}
[data-hv="2"]:hover{background:var(--color-accent-100) !important}
[data-hv="3"]:hover{background:var(--color-accent-100) !important}
[data-hv="4"]:hover{background:var(--color-accent-100) !important}
[data-hv="5"]:hover{background:var(--color-accent-100) !important}
[data-ac="6"]:active{background:var(--color-accent-200) !important}
[data-ac="7"]:active{background:var(--color-accent-200) !important}
[data-ac="8"]:active{background:var(--color-accent-100) !important}
[data-ac="9"]:active{background:var(--color-accent-200) !important}
[data-ac="10"]:active{background:var(--color-accent-200) !important}
[data-ac="11"]:active{background:var(--color-accent-100) !important}
</style></head><body>
<div id="app"></div>
<div id="login"><form id="loginForm" autocomplete="on">
<div style="font:400 14px var(--font-body);color:var(--color-accent-700)">Soucy Aquatik · sa-terrain</div>
<h1>La Tournée</h1>
<div class="field"><label style="font-size:15px">Identifiant</label><input id="lu" class="input" autocomplete="username" autocapitalize="off" autocorrect="off"></div>
<div class="field"><label style="font-size:15px">Mot de passe</label><input id="lp" class="input" type="password" autocomplete="current-password"></div>
<div id="le" style="min-height:22px;font-size:15px"></div>
<button class="btn btn-primary" type="submit" style="min-height:58px;font-size:20px">Se connecter</button>
</form></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" style="display:none">
<template id="tpl">    <div ref="{{ rootRef }}" style="height:100%;display:flex;flex-direction:column;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:17px;line-height:1.4;position:relative">
      <div style="height:max(env(safe-area-inset-top),8px);flex:none"></div>

      <div style="flex:none;display:flex;align-items:center;gap:12px;padding:6px 20px 10px;border-bottom:1px solid var(--color-divider)">
        <div style="width:46px;height:46px;background:#004987;color:#ffffff;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:600 11px/0.95 var(--font-heading);letter-spacing:0.01em">Soucy<br>Aquatik</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column">
          <div style="font:600 18px/1.1 var(--font-heading)">{{ headerTitle }}</div>
          <div style="font-size:13px;display:flex;align-items:center;gap:5px;color:var(--color-accent-700)"><sa-i n="cloudoff" s="14"></sa-i>{{ syncLbl }}</div>
        </div>
        <button onClick="{{ toggleSun }}" aria-label="Mode plein soleil" style="all:unset;cursor:pointer;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider);background:{{ sunBtnBg }};color:{{ sunBtnFg }}"><sa-i n="sun" s="24"></sa-i></button>
      </div>

      <div ref="{{ contentRef }}" style="flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none">

        <!-- ═════ AUJOURD'HUI ═════ -->
        <sc-if value="{{ isToday }}">
          <div style="padding:20px;display:flex;flex-direction:column;gap:24px">
            <div style="display:flex;flex-direction:column;gap:2px">
              <h1 style="margin:0;font-size:38px;line-height:1">{{ todayTxt }}</h1>
              <div style="font-size:16px">Tournée · {{ jobCount }} arrêts · {{ doneTxt }}</div>
            </div>

            <sc-if value="{{ hasPunch }}">
              <div class="blueprint" style="padding:18px;display:flex;flex-direction:column;gap:14px">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <div style="display:flex;align-items:center;gap:8px;font-size:15px">
                  <span style="width:10px;height:10px;background:var(--color-accent);flex:none"></span>
                  <span>{{ punchLbl }}</span><span style="margin-left:auto;font:600 18px var(--font-heading)">{{ punchElapsed }}</span>
                </div>
                <div style="display:flex;flex-direction:column;gap:4px">
                  <div style="font:600 30px/1.02 var(--font-heading);text-wrap:balance">{{ cur.nom }}</div>
                  <div style="font-size:15px">{{ cur.typeLabel }} · {{ cur.ville }}</div>
                </div>
                <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider)">
                  <div style="padding:10px 0;display:flex;flex-direction:column"><span style="font:600 26px/1 var(--font-heading)">{{ cur.nFields }}</span><span style="font-size:13px">relevés</span></div>
                  <div style="padding:10px 12px;border-left:1px solid var(--color-divider);display:flex;flex-direction:column"><span style="font:600 26px/1 var(--font-heading)">{{ cur.nTouched }}</span><span style="font-size:13px">saisis</span></div>
                  <div style="padding:10px 12px;border-left:1px solid var(--color-divider);display:flex;flex-direction:column"><span style="font:600 26px/1 var(--font-heading)">{{ cur.nOut }}</span><span style="font-size:13px">hors zone</span></div>
                </div>
                <button class="btn btn-primary" onClick="{{ goFiche }}" style="min-height:58px;font-size:20px;gap:10px"><sa-i n="clipboard" s="24"></sa-i>Ouvrir la fiche technique</button>
                <button class="btn btn-secondary" onClick="{{ depunch }}" style="min-height:52px;font-size:18px;gap:10px"><sa-i n="logout" s="22"></sa-i>Retour à la tournée</button>
              </div>
            </sc-if>
            <sc-if value="{{ noPunch }}">
              <div class="blueprint" style="padding:18px;display:flex;flex-direction:column;gap:12px">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <div style="font-size:15px">Aucun punch actif — punchez dans SA Platform</div>
                <div style="font:600 28px/1.05 var(--font-heading)">{{ nextJob.nom }}</div>
                <div style="font-size:15px;display:flex;align-items:center;gap:6px"><sa-i n="pin" s="16"></sa-i><span>Prochain arrêt · {{ nextJob.h }} · {{ nextJob.ville }}</span></div>
                <button class="btn btn-primary" onClick="{{ nextJob.punch }}" style="min-height:58px;font-size:20px;gap:10px"><sa-i n="login" s="24"></sa-i>Ouvrir la fiche</button>
              </div>
            </sc-if>

            <div style="display:flex;flex-direction:column;gap:8px">
              <h3 style="margin:0;font-size:24px">Tournée</h3><sc-if value="{{ emptyDay }}"><div style="padding:4px 0 12px;font-size:17px;line-height:1.4">Aucun arrêt planifié pour vous aujourd’hui. Consultez le Planning ou appelez le bureau.</div></sc-if>

              <div style="position:relative;display:flex;flex-direction:column">
                <div style="position:absolute;left:15px;top:22px;bottom:22px;width:1px;background:var(--color-text)"></div>
                <sc-for list="{{ jobs }}" as="j">
                  <div style="display:flex;align-items:center;gap:14px;padding:10px 0;position:relative;border-bottom:1px solid var(--color-divider)">
                    <div style="width:31px;height:31px;flex:none;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1.5px solid var(--color-text);background:{{ j.nodeBg }};color:var(--color-bg);position:relative;z-index:1">
                      <sc-if value="{{ j.isDone }}"><sa-i n="check" s="18" w="2.5"></sa-i></sc-if>
                      <sc-if value="{{ j.isCur }}"><span style="width:9px;height:9px;background:var(--color-bg)"></span></sc-if>
                    </div>
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;opacity:{{ j.op }}">
                      <div style="display:flex;gap:8px;align-items:baseline"><span style="font:600 18px var(--font-heading)">{{ j.h }}</span><span style="font-size:13px">{{ j.typeCourt }}</span></div>
                      <div style="font-size:16px;font-weight:{{ j.fw }};line-height:1.25">{{ j.nom }}</div>
                    </div>
                    <sc-if value="{{ j.canPunch }}">
                      <button onClick="{{ j.punch }}" style="all:unset;cursor:pointer;min-width:64px;height:48px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider);font:600 16px var(--font-heading)" data-hv="1">Fiche</button>
                    </sc-if>
                    <sc-if value="{{ j.isCur }}"><span style="font:600 15px var(--font-heading);color:var(--color-accent-700)">En cours</span></sc-if>
                  </div>
                </sc-for>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)">

              <button onClick="{{ goHiv }}" style="all:unset;cursor:pointer;background:var(--color-bg);padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between" data-hv="3"><sa-i n="snow" s="28"></sa-i><span style="font:600 20px/1.1 var(--font-heading)">Hivernage <span style="font-weight:400">Bientôt</span></span></button>
              <button onClick="{{ goDemandes }}" style="all:unset;cursor:pointer;background:var(--color-bg);padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between" data-hv="4"><sa-i n="message" s="28"></sa-i><span style="font:600 20px/1.1 var(--font-heading)">Demande</span></button>

        <!-- ═════ FICHE TECHNIQUE ═════ -->

              <h1 style="margin:0;font-size:34px;line-height:1;text-wrap:balance">{{ cur.nom }}</h1>

              <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">

            <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--color-divider)">

              <div style="padding:12px 14px;border-left:1px solid var(--color-divider);display:flex;flex-direction:column"><span style="font:600 28px/1 var(--font-heading)">{{ cur.nChecks }}/{{ cur.nChecksTotal }}</span><span style="font-size:13px">vérifs</span></div>

            <div style="padding:22px 20px 6px;display:flex;align-items:baseline;justify-content:space-between"><h3 style="margin:0;font-size:24px">Relevés</h3><span style="font-size:13px">Zones du contrat {{ cur.contrat }}</span></div>

                  <sc-if value="{{ f.ok }}"><span style="font-size:13px;padding:4px 8px;border:1px solid var(--color-accent);color:var(--color-accent-700);display:flex;align-items:center;gap:4px;white-space:nowrap"><sa-i n="check" s="14" w="2"></sa-i>Dans la zone</span></sc-if>
                  <sc-if value="{{ f.bad }}"><span style="font-size:13px;padding:4px 8px;background:var(--color-accent-900);color:var(--color-bg);display:flex;align-items:center;gap:4px;font-weight:500"><sa-i n="alert" s="14" w="2"></sa-i>{{ f.badTxt }}</span></sc-if>

                  <div style="display:flex;flex-direction:column;gap:4px">
                    <div onPointerDown="{{ f.onRuler }}" onPointerMove="{{ f.onRuler }}" style="position:relative;height:44px;touch-action:none;cursor:pointer;border-left:1px solid var(--color-text);border-right:1px solid var(--color-text)">
                      <div style="position:absolute;left:0;right:0;bottom:0;height:10px;background-image:repeating-linear-gradient(90deg,var(--color-text) 0 1px,transparent 1px 10%);opacity:0.6"></div>

                      <div style="position:absolute;top:6px;bottom:10px;left:{{ f.loPct }}%;width:{{ f.bandW }}%;background:repeating-linear-gradient(135deg,var(--color-accent-300) 0 1.5px,transparent 1.5px 6px),var(--color-accent-100);border-left:1.5px solid var(--color-accent-700);border-right:1.5px solid var(--color-accent-700);box-sizing:border-box"></div>
                      <div style="position:absolute;top:0;bottom:0;left:{{ f.pct }}%;width:3px;margin-left:-1.5px;background:var(--color-text)"><div style="position:absolute;top:0;left:-5px;width:13px;height:9px;background:var(--color-text)"></div></div>
                    </div>
                    <div style="position:relative;height:18px;font-size:13px">
                      <span style="position:absolute;left:0">{{ f.minTxt }}</span>
                      <span style="position:absolute;left:{{ f.loPct }}%;transform:translateX(-50%);font-weight:600;color:var(--color-accent-800)">{{ f.loTxt }}</span>
                      <span style="position:absolute;left:{{ f.hiPct }}%;transform:translateX(-50%);font-weight:600;color:var(--color-accent-800)">{{ f.hiTxt }}</span>
                      <span style="position:absolute;right:0">{{ f.maxTxt }}</span>
                    </div>
                  </div>
                </sc-if>
                <sc-if value="{{ f.isCount }}"><div style="font-size:14px">Zone du contrat : {{ f.zoneTxt }} {{ f.unit }}</div></sc-if>

            </sc-for>

            <div style="padding:26px 20px 8px"><h3 style="margin:0;font-size:24px">Vérifications</h3></div>

                <span style="font-size:17px;line-height:1.3">{{ c.label }}</span>

            <div style="padding:26px 20px 8px"><h3 style="margin:0;font-size:24px">Produits ajoutés</h3></div>

              <div style="display:flex;align-items:center;gap:10px;padding:10px 20px;border-bottom:1px solid var(--color-divider)">
                <div style="flex:1;min-width:0;font-size:16px;line-height:1.25">{{ p.nom }}</div>
                <button onClick="{{ p.minus }}" aria-label="Moins" style="all:unset;cursor:pointer;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider)" data-ac="9"><sa-i n="minus" s="24" w="2"></sa-i></button>
                <div style="width:66px;text-align:center;display:flex;flex-direction:column;line-height:1"><span style="font:600 26px var(--font-heading)">{{ p.qty }}</span><span style="font-size:12px">{{ p.unite }}</span></div>
                <button onClick="{{ p.plus }}" aria-label="Plus" style="all:unset;cursor:pointer;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider)" data-ac="10"><sa-i n="plus" s="24" w="2"></sa-i></button>
              </div>
            </sc-for>

            <div style="padding:26px 20px 20px;display:flex;flex-direction:column;gap:12px">

              <button onClick="{{ takePhoto }}" class="blueprint" style="all:unset;cursor:pointer;position:relative;border:1px solid var(--color-divider);height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:{{ photoBg }}">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <sa-i n="camera" s="34"></sa-i>
                <span style="font:600 19px var(--font-heading);background:var(--color-bg);padding:0 6px">{{ photoTitle }}</span>
                <span style="font-size:14px;background:var(--color-bg);padding:0 6px">{{ photoSub }}</span>
              </button>
              <textarea class="input" value="{{ noteTxt }}" onChange="{{ onNote }}" placeholder="Note pour le bureau ou le prochain technicien" style="min-height:96px;font-size:17px"></textarea>
            </div>

            <div style="position:sticky;bottom:0;padding:14px 20px 16px;background:var(--color-bg);border-top:1px solid var(--color-divider);display:flex;flex-direction:column;gap:8px">
              <sc-if value="{{ cur.notValidated }}">
                <sc-if value="{{ cur.hasOut }}"><div style="font-size:14px;display:flex;align-items:center;gap:6px"><sa-i n="alert" s="16"></sa-i><span>{{ cur.nOut }} valeur(s) hors zone — signalez-le au bureau.</span></div></sc-if>
                <button class="btn btn-primary" onClick="{{ validate }}" style="min-height:60px;font-size:21px;width:100%">Valider la fiche</button>
              </sc-if>
              <sc-if value="{{ cur.isValidated }}">
                <div style="display:flex;align-items:center;gap:8px;font-size:15px"><sa-i n="check" s="20" w="2"></sa-i><span>Fiche validée à {{ cur.validAt }} · {{ cur.syncTxt }}</span></div>
                <button class="btn btn-primary" onClick="{{ depunch }}" style="min-height:60px;font-size:21px;width:100%;gap:10px"><sa-i n="logout" s="24"></sa-i>Retour à la tournée</button>
              </sc-if>
            </div>
          </div>
        </sc-if>

        <!-- ═════ LOGISTIQUE ═════ -->
        <sc-if value="{{ isSoon }}"><div style="padding:24px 20px;display:flex;flex-direction:column;gap:16px">
<h1 style="margin:0;font-size:38px;line-height:1">{{ soonTitle }}</h1>
<p style="margin:0;font-size:17px;line-height:1.45">Cette section arrive bientôt dans sa-terrain. En attendant, elle reste disponible dans SA Platform.</p>

<button class="btn btn-secondary" onClick="{{ goToday }}" style="min-height:58px;font-size:20px">Retour à la tournée</button>
</div></sc-if>
<sc-if value="{{ isLog }}">
          <div style="padding:12px 20px 24px;display:flex;flex-direction:column;gap:18px">
            <button onClick="{{ goToday }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:4px;height:44px;font-size:16px;color:var(--color-accent-700)"><sa-i n="left" s="22"></sa-i>Aujourd’hui</button>

              <button onClick="{{ tabSortie }}" style="all:unset;cursor:pointer;text-align:center;height:52px;font:600 18px var(--font-heading);background:{{ sortieTabBg }};color:{{ sortieTabFg }}">Sortie d’inventaire</button>
              <button onClick="{{ tabBon }}" style="all:unset;cursor:pointer;text-align:center;height:52px;font:600 18px var(--font-heading);border-left:1px solid var(--color-divider);background:{{ bonTabBg }};color:{{ bonTabFg }}">Bon de livraison</button>

              <div style="display:flex;flex-direction:column;gap:0">

                  <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--color-divider)">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:16px;line-height:1.25">{{ p.nom }}</span><span style="font-size:13px">En camion : {{ p.reste }} {{ p.unite }}</span></div>
                    <button onClick="{{ p.minus }}" aria-label="Moins" style="all:unset;cursor:pointer;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider)"><sa-i n="minus" s="22" w="2"></sa-i></button>
                    <span style="width:44px;text-align:center;font:600 24px var(--font-heading)">{{ p.qty }}</span>
                    <button onClick="{{ p.plus }}" aria-label="Plus" style="all:unset;cursor:pointer;width:50px;height:50px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider)"><sa-i n="plus" s="22" w="2"></sa-i></button>
                  </div>
                </sc-for>
                <button class="btn btn-primary" onClick="{{ saveSortie }}" style="min-height:58px;font-size:20px;margin-top:14px"><span>Enregistrer la sortie · {{ sortieCount }} article(s)</span></button>
              </div>
            </sc-if>
            <sc-if value="{{ isBon }}">

                <div style="display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--color-divider);padding-bottom:12px">

                  <div style="display:flex;justify-content:space-between;font-size:16px;padding:4px 0"><span>{{ b.nom }}</span><span style="font:600 18px var(--font-heading)">{{ b.qty }} {{ b.unite }}</span></div>

                  <canvas ref="{{ sigRef }}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none;color:var(--color-text)"></canvas>
                  <div style="position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px solid var(--color-text);pointer-events:none"></div>
                  <span style="position:absolute;left:16px;bottom:10px;font-size:13px;pointer-events:none">Signez ici avec le doigt</span>

                    <button class="btn btn-primary" onClick="{{ confirmSig }}" style="min-height:56px;font-size:18px">Confirmer la signature</button>

                <sc-if value="{{ isSigned }}">
                  <div style="padding:14px;border:1px solid var(--color-accent);display:flex;gap:10px;align-items:center;font-size:16px"><sa-i n="check" s="22" w="2"></sa-i><span>Signé par {{ signedBy }} à {{ signedAt }} — copie envoyée au client</span></div>
                </sc-if>
              </div>
            </sc-if>
          </div>
        </sc-if>

                  <div style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-size:17px;line-height:1.25">{{ h.nom }}</span><span style="font-size:14px">{{ h.ville }} · {{ h.statutTxt }}</span></div>

                </button>

        <sc-if value="{{ isHivForm }}">

                <span style="width:32px;height:32px;flex:none;box-sizing:border-box;border:1.5px solid var(--color-text);background:{{ c.box }};color:var(--color-bg);display:flex;align-items:center;justify-content:center"><sc-if value="{{ c.on }}"><sa-i n="check" s="22" w="2.5"></sa-i></sc-if></span>
                <span style="font-size:17px;line-height:1.3">{{ c.label }}</span>
              </button>
            </sc-for>
            <div style="display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--color-divider)">
              <div style="flex:1;font-size:17px">Antigel ajouté</div>
              <button onClick="{{ antigelMinus }}" aria-label="Moins" style="all:unset;cursor:pointer;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider)"><sa-i n="minus" s="24" w="2"></sa-i></button>
              <div style="width:60px;text-align:center;line-height:1;display:flex;flex-direction:column"><span style="font:600 26px var(--font-heading)">{{ hivAntigel }}</span><span style="font-size:12px">L</span></div>
              <button onClick="{{ antigelPlus }}" aria-label="Plus" style="all:unset;cursor:pointer;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider)"><sa-i n="plus" s="24" w="2"></sa-i></button>
            </div>
            <div style="padding:18px 20px;display:flex;flex-direction:column;gap:10px">
              <div style="font-size:17px;font-weight:500">État général de l’installation</div>
              <div style="display:flex;flex-direction:column;gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)">
                <sc-for list="{{ hivEtats }}" as="e">
                  <button onClick="{{ e.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:0 16px;height:56px;font-size:17px;background:{{ e.bg }};color:{{ e.fg }}"><span style="width:18px;height:18px;border-radius:50%;box-sizing:border-box;border:1.5px solid currentColor;background:{{ e.dot }}"></span>{{ e.label }}</button>
                </sc-for>
              </div>
              <textarea class="input" placeholder="Bris, pièces à commander, remarques" style="min-height:90px;font-size:17px;margin-top:6px"></textarea>
              <button class="btn btn-primary" onClick="{{ sendHiv }}" style="min-height:60px;font-size:21px;margin-top:6px">Envoyer le rapport</button>
            </div>
          </div>
        </sc-if>

        <!-- ═════ DEMANDES ═════ -->
        <sc-if value="{{ isDem }}">
          <div style="padding:20px;display:flex;flex-direction:column;gap:20px">
            <h1 style="margin:0;font-size:38px;line-height:1">Demandes</h1>
            <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--color-divider);border:1px solid var(--color-divider)">
              <sc-for list="{{ demTypes }}" as="t">
                <button onClick="{{ t.go }}" style="all:unset;cursor:pointer;min-height:112px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;background:{{ t.bg }};color:{{ t.fg }}"><sa-i n="{{ t.icon }}" s="30"></sa-i><span style="display:flex;flex-direction:column"><span style="font:600 22px/1.05 var(--font-heading)">{{ t.label }}</span><span style="font-size:13px">{{ t.sub }}</span></span></button>
              </sc-for>
              <a href="tel:{{ bureauTel }}" style="text-decoration:none;color:inherit;min-height:112px;padding:16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;background:var(--color-bg)"><sa-i n="phone" s="30"></sa-i><span style="display:flex;flex-direction:column"><span style="font:600 22px/1.05 var(--font-heading)">Appeler le bureau</span><span style="font-size:13px">819 562-0000</span></span></a>
            </div>
            <sc-if value="{{ hasComposer }}">
              <div class="blueprint" style="padding:16px;display:flex;flex-direction:column;gap:12px">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <div style="display:flex;align-items:center;justify-content:space-between"><span style="font:600 24px var(--font-heading)">{{ composer.label }}</span><button onClick="{{ closeComposer }}" aria-label="Fermer" style="all:unset;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center"><sa-i n="x" s="24"></sa-i></button></div>
                <sc-if value="{{ composer.urgent }}"><div style="padding:10px 12px;background:var(--color-accent-900);color:var(--color-bg);font-size:15px">Le répartiteur est avisé immédiatement et vous rappelle.</div></sc-if>
                <div style="display:flex;flex-wrap:wrap;gap:8px">
                  <sc-for list="{{ composer.chips }}" as="c">
                    <button onClick="{{ c.go }}" style="all:unset;cursor:pointer;min-height:46px;padding:0 14px;display:flex;align-items:center;font-size:16px;box-sizing:border-box;border:1px solid var(--color-divider);background:{{ c.bg }};color:{{ c.fg }}">{{ c.label }}</button>
                  </sc-for>
                </div>
                <textarea class="input" value="{{ demandeTxt }}" onChange="{{ onDemTxt }}" placeholder="Détails (optionnel)" style="min-height:80px;font-size:17px"></textarea>
                <div style="font-size:14px;display:flex;gap:6px;align-items:center"><sa-i n="pin" s="16"></sa-i><span>Site joint : {{ composerSite }}</span></div>
                <button class="btn btn-primary" onClick="{{ sendDemande }}" style="min-height:58px;font-size:20px;gap:10px"><sa-i n="send" s="22"></sa-i>Envoyer</button>
              </div>
            </sc-if>
            <div style="display:flex;flex-direction:column">
              <h3 style="margin:0 0 6px;font-size:24px">Mes demandes</h3>
              <sc-for list="{{ demHist }}" as="d">
                <div style="display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--color-divider)">
                  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:13px">{{ d.type }} · {{ d.quand }}</span><span style="font-size:16px;line-height:1.3">{{ d.texte }}</span></div>
                  <span style="align-self:flex-start;font-size:13px;padding:4px 8px;border:1px solid var(--color-divider);white-space:nowrap">{{ d.statut }}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-if>

        <!-- ═════ PLANNING ═════ -->
        <sc-if value="{{ isPlan }}">
          <div style="padding:20px;display:flex;flex-direction:column;gap:18px">
            <h1 style="margin:0;font-size:38px;line-height:1">Planning</h1>
            <div style="display:flex;gap:6px;overflow-x:auto;margin:0 -20px;padding:0 20px">
              <sc-for list="{{ planDays }}" as="d">
                <button onClick="{{ d.go }}" style="all:unset;cursor:pointer;flex:none;width:62px;height:66px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--color-divider);background:{{ d.bg }};color:{{ d.fg }}"><span style="font-size:13px">{{ d.dow }}</span><span style="font:600 24px/1 var(--font-heading)">{{ d.num }}</span></button>
              </sc-for>
            </div>
            <div style="font:600 20px var(--font-heading)">{{ planTitle }}</div>
            <div style="display:flex;flex-direction:column">
              <sc-for list="{{ planItems }}" as="p">
                <div style="display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--color-divider)">

                </div>
              </sc-for>
            </div>

            </div>
