<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SA Admin — Centre des opérations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Industry — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.blueprint {
  position: relative;
  border: 1px solid var(--color-divider);
  border-radius: 0;
}
/* The overlay image treatments (halftone, duotone) clip their overlay
   (overflow:hidden); a blueprint wrapper draws its registration marks
   outside the box, so when both classes share a wrapper the frame must
   win. */
.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after {
  content: ""; position: absolute; background: currentColor;
}
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.duotone{position:relative;overflow:hidden}
.duotone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--color-accent);mix-blend-mode:color}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* — blueprint frame: components are wireframe objects (see .blueprint
     and .corner above) — square, transparent, hairline-bordered — */
.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }
.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }
.btn { border: 1px solid var(--color-divider); }
.btn-primary { border-color: var(--color-accent); }
.btn-ghost { border-color: transparent; }


html,body{margin:0;height:100%;background:var(--color-bg)}
#app{position:fixed;inset:0}#app>div{height:100%}
button{font-family:inherit}a{color:var(--color-accent-700)}
#login{position:fixed;inset:0;background:var(--color-bg);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}#login h1{margin:0;font-size:44px;line-height:1}
[data-hv="1"]:hover{background:var(--color-accent-100) !important}
[data-hv="2"]:hover{background:var(--color-accent-100) !important}
[data-hv="3"]:hover{background:var(--color-accent-100) !important}
[data-hv="4"]:hover{background:var(--color-accent-100) !important}
[data-hv="5"]:hover{background:var(--color-accent-100) !important}
[data-hv="6"]:hover{background:var(--color-accent-100) !important}
[data-hv="7"]:hover{background:var(--color-accent-100) !important}
</style></head><body>
<div id="app"></div>
<div id="login"><form id="loginForm" autocomplete="on">
<div style="font:400 14px var(--font-body);color:var(--color-accent-700)">Soucy Aquatik · sa-admin</div><h1>Centre des opérations</h1>
<div class="field"><label>Identifiant</label><input id="lu" class="input" autocomplete="username" autocapitalize="off"></div>
<div class="field"><label>Mot de passe</label><input id="lp" class="input" type="password" autocomplete="current-password"></div>
<div id="le" style="min-height:22px;font-size:15px"></div>
<button class="btn btn-primary" type="submit" style="min-height:48px">Se connecter</button></form></div>
<template id="tpl">
<div ref="{{ rootRef }}" style="height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.45">

  <nav style="border-right:1px solid var(--color-divider);display:flex;flex-direction:column;min-height:0;overflow-y:auto">
    <div style="display:flex;align-items:center;gap:10px;padding:16px 16px 18px;border-bottom:1px solid var(--color-divider)">
      <div style="width:44px;height:44px;flex:none;background:#004987;color:#ffffff;display:flex;align-items:flex-end;padding:5px;box-sizing:border-box;font:600 11px/0.95 var(--font-heading)">Soucy<br>Aquatik</div>
      <div style="display:flex;flex-direction:column;line-height:1.15"><span style="font:600 20px var(--font-heading)">sa-admin</span><span style="font-size:12px;color:var(--color-accent-700)">Centre des opérations</span></div>
    </div>
    <template data-sc="for" list="{{ navGroups }}" as="g">
      <div style="display:flex;flex-direction:column;padding:14px 0 4px">
        <div style="padding:0 16px 6px;font-size:12px;color:var(--color-neutral-700)">{{ g.label }}</div>
        <template data-sc="for" list="{{ g.items }}" as="n">
          <button onClick="{{ n.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 13px;border-left:3px solid {{ n.bar }};background:{{ n.bg }};font-weight:{{ n.fw }}" data-hv="1">
            <sa-i n="{{ n.icon }}" s="18"></sa-i><span style="flex:1">{{ n.label }}</span>
            <template data-sc="if" value="{{ n.badge }}"><span style="min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:600 12px var(--font-heading);background:{{ n.badgeBg }};color:{{ n.badgeFg }};border:1px solid var(--color-text)">{{ n.badge }}</span></template>
          </button>
        </template>
      </div>
    </template>
    <div style="margin-top:auto;padding:14px 16px;border-top:1px solid var(--color-divider);display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border:1px solid var(--color-text);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-heading)">{{ meIni }}</div>
      <div style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:500">{{ meNom }}</span><span style="font-size:12px">{{ meRole }}</span><button onClick="{{ logout }}" style="all:unset;cursor:pointer;font-size:12px;text-decoration:underline;margin-top:2px">Se déconnecter</button></div>
    </div>
  </nav>

  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    <header style="flex:none;display:flex;align-items:center;gap:20px;padding:12px 28px;border-bottom:1px solid var(--color-divider);min-height:68px;box-sizing:border-box">
      <div style="display:flex;flex-direction:column;min-width:220px;flex:1">
        <h1 style="margin:0;font-size:30px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ modTitle }}</h1>
        <span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ modSub }}</span>
      </div>
      <div style="position:relative;flex:0 1 320px;min-width:170px">
        <div style="position:absolute;left:10px;top:9px;pointer-events:none"><sa-i n="search" s="18"></sa-i></div>
        <input class="input" value="{{ q }}" onChange="{{ onQ }}" placeholder="Site, client, dossier, ODT…" style="padding-left:36px">
        <template data-sc="if" value="{{ hasResults }}">
          <div style="position:absolute;top:42px;left:0;right:0;z-index:40;background:var(--color-bg);border:1px solid var(--color-text);box-shadow:var(--shadow-lg);display:flex;flex-direction:column">
            <template data-sc="for" list="{{ results }}" as="r">
              <button onClick="{{ r.go }}" style="all:unset;cursor:pointer;padding:9px 12px;display:flex;flex-direction:column;border-bottom:1px solid var(--color-divider)" data-hv="2"><span style="font-weight:500">{{ r.label }}</span><span style="font-size:12px">{{ r.sub }}</span></button>
            </template>
          </div>
        </template>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap"><span style="width:8px;height:8px;background:var(--color-accent)"></span><span>{{ liveTxt }}</span></div>
    </header>

    <main style="flex:1;overflow:auto;padding:24px 28px 40px;min-height:0"><template data-sc="if" value="{{ isLoading }}"><div style="padding:32px 28px;font-size:16px">Chargement des données réelles…<br><span style="font-size:14px">{{ loadErr }}</span></div></template>
<template data-sc="if" value="{{ isSoon }}"><div style="padding:28px;max-width:640px;display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font-size:34px">{{ soonTitle }}</h2>
<p style="margin:0;font-size:16px;line-height:1.5">Ce module arrive dans une prochaine version de sa-admin. En attendant, il reste disponible dans SA Platform, qui continue de fonctionner normalement.</p>
<a class="btn btn-primary" href="/" style="text-decoration:none;width:fit-content;padding:0 18px;min-height:44px;display:inline-flex;align-items:center">Ouvrir SA Platform</a></div></template>


      <!-- ═════ MONITORING ═════ -->
      <template data-sc="if" value="{{ isMonitoring }}">
        <div style="display:flex;flex-direction:column;gap:26px">
          <div class="blueprint" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <template data-sc="for" list="{{ kpis }}" as="k">
              <div style="padding:16px 18px;border-right:1px solid var(--color-divider);display:flex;flex-direction:column;gap:2px;background:{{ k.bg }};color:{{ k.fg }}">
                <span style="font-size:13px">{{ k.label }}</span>
                <span style="font:600 40px/1 var(--font-heading)">{{ k.val }}<span style="font-size:22px;font-weight:400">{{ k.of }}</span></span>
                <span style="font-size:12px">{{ k.sub }}</span>
              </div>
            </template>
          </div>

          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,500px),1fr));gap:26px">
            <section class="blueprint" style="display:flex;flex-direction:column;min-width:0">
              <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
              <div style="padding:14px 18px;border-bottom:1px solid var(--color-divider);display:flex;align-items:baseline;justify-content:space-between"><h3 style="margin:0;font-size:22px">Équipe en ce moment</h3><span style="font-size:13px">Cliquez une ligne pour ouvrir les relevés du site</span></div>
              <table class="table" style="font-size:14px">
                <thead><tr><th style="text-transform:none;letter-spacing:0;font-size:12px;padding-left:18px">Technicien</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Statut</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Site</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Depuis</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Dernière activité</th></tr></thead>
                <tbody>
                  <template data-sc="for" list="{{ techRows }}" as="t">
                    <tr onClick="{{ t.go }}" style="cursor:pointer;opacity:{{ t.op }}">

                      <tbody>
                        <template data-sc="for" list="{{ d.visites }}" as="v">
                          <tr onClick="{{ v.open }}" style="cursor:pointer"><td style="padding:var(--sa-row,8px) 8px;white-space:nowrap;font-weight:500">{{ v.date }}</td><td style="padding:var(--sa-row,8px) 8px">{{ v.tache }}</td><td style="padding:var(--sa-row,8px) 8px">{{ v.tech }}</td><td style="padding:var(--sa-row,8px) 8px"><span style="display:inline-block;white-space:nowrap;font-size:12px;padding:1px 7px;border:1px solid var(--color-divider);background:{{ v.bg }};color:{{ v.fg }}">{{ v.statut }}</span></td></tr>
                        </template>
                      </tbody>
                    </table>
                    <div style="display:flex;flex-direction:column;gap:10px">
                      <div style="font-size:12px">Contrat {{ d.contrat }} · sites</div>
                      <template data-sc="for" list="{{ d.sites }}" as="s">
                        <button onClick="{{ s.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--color-divider)" data-hv="6"><sa-i n="pin" s="16"></sa-i><span style="flex:1;min-width:0">{{ s.nom }}</span><sa-i n="right" s="16"></sa-i></button>
                      </template>
                      <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap">
                        <button class="btn btn-secondary" onClick="{{ d.addVisit }}" style="white-space:nowrap"><sa-i n="plus" s="15"></sa-i><span>Planifier une visite</span></button>
                        <button class="btn btn-ghost" onClick="{{ d.goFact }}" style="white-space:nowrap">Facturation</button>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- ═════ PLANNING ═════ -->
      <template data-sc="if" value="{{ isPlanning }}">
        <div style="display:flex;flex-direction:column;gap:18px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
            <div style="display:flex;align-items:center;gap:8px">
              <button class="btn btn-secondary btn-icon" onClick="{{ pPrev }}" aria-label="Semaine précédente" style="white-space:nowrap"><sa-i n="left" s="18"></sa-i></button>
              <span style="font:600 20px var(--font-heading);padding:0 8px">{{ pLabel }}</span>
              <button class="btn btn-secondary btn-icon" onClick="{{ pNext }}" aria-label="Semaine suivante" style="white-space:nowrap"><sa-i n="right" s="18"></sa-i></button>
              <span style="font-size:13px;margin-left:12px;display:flex;align-items:center;gap:6px"><sa-i n="repeat" s="15"></sa-i><span>= créneau issu d’une série récurrente</span></span>
            </div>
            <button class="btn btn-primary blueprint" onClick="{{ openDlg }}" style="white-space:nowrap;padding:9px 16px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><sa-i n="plus" s="16"></sa-i><span>Nouveau créneau ou série</span></button>
          </div>
          <div style="overflow-x:auto"><div style="display:grid;grid-template-columns:180px repeat(5,minmax(150px,1fr));min-width:960px;border-top:1px solid var(--color-text);border-left:1px solid var(--color-divider)">
            <div style="padding:8px 12px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);font-size:12px">Technicien</div>
            <template data-sc="for" list="{{ weekDays }}" as="w">
              <div style="padding:8px 12px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);font:600 16px var(--font-heading);background:{{ w.bg }};color:{{ w.fg }}">{{ w.label }}</div>
            </template>
            <template data-sc="for" list="{{ planRows }}" as="r">
              <div style="padding:10px 12px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;line-height:1.25;opacity:{{ r.op }}"><span style="font-weight:500">{{ r.nom }}</span><span style="font-size:12px">{{ r.hours }}</span></div>
              <template data-sc="for" list="{{ r.cells }}" as="c">
                <div onClick="{{ c.add }}" style="padding:6px;border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:4px;min-height:74px;cursor:copy;background:{{ c.bg }}" data-hv="7">
                  <template data-sc="for" list="{{ c.slots }}" as="s">
                    <div onClick="{{ s.open }}" style="cursor:pointer;padding:5px 7px;border:1px solid var(--color-text);background:{{ s.bg }};color:{{ s.fg }};display:flex;flex-direction:column;line-height:1.2;font-size:12px">
                      <span style="display:flex;align-items:center;gap:5px;font:600 13px var(--font-heading);min-width:0"><span>{{ s.h }}</span><span style="font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0">{{ s.tache }}</span><template data-sc="if" value="{{ s.rec }}"><span style="margin-left:auto;display:flex"><sa-i n="repeat" s="13"></sa-i></span></template></span>
                      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ s.nom }}</span>
                    </div>
                  </template>
                </div>
              </template>
            </template>
          </div></div>
        </div>
      </template>

      <template data-sc="if" value="{{ dlgOpen }}">
        <div class="dialog-backdrop" onClick="{{ closeDlgBg }}" style="z-index:50">
          <div class="dialog" onClick="{{ stop }}" style="width:min(620px,100%);background:var(--color-bg);max-height:calc(100vh - 40px);overflow-y:auto;overflow-x:hidden;gap:16px;padding:22px 24px;border:1px solid var(--color-text)">
            <div style="display:flex;align-items:center;justify-content:space-between"><span class="dialog-title" style="font-size:26px">Nouveau créneau</span><button class="btn btn-ghost btn-icon" onClick="{{ closeDlg }}" aria-label="Fermer" style="white-space:nowrap"><sa-i n="x" s="20"></sa-i></button></div>
            <div style="display:flex;border:1px solid var(--color-divider);align-self:flex-start">
              <template data-sc="for" list="{{ dlgTypes }}" as="t"><button onClick="{{ t.go }}" style="all:unset;cursor:pointer;white-space:nowrap;padding:7px 14px;font:600 15px var(--font-heading);border-right:1px solid var(--color-divider);background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }}</button></template>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
              <div class="field"><label>Site</label><select class="input" value="{{ fv.site }}" onChange="{{ onF.site }}"><template data-sc="for" list="{{ siteOptions }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select></div>
              <div class="field"><label>Technicien</label><select class="input" value="{{ fv.tech }}" onChange="{{ onF.tech }}"><template data-sc="for" list="{{ techOptions }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select></div>
              <div class="field"><label>Première date</label><input class="input" type="date" value="{{ fv.debut }}" onChange="{{ onF.debut }}"></div>
              <div class="field"><label>Heure</label><input class="input" type="time" value="{{ fv.heure }}" onChange="{{ onF.heure }}"></div>
            </div>
            <div class="field"><label>Répétition</label>
              <div style="display:flex;border:1px solid var(--color-divider);align-self:flex-start;width:max-content">
                <template data-sc="for" list="{{ recOpts }}" as="t"><button onClick="{{ t.go }}" style="all:unset;cursor:pointer;white-space:nowrap;padding:7px 14px;font-size:14px;border-right:1px solid var(--color-divider);background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }}</button></template>
              </div>
            </div>
            <template data-sc="if" value="{{ hasRec }}">
              <div style="display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end">
                <div class="field"><label>Jours</label>
                  <div style="display:flex;gap:4px">
                    <template data-sc="for" list="{{ dayToggles }}" as="d"><button onClick="{{ d.go }}" style="all:unset;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-text);font:600 14px var(--font-heading);background:{{ d.bg }};color:{{ d.fg }}">{{ d.l }}</button></template>
                  </div>
                </div>
                <div class="field"><label>Jusqu’au</label><input class="input" type="date" value="{{ fv.fin }}" onChange="{{ onF.fin }}"></div>
              </div>
            </template>
            <div style="border:1px solid var(--color-divider);padding:12px 14px;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:baseline;gap:8px"><span style="font:600 28px/1 var(--font-heading)">{{ occCount }}</span><span>{{ occLabel }}</span></div>
              <div style="display:flex;flex-wrap:wrap;gap:4px">
                <template data-sc="for" list="{{ occList }}" as="o"><span style="font-size:12px;padding:2px 7px;border:1px solid var(--color-divider);white-space:nowrap">{{ o }}</span></template>
              </div>
            </div>
            <div class="dialog-actions" style="margin-top:0">
              <button class="btn btn-secondary" onClick="{{ closeDlg }}" style="white-space:nowrap">Annuler</button>
              <button class="btn btn-primary" onClick="{{ createSeries }}" style="white-space:nowrap;padding:8px 18px">{{ createLabel }}</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ═════ SITES ═════ -->
      <template data-sc="if" value="{{ isSites }}"><template data-sc="if" value="{{ noNouveaux }}"><div style="margin:12px 28px 0;padding:12px 14px;border:1px dashed var(--color-text);font-size:15px">Aucun site détecté automatiquement en attente.</div></template>
        <div style="display:flex;flex-direction:column;gap:26px">
          <section style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:baseline;justify-content:space-between"><h3 style="margin:0;font-size:22px">Détectés automatiquement · à valider</h3><span style="font-size:13px">À partir des punchs GPS et des bons de livraison</span></div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px">
              <template data-sc="for" list="{{ nouveaux }}" as="n">
                <div class="blueprint" style="display:flex;flex-direction:column;opacity:{{ n.op }}">
                  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                  <div style="padding:14px 16px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:3px">
                    <span style="font:600 19px/1.15 var(--font-heading)">{{ n.nom }}</span>
                    <span style="font-size:12px">{{ n.source }}</span>
                  </div>
                  <template data-sc="if" value="{{ n.isDup }}">
                    <div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--color-divider);font-size:13px">
                      <div style="padding:10px 16px;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px">Détecté</span><span style="font-weight:500">{{ n.nom }}</span><span>{{ n.gps }}</span></div>
                      <div style="padding:10px 16px;border-left:1px solid var(--color-divider);display:flex;flex-direction:column;gap:2px"><span style="font-size:12px">Existant</span><span style="font-weight:500">{{ n.dupNom }}</span><span>{{ n.dupGps }}</span></div>
                    </div>
                  </template>
                  <template data-sc="if" value="{{ n.isNew }}"><div style="padding:10px 16px;border-bottom:1px solid var(--color-divider);font-size:13px">GPS {{ n.gps }}</div></template>
                  <div style="padding:10px 16px;font-size:13px;display:flex;gap:8px;align-items:flex-start"><sa-i n="{{ n.icon }}" s="16"></sa-i><span>{{ n.suggestion }}</span></div>
                  <template data-sc="if" value="{{ n.pending }}">
                    <div style="padding:4px 16px 16px;display:flex;gap:8px;flex-wrap:wrap">
                      <button class="btn btn-primary" onClick="{{ n.primary }}" style="white-space:nowrap"><sa-i n="{{ n.icon }}" s="15"></sa-i><span>{{ n.primaryLabel }}</span></button>
                      <button class="btn btn-secondary" onClick="{{ n.alt }}" style="white-space:nowrap">{{ n.altLabel }}</button>
                      <button class="btn btn-ghost" onClick="{{ n.ignore }}" style="white-space:nowrap">Ignorer</button>
                    </div>
                  </template>
                  <template data-sc="if" value="{{ n.done }}"><div style="padding:4px 16px 16px;display:flex;align-items:center;gap:6px;font-weight:500"><sa-i n="check" s="16" w="2"></sa-i><span>{{ n.doneTxt }}</span></div></template>
                </div>
              </template>
            </div>
          </section>
          <section class="blueprint" style="display:flex;flex-direction:column">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div style="padding:12px 18px;border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between;gap:16px"><h3 style="margin:0;font-size:22px">Répertoire · {{ siteCount }} sites</h3>
              <select class="input" value="{{ siteType }}" onChange="{{ onSiteType }}" style="width:260px"><template data-sc="for" list="{{ siteTypeOptions }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select>
            </div>
            <table class="table" style="font-size:14px">
              <thead><tr><th style="text-transform:none;letter-spacing:0;font-size:12px;padding-left:18px">Site</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Type</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Client</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Contrat</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Fréquence</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Technicien</th><th style="text-transform:none;letter-spacing:0;font-size:12px">GPS</th></tr></thead>
              <tbody>
                <template data-sc="for" list="{{ siteRows }}" as="s">
                  <tr onClick="{{ s.go }}" style="cursor:pointer"><td style="padding:var(--sa-row,10px) 8px var(--sa-row,10px) 18px"><div style="display:flex;flex-direction:column;line-height:1.25"><span style="font-weight:500">{{ s.nom }}</span><span style="font-size:12px">{{ s.ville }} · {{ s.bassin }}</span></div></td><td style="padding:var(--sa-row,10px) 8px">{{ s.court }}</td><td style="padding:var(--sa-row,10px) 8px">{{ s.client }}</td><td style="padding:var(--sa-row,10px) 8px;font:600 15px var(--font-heading)">{{ s.contrat }}</td><td style="padding:var(--sa-row,10px) 8px">{{ s.freq }}</td><td style="padding:var(--sa-row,10px) 8px">{{ s.tech }}</td><td style="padding:var(--sa-row,10px) 8px;font-size:12px;white-space:nowrap">{{ s.gps }}</td></tr>
                </template>
              </tbody>
            </table>
          </section>
        </div>
      </template>

      <!-- ═════ FACTURATION ═════ -->
      <template data-sc="if" value="{{ isFacturation }}">
        <div style="display:flex;flex-direction:column;gap:22px">
          <div class="blueprint" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <template data-sc="for" list="{{ factKpis }}" as="k">
              <div style="padding:16px 18px;border-right:1px solid var(--color-divider);display:flex;flex-direction:column;gap:2px"><span style="font-size:13px">{{ k.l }}</span><span style="font:600 32px/1.05 var(--font-heading)">{{ k.v }}</span><span style="font-size:12px">{{ k.s }}</span></div>
            </template>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
            <div style="display:flex;border:1px solid var(--color-divider)">
              <template data-sc="for" list="{{ factFilters }}" as="o"><button onClick="{{ o.go }}" style="all:unset;cursor:pointer;white-space:nowrap;padding:8px 14px;font:600 15px var(--font-heading);border-right:1px solid var(--color-divider);background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }} <span style="font-weight:400">{{ o.n }}</span></button></template>
            </div>
            <div style="display:flex;gap:8px;align-items:center"><span style="font-size:13px">Cliquez un statut pour le faire avancer</span><button class="btn btn-secondary" onClick="{{ exportXls }}" style="white-space:nowrap"><sa-i n="download" s="16"></sa-i><span>Exporter (.xlsx)</span></button></div>
          </div>
          <section class="blueprint" style="display:flex;flex-direction:column;overflow-x:auto">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <table class="table" style="font-size:14px">
              <thead><tr><th style="text-transform:none;letter-spacing:0;font-size:12px;padding-left:18px">N° ODT</th><th style="text-transform:none;letter-spacing:0;font-size:12px">N° PO</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Client · site</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Date</th><th style="text-transform:none;letter-spacing:0;font-size:12px;text-align:right">Prix calculé</th><th style="text-transform:none;letter-spacing:0;font-size:12px;text-align:right">Prix facturé</th><th style="text-transform:none;letter-spacing:0;font-size:12px;text-align:right">Écart</th><th style="text-transform:none;letter-spacing:0;font-size:12px;padding-right:18px">Statut</th></tr></thead>
              <tbody>
                <template data-sc="for" list="{{ factRows }}" as="b">
                  <tr>
                    <td style="padding:var(--sa-row,10px) 8px var(--sa-row,10px) 18px;font:600 15px var(--font-heading);white-space:nowrap">{{ b.odt }}</td>
                    <td style="padding:var(--sa-row,10px) 8px;white-space:nowrap"><template data-sc="if" value="{{ b.hasPo }}"><span>{{ b.po }}</span></template><template data-sc="if" value="{{ b.noPo }}"><span style="font-size:12px;padding:1px 7px;border:1px dashed var(--color-text)">PO manquant</span></template></td>
                    <td style="padding:var(--sa-row,10px) 8px"><div style="display:flex;flex-direction:column;line-height:1.25"><span style="font-weight:500">{{ b.client }}</span><span style="font-size:12px">{{ b.site }}</span></div></td>
                    <td style="padding:var(--sa-row,10px) 8px;white-space:nowrap">{{ b.date }}</td>
                    <td style="padding:var(--sa-row,10px) 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums">{{ b.calc }}</td>
                    <td style="padding:var(--sa-row,10px) 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:500">{{ b.fact }}</td>
                    <td style="padding:var(--sa-row,10px) 8px;text-align:right;white-space:nowrap"><span style="display:inline-block;padding:1px 7px;font:600 14px var(--font-heading);background:{{ b.ecBg }};color:{{ b.ecFg }}">{{ b.ecart }}</span></td>
                    <td style="padding:var(--sa-row,10px) 18px var(--sa-row,10px) 8px"><button onClick="{{ b.cycle }}" style="all:unset;cursor:pointer;display:inline-block;white-space:nowrap;font-size:12px;padding:3px 9px;border:1px solid var(--color-text);background:{{ b.stBg }};color:{{ b.stFg }}">{{ b.statut }}</button></td>
                  </tr>
                </template>
              </tbody>
              <tfoot><tr><td colspan="4" style="padding:12px 8px 12px 18px;font:600 16px var(--font-heading);border-top:1px solid var(--color-text)">Total · {{ factCount }} ODT</td><td style="padding:12px 8px;text-align:right;font:600 16px var(--font-heading);border-top:1px solid var(--color-text);white-space:nowrap">{{ factTotCalc }}</td><td style="padding:12px 8px;text-align:right;font:600 16px var(--font-heading);border-top:1px solid var(--color-text);white-space:nowrap">{{ factTotFact }}</td><td style="padding:12px 8px;text-align:right;font:600 16px var(--font-heading);border-top:1px solid var(--color-text);white-space:nowrap">{{ factTotEcart }}</td><td style="border-top:1px solid var(--color-text)"></td></tr></tfoot>
            </table>
          </section>
        </div>
      </template>

      <!-- ═════ SONDAGES ═════ -->
      <template data-sc="if" value="{{ isSondages }}">
        <div style="display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start"><template data-sc="if" value="{{ needKey }}"><div style="display:flex;flex-direction:column;gap:14px;max-width:420px"><h3 style="margin:0;font-size:22px">Clé d’accès requise</h3><p style="margin:0;font-size:14px;line-height:1.4">Les réponses des sondages sont protégées par une clé, gardée uniquement dans ce navigateur — jamais dans le fichier de l’app.</p><div class="field"><label>Clé d’accès</label><input class="input" type="password" value="{{ keyVal }}" onChange="{{ onKey }}"></div><button class="btn btn-primary" onClick="{{ saveKey }}" style="align-self:flex-start">Valider</button></div></template><template data-sc="if" value="{{ noSurvey }}"><div style="padding:20px">Aucun sondage pour l’instant.</div></template>
          <div style="display:flex;flex-direction:column;gap:12px">
            <button class="btn btn-primary blueprint" onClick="{{ openBuilder }}" style="white-space:nowrap;padding:10px 16px"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><sa-i n="plus" s="16"></sa-i><span>Créer un sondage</span></button>
            <div style="display:flex;flex-direction:column;border:1px solid var(--color-divider)">
              <template data-sc="for" list="{{ surveys }}" as="s">
                <button onClick="{{ s.go }}" style="all:unset;cursor:pointer;padding:12px 14px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:3px;background:{{ s.bg }};color:{{ s.fg }}">
                  <span style="font:600 17px/1.15 var(--font-heading)">{{ s.titre }}</span>
                  <span style="font-size:12px">{{ s.statut }} · {{ s.reponses }}/{{ s.envoyes }} réponses · {{ s.scoreTxt }}</span>
                </button>
              </template>
            </div>
          </div>

          <template data-sc="if" value="{{ showResults }}">
            <div style="display:flex;flex-direction:column;gap:22px;min-width:0">
              <div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px">{{ sv.cible }} · fermeture {{ sv.ferme }}</span><h2 style="margin:0;font-size:32px;line-height:1.05">{{ sv.titre }}</h2></div>
              <div class="blueprint" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr))">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <template data-sc="for" list="{{ sv.kpis }}" as="k"><div style="padding:14px 18px;border-right:1px solid var(--color-divider);display:flex;flex-direction:column"><span style="font-size:13px">{{ k.l }}</span><span style="font:600 34px/1.05 var(--font-heading)">{{ k.v }}</span></div></template>
              </div>
              <template data-sc="if" value="{{ sv.hasQ }}">
                <section class="blueprint" style="display:flex;flex-direction:column">

          </template>

          <template data-sc="if" value="{{ builder }}">

              <div style="display:flex;align-items:center;justify-content:space-between"><h2 style="margin:0;font-size:28px">Nouveau sondage</h2><button class="btn btn-ghost btn-icon" onClick="{{ closeBuilder }}" aria-label="Fermer" style="white-space:nowrap"><sa-i n="x" s="20"></sa-i></button></div>
              <div style="display:grid;grid-template-columns:2fr 1fr;gap:14px">
                <div class="field"><label>Titre</label><input class="input" value="{{ bTitle }}" onChange="{{ onBTitle }}"></div>
                <div class="field"><label>Destinataires</label><select class="input" value="{{ bAud }}" onChange="{{ onBAud }}"><option>Clients municipaux</option><option>Clients commerciaux</option><option>Clients résidentiels</option><option>Tous les clients actifs</option></select></div>

                    <button class="btn btn-ghost btn-icon" onClick="{{ q.del }}" aria-label="Retirer" style="white-space:nowrap"><sa-i n="x" s="18"></sa-i></button>

                </template>
              </div>
              <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">

                <div style="display:flex;gap:8px"><button class="btn btn-secondary" onClick="{{ closeBuilder }}" style="white-space:nowrap">Brouillon</button><button class="btn btn-primary" onClick="{{ sendSurvey }}" style="white-space:nowrap;padding:8px 18px"><sa-i n="send" s="15"></sa-i><span>Envoyer</span></button></div>
              </div>
            </div>
          </template>
        </div>
