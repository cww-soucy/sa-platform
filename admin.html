<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SA Admin — Centre des opérations</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Industry — design-system tokens and component classes. This file is the source of truth for the system's look; retune it here and see readme.md. */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);

  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the
     same step of any role matches the others in visual value. */
  --color-neutral-100: #f5f5f8;
  --color-neutral-200: #e7e7ea;
  --color-neutral-300: #d4d4d7;
  --color-neutral-400: #b7b7ba;
  --color-neutral-500: #98989b;
  --color-neutral-600: #7a7a7d;
  --color-neutral-700: #5d5d60;
  --color-neutral-800: #424244;
  --color-neutral-900: #2b2b2d;

  --color-accent-100: #eef6ff;
  --color-accent-200: #d6ebff;
  --color-accent-300: #b5d9fd;
  --color-accent-400: #94bce3;
  --color-accent-500: #749dc4;
  --color-accent-600: #597ea3;
  --color-accent-700: #416180;
  --color-accent-800: #2c455d;
  --color-accent-900: #1d2d3d;

  --color-accent-2-100: #eef6ff;
  --color-accent-2-200: #d6ebff;
  --color-accent-2-300: #bdd8f2;
  --color-accent-2-400: #9ebbd8;
  --color-accent-2-500: #7e9cb8;
  --color-accent-2-600: #627d98;
  --color-accent-2-700: #486077;
  --color-accent-2-800: #314457;
  --color-accent-2-900: #1f2d3a;

  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;

  --space-1: 3.4px;
  --space-2: 6.8px;
  --space-3: 10.2px;
  --space-4: 13.6px;
  --space-6: 20.4px;
  --space-8: 27.2px;

  --radius-sm: 2px;
  --radius-md: 4px;
  --radius-lg: 7px;

  /* Elevation — derived from the ground: soft ink-tinted shadows on a
     light theme, a hairline edge + ambient darkness on a dark one. */
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);
}

body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-body);
}
h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }

.blueprint {
  position: relative;
  border: 1px solid var(--color-divider);
  border-radius: 0;
}
/* The overlay image treatments (halftone, duotone) clip their overlay
   (overflow:hidden); a blueprint wrapper draws its registration marks
   outside the box, so when both classes share a wrapper the frame must
   win. */
.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }
.blueprint > .corner {
  position: absolute; width: 11px; height: 11px;
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.blueprint > .corner::before, .blueprint > .corner::after {
  content: ""; position: absolute; background: currentColor;
}
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

.duotone{position:relative;overflow:hidden}
.duotone::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--color-accent);mix-blend-mode:color}

/* ══════════════════════════════════════════════════════════════════════════
   Components — built with the tokens above. Plain CSS
   on plain HTML: no JavaScript, no build step. Each class is documented in
   readme.md and demonstrated in foundations/ and components/.
   ══════════════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);
}
h1 { font-size: 42px; }
h2 { font-size: 32px; }
h3 { font-size: 25px; }
h4 { font-size: 20px; }
h5 { font-size: 16px; }
h6 { font-size: 13px; }
h6 { letter-spacing: 0.08em; text-transform: uppercase; }
p { margin: 0 0 var(--space-3); }
a { color: var(--color-accent); text-underline-offset: 3px; }
img { display: block; max-width: 100%; }
figure { margin: 0; }
figcaption {
  font-size: 11px; margin-top: var(--space-1);
  color: color-mix(in srgb, var(--color-text) 55%, transparent);
}
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }

/* — rules — */
.hr {
  height: 1px; border: 0; margin: var(--space-4) 0;
  background: var(--color-divider);
}

/* — buttons — */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —
     the pair sits side by side in sign-up rows */
  background: transparent; border: 1px solid transparent;
  padding: var(--space-2) calc(var(--space-3) * 1.2);
  border-radius: var(--radius-md);
}
.btn svg { display: block; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-block { width: 100%; margin-top: var(--space-2); }

/* — forms — */
.field > label {
  display: block; font-size: 12px; margin-bottom: 5px;
  color: color-mix(in srgb, var(--color-text) 70%, transparent);
}
.input {
  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;
  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface);
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; }
.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.radio input, .seg-opt input {
  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;
}
.radio .dot {
  width: 16px; height: 16px; flex: none; border-radius: 50%;
  border: 1.5px solid var(--color-divider);
}
.radio:hover .dot { border-color: var(--color-accent); }
.radio input:checked + .dot {
  border-color: var(--color-accent); background: var(--color-accent);
  box-shadow: inset 0 0 0 4px var(--color-bg);
}
.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }
.seg {
  display: inline-flex; overflow: hidden;
  border: 1px solid var(--color-divider); border-radius: var(--radius-md);
}
.seg-opt {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px; font-size: 13px; cursor: pointer;
}
.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }
.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }
.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }

/* — cards — */
.card {
  display: flex; flex-direction: column; gap: var(--space-2);
  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);
}
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 17px; line-height: 1.2;
}
.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }
.card-meta {
  display: flex; align-items: center; gap: 6px; font-size: 11px;
  color: color-mix(in srgb, var(--color-text) 50%, transparent);
}
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.elev-lg { box-shadow: var(--shadow-lg); }

/* — tags — */
.tag {
  display: inline-flex; align-items: center; font-size: 11px;
  letter-spacing: 0.02em; padding: 3px 10px;
  border-radius: calc(var(--radius-md) * 0.75);
}
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }

/* — navigation — */
.nav {
  display: flex; align-items: center; gap: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-bottom: none;
}
.nav-brand {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 18px; margin-right: auto;
}
.nav a { color: inherit; text-decoration: none; font-size: 14px; }
.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }

/* — tables — */
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th {
  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
  color: color-mix(in srgb, var(--color-text) 60%, transparent);
  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);
}
.table td {
  padding: var(--space-2);
  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);
}
.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }

/* — dialog — */
.dialog-backdrop {
  position: fixed; inset: 0; display: grid; place-items: center;
  padding: var(--space-4);
  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);
}
.dialog {
  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);
  padding: var(--space-4); border-radius: var(--radius-lg);
  background: var(--color-surface); box-shadow: var(--shadow-lg);
}
.dialog-title {
  font-family: var(--font-heading); font-weight: var(--font-heading-weight);
  font-size: 20px;
}
.dialog-body { font-size: 14px; opacity: 0.85; }
.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }

/* — blueprint frame: components are wireframe objects (see .blueprint
     and .corner above) — square, transparent, hairline-bordered — */
.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }
.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }
.btn { border: 1px solid var(--color-divider); }
.btn-primary { border-color: var(--color-accent); }
.btn-ghost { border-color: transparent; }


html,body{margin:0;height:100%;background:var(--color-bg)}
#app{position:fixed;inset:0}#app>div{height:100%}
button{font-family:inherit}a{color:var(--color-accent-700)}
#login{position:fixed;inset:0;background:var(--color-bg);display:none;align-items:center;justify-content:center;padding:24px;z-index:50}
#login form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}#login h1{margin:0;font-size:44px;line-height:1}
[data-hv="1"]:hover{background:var(--color-accent-100) !important}
[data-hv="2"]:hover{background:var(--color-accent-100) !important}
[data-hv="3"]:hover{background:var(--color-accent-100) !important}
[data-hv="4"]:hover{background:var(--color-accent-100) !important}
[data-hv="5"]:hover{background:var(--color-accent-100) !important}
[data-hv="6"]:hover{background:var(--color-accent-100) !important}
[data-hv="7"]:hover{background:var(--color-accent-100) !important}
html.nav-repli .sa-shell{grid-template-columns:72px minmax(0,1fr)!important}html.nav-repli .sa-nav .sa-nl{display:none!important}html.nav-repli .sa-nav button{justify-content:center!important;padding:0!important;gap:0!important}html.nav-repli .sa-nav>div{justify-content:center;padding-left:0!important;padding-right:0!important}html.nav-repli .sa-navtog-i{transform:scaleX(-1)}html.nav-repli .sa-nav button>span:not(.sa-nl):not(.sa-navtog-i){position:absolute;margin:-22px 0 0 26px;transform:scale(.8)}.sa-nav button{position:relative}
</style></head><body>
<div id="app"></div>
<div id="login"><form id="loginForm" autocomplete="on">
<div style="font:400 14px var(--font-body);color:var(--color-accent-700)">Soucy Aquatik · sa-admin</div><h1>Centre des opérations</h1>
<div class="field"><label>Identifiant</label><input id="lu" class="input" autocomplete="username" autocapitalize="off"></div>
<div class="field"><label>Mot de passe</label><input id="lp" class="input" type="password" autocomplete="current-password"></div>
<div id="le" style="min-height:22px;font-size:15px"></div>
<button class="btn btn-primary" type="submit" style="min-height:48px">Se connecter</button></form></div>
<template id="tpl">
<div ref="{{ rootRef }}" class="sa-shell" style="height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:14px;line-height:1.45">

  <nav class="sa-nav" style="border-right:1px solid var(--color-divider);display:flex;flex-direction:column;min-height:0;overflow-y:auto"><button data-navtog="1" class="sa-navtog" aria-label="Replier ou déplier le menu" title="Replier / déplier le menu" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;height:34px;padding:0 14px 0 16px;border-bottom:1px solid var(--color-divider);font-size:13px" data-hv="1"><span class="sa-navtog-i" aria-hidden="true">«</span><span class="sa-nl">Replier le menu</span></button>
    <div style="display:flex;align-items:center;gap:10px;padding:16px 16px 18px;border-bottom:1px solid var(--color-divider)">
      <img src="/src/design/logo-soucy-aquatik.png" alt="Soucy Aquatik" style="width:44px;height:44px;flex:none;object-fit:contain">
      <div class="sa-nl" style="display:flex;flex-direction:column;line-height:1.15"><span style="font:600 20px var(--font-heading)">sa-admin</span><span style="font-size:12px;color:var(--color-accent-700)">Centre des opérations</span></div>
    </div><button onClick="{{ openPortail }}" title="Accueil · toutes les applications" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 16px;border-bottom:1px solid var(--color-divider);font-weight:600" data-hv="1"><sa-i n="home" s="18"></sa-i><span class="sa-nl">Accueil · toutes les applications</span></button>
    <template data-sc="for" list="{{ navGroups }}" as="g">
      <div style="display:flex;flex-direction:column;padding:14px 0 4px">
        <div class="sa-nl" style="padding:0 16px 6px;font-size:12px;color:var(--color-neutral-700)">{{ g.label }}</div>
        <template data-sc="for" list="{{ g.items }}" as="n">
          <button onClick="{{ n.go }}" title="{{ n.label }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 13px;border-left:3px solid {{ n.bar }};background:{{ n.bg }};font-weight:{{ n.fw }}" data-hv="1">
            <sa-i n="{{ n.icon }}" s="18"></sa-i><span class="sa-nl" style="flex:1">{{ n.label }}</span>
            <template data-sc="if" value="{{ n.badge }}"><span style="min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font:600 12px var(--font-heading);background:{{ n.badgeBg }};color:{{ n.badgeFg }};border:1px solid var(--color-text)">{{ n.badge }}</span></template>
          </button>
        </template>
      </div>
    </template>
    <div style="margin-top:auto;padding:14px 16px;border-top:1px solid var(--color-divider);display:flex;align-items:center;gap:10px">
      <div style="width:32px;height:32px;border:1px solid var(--color-text);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-heading)">{{ meIni }}</div>
      <div class="sa-nl" style="display:flex;flex-direction:column;line-height:1.2"><span style="font-weight:500">{{ meNom }}</span><span style="font-size:12px">{{ meRole }}</span><button onClick="{{ logout }}" style="all:unset;cursor:pointer;font-size:12px;text-decoration:underline;margin-top:2px">Se déconnecter</button></div>
    </div>
  </nav>

  <div style="display:flex;flex-direction:column;min-width:0;min-height:0">
    <header style="flex:none;display:flex;align-items:center;gap:20px;padding:12px 28px;border-bottom:1px solid var(--color-divider);min-height:68px;box-sizing:border-box">
      <div style="display:flex;flex-direction:column;min-width:220px;flex:1">
        <h1 style="margin:0;font-size:30px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ modTitle }}</h1>
        <span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ modSub }}</span>
      </div>
      <div style="position:relative;flex:0 1 320px;min-width:170px">
        <div style="position:absolute;left:10px;top:9px;pointer-events:none"><sa-i n="search" s="18"></sa-i></div>
        <input class="input" value="{{ q }}" onChange="{{ onQ }}" placeholder="Site, client, dossier, ODT…" style="padding-left:36px">
        <template data-sc="if" value="{{ hasResults }}">
          <div style="position:absolute;top:42px;left:0;right:0;z-index:40;background:var(--color-bg);border:1px solid var(--color-text);box-shadow:var(--shadow-lg);display:flex;flex-direction:column">
            <template data-sc="for" list="{{ results }}" as="r">
              <button onClick="{{ r.go }}" style="all:unset;cursor:pointer;padding:9px 12px;display:flex;flex-direction:column;border-bottom:1px solid var(--color-divider)" data-hv="2"><span style="font-weight:500">{{ r.label }}</span><span style="font-size:12px">{{ r.sub }}</span></button>
            </template>
          </div>
        </template>
      </div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap"><span style="width:8px;height:8px;background:var(--color-accent)"></span><span>{{ liveTxt }}</span></div>
    </header>

    <main style="flex:1;overflow:auto;padding:24px 28px 40px;min-height:0"><template data-sc="if" value="{{ hasWarn }}"><div role="alert" style="margin:0 0 16px;padding:10px 14px;border:2px solid var(--color-accent-900);font-size:14px;line-height:1.4;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:240px">{{ warnTxt }}</span><button onClick="{{ retry }}" class="btn" style="min-height:32px">Réessayer</button></div></template>
<template data-sc="if" value="{{ isLoading }}"><div style="padding:32px 28px;font-size:16px">Chargement des données réelles…<br><span style="font-size:14px">{{ loadErr }}</span></div></template>
<template data-sc="if" value="{{ isSoon }}"><div style="padding:28px;max-width:640px;display:flex;flex-direction:column;gap:14px">
<h2 style="margin:0;font-size:34px">{{ soonTitle }}</h2>
<p style="margin:0;font-size:16px;line-height:1.5">Ce module arrive dans une prochaine version de sa-admin. En attendant, il reste disponible dans SA Platform, qui continue de fonctionner normalement.</p>
<a class="btn btn-primary" href="/" style="text-decoration:none;width:fit-content;padding:0 18px;min-height:44px;display:inline-flex;align-items:center">Ouvrir SA Platform</a></div></template>


      <!-- ═════ MONITORING ═════ -->
      <template data-sc="if" value="{{ isMonitoring }}">

                      <td style="padding:var(--sa-row,10px) 8px"><span style="display:inline-block;white-space:nowrap;font-size:12px;padding:2px 8px;background:{{ t.stBg }};color:{{ t.stFg }};border:1px solid {{ t.stBd }}">{{ t.statut }}</span></td>
                      <td style="padding:var(--sa-row,10px) 8px"><div style="display:flex;flex-direction:column;line-height:1.25"><span>{{ t.site }}</span><span style="font-size:12px">{{ t.ville }}</span></div></td>

                <template data-sc="for" list="{{ flux }}" as="f">
                  <div style="display:grid;grid-template-columns:48px 26px minmax(0,1fr);gap:10px;align-items:start;padding:9px 18px;border-bottom:1px solid var(--color-divider);background:{{ f.bg }};color:{{ f.fg }}">
                    <span style="font:600 15px var(--font-heading)">{{ f.h }}</span>
                    <sa-i n="{{ f.icon }}" s="18"></sa-i>
                    <div style="display:flex;flex-direction:column;line-height:1.3"><span>{{ f.txt }}</span><span style="font-size:12px">{{ f.who }} · {{ f.site }}</span><template data-sc="if" value="{{ f.hasPhoto }}"><button onClick="{{ f.openPhoto }}" style="all:unset;cursor:pointer;font-size:12px;text-decoration:underline;width:fit-content">Voir la photo jointe</button></template></div>
                  </div>
                </template>
              </div>
            </section>
          </div>

          <section class="blueprint" style="display:flex;flex-direction:column;"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div style="padding:14px 18px;border-bottom:1px solid var(--color-divider);display:flex;align-items:baseline;justify-content:space-between"><h3 style="margin:0;font-size:22px">{{ relTitle }}</h3></div><template data-sc="if" value="{{ relNone }}"><div style="padding:12px 18px">Aucun relevé {{ monPerLbl }}.</div></template><table class="table" style="font-size:14px"><tbody><template data-sc="for" list="{{ relRows }}" as="r"><tr onClick="{{ r.go }}" style="cursor:pointer"><td style="padding:var(--sa-row,10px) 8px var(--sa-row,10px) 18px;font:600 15px var(--font-heading);white-space:nowrap">{{ r.d }}</td><td style="padding:var(--sa-row,10px) 8px;font-weight:600">{{ r.site }}</td><td style="padding:var(--sa-row,10px) 8px;">{{ r.tech }}</td><td style="padding:var(--sa-row,10px) 8px;">{{ r.n }}</td><td style="padding:var(--sa-row,10px) 8px;font-weight:{{ r.fw }}">{{ r.hz }}</td><td style="padding:var(--sa-row,10px) 8px;font-size:13px">{{ r.note }}</td></tr></template></tbody></table></section><section style="display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:baseline;justify-content:space-between"><h3 style="margin:0;font-size:22px">Salles mécaniques</h3><span style="font-size:13px">{{ sallesSummary }}</span></div>

                  <div style="display:flex;flex-direction:column;padding:4px 14px 10px">
                    <template data-sc="for" list="{{ s.rows }}" as="r">
                      <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:13px"><span>{{ r.l }}</span><span style="display:flex;align-items:center;gap:6px"><span>{{ r.txt }}</span><span style="width:12px;height:12px;box-sizing:border-box;border:1px solid var(--color-text);background:{{ r.bg }}"></span></span></div>
                    </template>
                    <template data-sc="if" value="{{ s.hasLive }}"><div style="font-size:12px;font-weight:600;margin-top:4px">{{ s.live }}</div></template><template data-sc="if" value="{{ s.note }}"><div style="font-size:12px;margin-top:4px;padding-top:6px;border-top:1px solid var(--color-divider);line-height:1.35">{{ s.note }}</div></template>
                  </div>
                </button>
              </template>
            </div>
          </section>

          <section class="blueprint" style="display:flex;flex-direction:column">
            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
            <div style="padding:14px 18px;border-bottom:1px solid var(--color-divider);display:flex;align-items:baseline;justify-content:space-between"><h3 style="margin:0;font-size:22px">Relevés hors zone — dernière visite</h3><span style="font-size:13px">{{ horsZoneCount }} valeurs</span></div>

                    <td style="padding:var(--sa-row,10px) 8px"><span style="display:inline-block;white-space:nowrap;padding:2px 8px;background:var(--color-accent-900);color:var(--color-bg);font:600 15px var(--font-heading)">{{ h.val }} · {{ h.dir }}</span></td>

      <!-- ═════ CARTE ═════ -->

        <div style="display:flex;flex-direction:column;gap:16px;height:100%"><div style="font-size:13px">{{ carteInfo }}</div><template data-sc="if" value="{{ cFixing }}"><div role="status" style="padding:10px 14px;border:2px solid var(--color-accent-900);display:flex;gap:10px;align-items:center"><b style="flex:1">{{ cFixTxt }}</b><button class="btn btn-secondary" onClick="{{ cFixCancel }}">Annuler</button></div></template>
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
            <div style="display:flex;border:1px solid var(--color-divider)">
              <button onClick="{{ viewGeo }}" style="all:unset;cursor:pointer;padding:8px 16px;display:flex;align-items:center;gap:8px;font:600 15px var(--font-heading);background:{{ geoBg }};color:{{ geoFg }}"><sa-i n="map" s="17"></sa-i>Géographique</button>
              <button onClick="{{ viewSchema }}" style="all:unset;cursor:pointer;padding:8px 16px;display:flex;align-items:center;gap:8px;font:600 15px var(--font-heading);border-left:1px solid var(--color-divider);background:{{ schBg }};color:{{ schFg }}"><sa-i n="nav" s="17"></sa-i>Schéma des tournées</button>
            </div>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><div style="display:flex;flex-wrap:wrap;gap:6px"><template data-sc="for" list="{{ cShows }}" as="c"><button onClick="{{ c.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--color-divider);font-size:14px"><span style="width:16px;height:16px;border:1.5px solid var(--color-text);background:{{ c.box }};color:var(--color-bg);display:flex;align-items:center;justify-content:center"><template data-sc="if" value="{{ c.on }}"><sa-i n="check" s="12" w="3"></sa-i></template></span>{{ c.l }}</button></template></div><select class="input" onChange="{{ onCAcc }}" aria-label="Précision des punchs" style="width:auto"><template data-sc="for" list="{{ cAccs }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select><select class="input" onChange="{{ onCType }}" aria-label="Type de site" style="width:auto"><template data-sc="for" list="{{ cTypes }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select><input class="input" type="search" placeholder="Site ou client…" value="{{ cQ }}" onInput="{{ onCQ }}" style="max-width:200px"></div>
          </div>
          <template data-sc="if" value="{{ isGeo }}">
            <div style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;min-height:620px;height:calc(100vh - 200px)">
              <div class="blueprint" style="position:relative;min-height:0">
                <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
                <div id="mapSlot" style="position:absolute;inset:0"></div>
              </div>
              <div style="display:flex;flex-direction:column;border:1px solid var(--color-divider);min-height:0;overflow:auto">
                <div style="padding:12px 16px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:8px"><b style="font:600 18px var(--font-heading)">Tournée prévue</b><label style="display:flex;align-items:center;gap:8px;font-size:14px"><input type="checkbox" checked="{{ cPlanOn }}" onChange="{{ onCPlan }}">Afficher les tournées prévues de l’équipe</label><template data-sc="if" value="{{ cPlanOn }}"><input class="input" type="date" value="{{ cPlanDate }}" onChange="{{ onCPlanDate }}" aria-label="Jour de la tournée prévue"><template data-sc="if" value="{{ cPlanNone }}"><div style="font-size:13px">Aucun travail assigné ce jour-là.</div></template><template data-sc="for" list="{{ cPlanRows }}" as="r"><div style="border-left:5px solid {{ r.col }};padding:2px 8px;font-size:13px"><b>{{ r.nom }}</b><div>{{ r.txt }}</div><template data-sc="if" value="{{ r.miss }}"><div style="font-size:12px;font-weight:600">{{ r.miss }}</div></template></div></template></template></div><div style="padding:12px 16px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:8px"><b style="font:600 18px var(--font-heading)">Tournée réelle d’un technicien</b><select class="input" onChange="{{ onCEmp }}" aria-label="Technicien"><template data-sc="for" list="{{ cEmps }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select><input class="input" type="date" value="{{ cDate }}" onChange="{{ onCDate }}" aria-label="Date de la tournée"><template data-sc="if" value="{{ cTourNone }}"><div style="font-size:13px">Aucun punch géolocalisé ce jour-là.</div></template><template data-sc="for" list="{{ cTour }}" as="p"><div style="display:flex;gap:8px;font-size:13px;align-items:baseline"><b style="min-width:18px">{{ p.n }}</b><span style="flex:1">{{ p.txt }}</span><span style="font-size:12px">{{ p.acc }}</span></div></template><template data-sc="if" value="{{ cTourKm }}"><div style="font-size:13px;font-weight:600">{{ cTourKm }}</div></template></div><template data-sc="if" value="{{ cSans }}"><div style="padding:10px 16px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:6px;font-size:13px"><span>{{ cSans }}</span><template data-sc="if" value="{{ cCanGeo }}"><button class="btn btn-secondary" onClick="{{ cGeo }}">Placer ces sites d’après leur adresse</button></template></div></template><div style="padding:12px 16px;border-bottom:1px solid var(--color-divider);font:600 18px var(--font-heading)">En tournée</div>
                <template data-sc="for" list="{{ techRows }}" as="t">
                  <button onClick="{{ t.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--color-divider);opacity:{{ t.op }}" data-hv="4">
                    <span style="width:28px;height:28px;flex:none;background:{{ t.stBg }};color:{{ t.stFg }};border:1px solid var(--color-text);display:flex;align-items:center;justify-content:center;font:600 12px var(--font-heading)">{{ t.ini }}</span>
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25"><span style="font-weight:500">{{ t.nom }}</span><span style="font-size:12px">{{ t.statut }} · {{ t.site }}</span></div>

                          <span style="width:{{ s.size }}px;height:{{ s.size }}px;margin-top:{{ s.mt }}px;box-sizing:border-box;border:1.5px solid var(--color-text);background:{{ s.bg }};box-shadow:{{ s.ring }}"></span>

                          <span style="font-size:12px;line-height:1.25;font-weight:{{ s.fw }}">{{ s.nom }}</span>
                        </button>

                    </div>
                  </div>
                </div>
              </template>
            </div>
          </template>
        </div>

      <!-- ═════ INSPECTIONS ═════ -->

<div style="display:grid;grid-template-columns:272px minmax(0,1fr);border:1px solid var(--color-divider);min-height:calc(100vh - 170px)">

    </div>

      <template data-sc="for" list="{{ iq.sites }}" as="s">
        <button onClick="{{ s.go }}" style="all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--color-divider);background:{{ s.bg }};box-shadow:{{ s.bar }}">
          <span style="flex:1;min-width:0;display:flex;flex-direction:column"><span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.nom }}</span><span style="font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.sub }}</span></span>

        </button>

  <section style="min-width:0;display:flex;flex-direction:column">

      <div style="flex:1;min-width:240px;display:flex;flex-direction:column;gap:2px">

        <h2 style="margin:0;font-size:32px;line-height:1.05">{{ iq.h.nom }}</h2>

      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-primary" onClick="{{ iq.goRapport }}"><sa-i n="file" s="16"></sa-i>Rapport client</button>

        <button class="btn btn-secondary" onClick="{{ iq.voirClient }}"><sa-i n="eye" s="16"></sa-i>Voir comme le client</button>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;padding:0 22px;border-bottom:1px solid var(--color-divider)">
      <div role="tablist" style="display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0">

      </div>
      <button class="btn btn-ghost" onClick="{{ iq.togglePerso }}" aria-expanded="{{ iq.perso }}"><sa-i n="settings" s="16"></sa-i>{{ iq.persoLbl }}</button>
    </div>
    <template data-sc="if" value="{{ iq.perso }}"><div style="padding:12px 22px;border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:6px;max-width:520px">
      <b>Onglets affichés</b><span style="font-size:13px">Cochez les onglets à afficher et choisissez leur ordre. Le réglage est gardé sur cet ordinateur.</span>
      <template data-sc="for" list="{{ iq.persoRows }}" as="r"><div style="display:flex;align-items:center;gap:8px;border-top:1px solid var(--color-divider);padding-top:6px">
        <label style="flex:1;display:flex;gap:8px;align-items:center"><input type="checkbox" aria-label="{{ r.aria }}" checked="{{ r.on }}" onChange="{{ r.toggle }}">{{ r.label }}</label>
        <button class="btn btn-ghost" aria-label="Monter {{ r.label }}" disabled="{{ r.upDis }}" onClick="{{ r.up }}">↑</button>
        <button class="btn btn-ghost" aria-label="Descendre {{ r.label }}" disabled="{{ r.downDis }}" onClick="{{ r.down }}">↓</button>
      </div></template>
      <div><button class="btn btn-secondary" onClick="{{ iq.persoReset }}">Réinitialiser</button></div>
    </div></template>

    <!-- ═ Bilan par système (2a) ═ -->
    <template data-sc="if" value="{{ iq.isBilan }}"><div style="padding:18px 22px;display:flex;flex-direction:column;gap:16px">
      <template data-sc="if" value="{{ iq.noVisit }}"><div style="border:1px dashed var(--color-text);padding:14px">Aucune visite publiée pour ce site. Les visites apparaissent ici dès qu’un technicien valide une inspection dans sa-terrain, ou après une saisie bureau.</div></template>
      <template data-sc="if" value="{{ iq.hasVisit }}">
        <div style="background:var(--color-accent-100);border:1px solid var(--color-accent-300);padding:14px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap">
          <b style="flex:1;min-width:260px;font-size:17px">{{ iq.verdict }}</b>
          <template data-sc="for" list="{{ iq.cpt }}" as="c"><span style="display:inline-flex;align-items:center;gap:6px;font-size:14px"><i style="{{ c.st }}"></i><b style="font:600 22px var(--font-heading)">{{ c.n }}</b>{{ c.l }}</span></template>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--color-divider);border-left:1px solid var(--color-divider)">
          <template data-sc="for" list="{{ iq.cards }}" as="c"><div style="border-right:1px solid var(--color-divider);border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column">
            <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:{{ c.hbg }};color:{{ c.hfg }}"><sa-i n="{{ c.icone }}" s="20"></sa-i><b style="flex:1;font:600 18px var(--font-heading)">{{ c.nom }}</b><span style="display:inline-flex;align-items:center;gap:6px;font-size:13px"><i style="{{ c.pz }}"></i>{{ c.lib }}</span></div>
            <div style="padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:6px;font-size:15px">
              <template data-sc="for" list="{{ c.top }}" as="x"><div><b>{{ x.libelle }}</b><template data-sc="if" value="{{ x.valeur }}"> · {{ x.valeur }}</template><div style="font-size:13px;color:var(--color-neutral-700)">{{ x.detail }}</div></div></template>
              <template data-sc="if" value="{{ c.rien }}"><div>Rien à signaler.</div></template>
            </div>
            <button onClick="{{ c.go }}" style="all:unset;cursor:pointer;display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--color-divider);font-size:13px"><span>{{ c.pied }}</span><span>Détail →</span></button>
          </div></template>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px"><h3 style="margin:0;font-size:22px">À faire</h3>
          <template data-sc="if" value="{{ iq.noTodo }}"><div style="font-size:15px">Aucun point à suivre.</div></template>
          <table class="table" style="font-size:14px"><tbody><template data-sc="for" list="{{ iq.todo }}" as="t"><tr>
            <td style="width:150px"><span style="display:inline-flex;align-items:center;gap:6px"><i style="{{ t.pz }}"></i>{{ t.lib }}</span></td>
            <td><b>{{ t.libelle }}</b><template data-sc="if" value="{{ t.valeur }}"> · {{ t.valeur }}</template><div style="font-size:13px">{{ t.note }}</div></td><td>{{ t.sys }}</td><td>{{ t.bassin }}</td>
            <td style="text-align:right;white-space:nowrap"><template data-sc="if" value="{{ t.hasWo }}"><span style="font-size:13px">Bon de travail créé</span></template><template data-sc="if" value="{{ t.noWo }}"><button class="btn btn-secondary" onClick="{{ t.mkWo }}">Créer un bon de travail</button></template></td>
          </tr></template></tbody></table>
        </div>
      </template>
    </div></template>

    <!-- ═ Rapport de visite (2b) ═ -->
    <template data-sc="if" value="{{ iq.isVisite }}"><div style="display:grid;grid-template-columns:220px minmax(0,1fr) 250px;flex:1">
      <div style="border-right:1px solid var(--color-divider);overflow-y:auto">
        <div style="padding:10px 12px;display:flex;gap:6px"><button class="btn btn-ghost" onClick="{{ iq.prevSite }}" aria-label="Site précédent"><sa-i n="left" s="16"></sa-i></button><span style="flex:1;font-size:13px;align-self:center">Visites</span><button class="btn btn-ghost" onClick="{{ iq.nextSite }}" aria-label="Site suivant"><sa-i n="right" s="16"></sa-i></button></div>
        <template data-sc="if" value="{{ iq.noVisit }}"><div style="padding:12px;font-size:14px">Aucune visite.</div></template>
        <template data-sc="for" list="{{ iq.visites }}" as="v"><button onClick="{{ v.go }}" style="all:unset;cursor:pointer;box-sizing:border-box;width:100%;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-top:1px solid var(--color-divider);background:{{ v.bg }};box-shadow:{{ v.bar }}">
          <span style="display:flex;justify-content:space-between;gap:6px"><b>{{ v.date }}</b><i style="{{ v.pz }}"></i></span><span style="font-size:13px">{{ v.txt }}</span><span style="font-size:12px;color:var(--color-neutral-700)">{{ v.tech }}</span><template data-sc="if" value="{{ v.brouillon }}"><span style="font-size:12px;font-weight:600">Brouillon</span></template>
        </button></template>
      </div>
      <article style="padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0">
        <template data-sc="if" value="{{ iq.hasVisit }}">
          <div><h2 style="margin:0;font-size:26px">{{ iq.v.titre }}</h2><div style="font-size:14px">{{ iq.v.sub }}</div></div>
          <p style="margin:0;font-size:16px;line-height:1.5">{{ iq.v.resume }}</p>
          <template data-sc="for" list="{{ iq.v.sections }}" as="sec"><section style="border-top:1px solid var(--color-divider);padding-top:10px;display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;align-items:center;gap:8px"><sa-i n="{{ sec.icone }}" s="20"></sa-i><b style="flex:1;font:600 20px var(--font-heading)">{{ sec.nom }}</b><span style="display:inline-flex;align-items:center;gap:6px;font-size:14px"><i style="{{ sec.pz }}"></i>{{ sec.lib }}</span></div>
            <template data-sc="if" value="{{ sec.open }}"><table class="table" style="font-size:14px"><tbody><template data-sc="for" list="{{ sec.rows }}" as="x"><tr><td style="width:34%"><b>{{ x.libelle }}</b></td><td>{{ x.valeur }}<div style="font-size:13px">{{ x.detail }}</div></td><td style="white-space:nowrap"><span style="display:inline-flex;align-items:center;gap:6px"><i style="{{ x.pz }}"></i>{{ x.lib }}</span><div style="font-size:12px">{{ x.tag }}</div></td></tr></template></tbody></table>
              <template data-sc="if" value="{{ sec.more }}"><button class="btn btn-ghost" onClick="{{ iq.goTend }}" style="align-self:flex-start">{{ sec.more }}</button></template></template>
            <template data-sc="if" value="{{ sec.closed }}"><div style="font-size:14px;color:var(--color-neutral-700)">{{ sec.liste }}</div></template>
          </section></template>
        </template>
      </article>
      <aside style="border-left:1px solid var(--color-divider);padding:16px;display:flex;flex-direction:column;gap:12px">
        <template data-sc="if" value="{{ iq.hasVisit }}">
          <b>Photos</b><template data-sc="if" value="{{ iq.v.noPhoto }}"><span style="font-size:14px">Aucune photo.</span></template>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><template data-sc="for" list="{{ iq.v.photos }}" as="p"><figure style="margin:0"><img src="{{ p.src }}" alt="{{ p.leg }}" style="width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--color-divider)"><figcaption style="font-size:12px">{{ p.leg }}</figcaption></figure></template></div>
          <b>Produits ajoutés</b><template data-sc="if" value="{{ iq.v.noProd }}"><span style="font-size:14px">Aucun.</span></template>
          <template data-sc="for" list="{{ iq.v.prods }}" as="p"><div style="display:flex;justify-content:space-between;font-size:14px"><span>{{ p.nom }}</span><b>{{ p.q }}</b></div></template>
          <template data-sc="if" value="{{ iq.v.envoye }}"><div style="font-size:13px">{{ iq.v.envoye }}</div></template>
          <button class="btn btn-primary" onClick="{{ iq.v.envoyer }}"><sa-i n="send" s="16"></sa-i>Envoyer au client</button>
          <button class="btn btn-secondary" onClick="{{ iq.v.pdf }}"><sa-i n="file" s="16"></sa-i>PDF</button>
          <template data-sc="if" value="{{ iq.v.brouillon }}"><button class="btn btn-secondary" onClick="{{ iq.v.editer }}">Reprendre le brouillon</button></template>
        </template>
      </aside>
    </div></template>

    <!-- ═ Saisie bureau (5a-2) ═ -->
    <template data-sc="if" value="{{ iq.isSaisie }}"><div style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;flex:1">
      <div style="padding:18px 22px;display:flex;flex-direction:column;gap:14px;min-width:0">
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
          <div class="field"><label>Date</label><input class="input" type="date" value="{{ iq.f.date }}" onInput="{{ iq.f.onDate }}"></div>
          <div class="field"><label>Heure</label><input class="input" type="time" value="{{ iq.f.heure }}" onInput="{{ iq.f.onHeure }}"></div>
          <div class="field"><label>Au nom de</label><select class="input" onChange="{{ iq.f.onTech }}"><template data-sc="for" list="{{ iq.f.techs }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select></div>
          <div class="field"><label>Source</label><select class="input" onChange="{{ iq.f.onSrc }}"><template data-sc="for" list="{{ iq.f.srcs }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select></div>
        </div>
        <template data-sc="if" value="{{ iq.f.hasB }}"><div class="field"><label>Bassin</label><select class="input" onChange="{{ iq.f.onB }}" style="max-width:340px"><template data-sc="for" list="{{ iq.f.bassins }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select></div></template>
        <h3 style="margin:6px 0 0;font-size:22px">Eau du bassin</h3>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
          <template data-sc="for" list="{{ iq.f.eau }}" as="e"><div class="field"><label>{{ e.label }}</label><input class="input" inputmode="decimal" value="{{ e.v }}" onInput="{{ e.on }}" aria-label="{{ e.aria }}" style="font:600 20px var(--font-heading);background:{{ e.bg }};color:{{ e.fg }}"></div></template>
        </div>
        <template data-sc="for" list="{{ iq.f.sys }}" as="y"><details open="{{ y.open }}" style="border:1px solid var(--color-divider)">
          <summary style="cursor:pointer;padding:10px 12px;display:flex;align-items:center;gap:10px"><sa-i n="{{ y.icone }}" s="18"></sa-i><b style="flex:1">{{ y.nom }}</b><span style="font-size:13px">{{ y.txt }}</span></summary>
          <div style="padding:0 12px 12px;display:flex;flex-direction:column;gap:8px">
            <template data-sc="if" value="{{ y.canAll }}"><button class="btn btn-secondary" onClick="{{ y.allOk }}" style="align-self:flex-start">Tout conforme</button></template>
            <template data-sc="for" list="{{ y.pts }}" as="q"><div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--color-divider);padding-top:8px">
              <span>{{ q.libelle }}<template data-sc="if" value="{{ q.req }}"> <b>(obligatoire)</b></template></span>
              <div role="group" aria-label="{{ q.libelle }}" style="display:flex;border:1px solid var(--color-text)"><template data-sc="for" list="{{ q.opts }}" as="o"><button onClick="{{ o.go }}" aria-pressed="{{ o.on }}" style="all:unset;cursor:pointer;padding:6px 10px;font-size:14px;font-weight:600;background:{{ o.bg }};color:{{ o.fg }}">{{ o.label }}</button></template></div>
              <template data-sc="if" value="{{ q.bad }}"><input class="input" value="{{ q.note }}" onInput="{{ q.onNote }}" placeholder="Note" aria-label="Note : {{ q.libelle }}" style="grid-column:1 / -1"></template>
            </div></template>
          </div>
        </details></template>
        <div class="field"><label>Note de la visite</label><textarea class="input" value="{{ iq.f.note }}" onInput="{{ iq.f.onNote }}" style="min-height:70px"></textarea></div>
        <p style="margin:0;font-size:15px"><b>Résumé :</b> {{ iq.f.resume }}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--color-divider);padding-top:12px">
          <button class="btn btn-secondary" onClick="{{ iq.f.brouillon }}">Enregistrer le brouillon</button>
          <button class="btn btn-secondary" onClick="{{ iq.voirClient }}">Aperçu client</button>
          <span style="flex:1"></span>
          <button class="btn btn-primary" onClick="{{ iq.f.publier }}">{{ iq.f.publierLbl }}</button>
        </div>
        <div style="font-size:13px">Toute saisie bureau est journalisée : « saisie par {{ iq.f.par }} ».</div>
      </div>
      <aside style="border-left:1px solid var(--color-divider);padding:16px;display:flex;flex-direction:column;gap:12px">
        <b>Niveaux d’accès du client</b>
        <table class="table" style="font-size:13px"><thead><tr><th></th><th>Opér.</th><th>Gest.</th><th>Dir.</th></tr></thead><tbody><template data-sc="for" list="{{ iq.grille }}" as="g"><tr><td>{{ g.l }}</td><td>{{ g.o }}</td><td>{{ g.g }}</td><td>{{ g.d }}</td></tr></template></tbody></table>
        <b>Après publication</b>
        <label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" checked="{{ iq.f.envoyer }}" onChange="{{ iq.f.onEnvoyer }}">Aviser les contacts du client (courriel)</label>
        <div style="font-size:13px">Le rapport est visible sur le portail (page du code QR) dès la publication.</div>
      </aside>
    </div></template>

    <!-- ═ Bassins et plan (5a-1) ═ -->
    <template data-sc="if" value="{{ iq.isBassins }}"><div style="display:grid;grid-template-columns:minmax(0,1fr) 400px;flex:1">
      <div style="padding:18px 22px;display:flex;flex-direction:column;gap:12px;min-width:0">
        <template data-sc="if" value="{{ iq.needAdmin }}"><div style="border:1px dashed var(--color-text);padding:12px;font-size:14px">Plans et documents : ouvrez d’abord la gestion sécurisée dans l’onglet « Accès client ».</div></template>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center"><template data-sc="for" list="{{ iq.plans }}" as="p"><button onClick="{{ p.go }}" style="all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--color-text);font-weight:600;background:{{ p.bg }};color:{{ p.fg }}">{{ p.label }}</button></template>
          <label class="btn btn-secondary" style="cursor:pointer">+ Plan (image)<input type="file" accept="image/*" onChange="{{ iq.upPlan }}" style="display:none"></label></div>
        <div onPointerDown="{{ iq.planDown }}" onPointerMove="{{ iq.planMove }}" onPointerUp="{{ iq.planUp }}" style="position:relative;height:260px;border:1px solid var(--color-divider);background:var(--color-neutral-100);touch-action:none">
          <template data-sc="if" value="{{ iq.planSrc }}"><img src="{{ iq.planSrc }}" alt="Plan" draggable="false" style="width:100%;height:100%;object-fit:contain;pointer-events:none"></template>
          <template data-sc="if" value="{{ iq.noPlan }}"><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px">Aucun plan pour ce site.</div></template>
          <template data-sc="for" list="{{ iq.markers }}" as="m"><span data-bassin="{{ m.id }}" title="{{ m.nom }}" style="position:absolute;left:{{ m.x }}%;top:{{ m.y }}%;transform:translate(-50%,-50%);width:30px;height:30px;display:flex;align-items:center;justify-content:center;font:600 16px var(--font-heading);cursor:grab;{{ m.st }}">{{ m.n }}</span></template>
        </div>
        <div style="font-size:13px">Glissez un numéro pour placer le bassin sur le plan (position enregistrée en % du plan).</div>
        <h3 style="margin:8px 0 0;font-size:20px">Plans et documents</h3>
        <label class="btn btn-secondary" style="cursor:pointer;align-self:flex-start">+ Document<input type="file" onChange="{{ iq.upDoc }}" style="display:none"></label>
        <table class="table" style="font-size:14px"><tbody><template data-sc="for" list="{{ iq.docs }}" as="d"><tr><td><sa-i n="{{ d.icon }}" s="16"></sa-i></td><td><template data-sc="if" value="{{ d.url }}"><a href="{{ d.url }}" target="_blank" rel="noopener">{{ d.titre }}</a></template><template data-sc="if" value="{{ d.noUrl }}">{{ d.titre }}</template><div style="font-size:12px">{{ d.sub }}</div></td>
          <td><select class="input" aria-label="Visibilité : {{ d.titre }}" onChange="{{ d.onVis }}" style="min-height:34px"><template data-sc="for" list="{{ d.vis }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select></td><td><button class="btn btn-ghost" onClick="{{ d.del }}" aria-label="Retirer {{ d.titre }}"><sa-i n="x" s="16"></sa-i></button></td></tr></template></tbody></table>
      </div>
      <aside style="border-left:1px solid var(--color-divider);padding:16px;display:flex;flex-direction:column;gap:10px">
        <b>Bassins ({{ iq.nB }})</b>
        <template data-sc="for" list="{{ iq.bassins }}" as="b"><div style="display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--color-divider);padding-top:8px">
          <span style="width:30px;height:30px;flex:none;display:flex;align-items:center;justify-content:center;font:600 16px var(--font-heading);{{ b.st }}">{{ b.n }}</span>
          <div style="flex:1;display:flex;flex-direction:column"><b>{{ b.nom }}</b><span style="font-size:13px">{{ b.etat }} · {{ b.resume }}</span><span style="font-size:12px;color:var(--color-neutral-700)">{{ b.meta }}</span></div>
        </div></template>
        <div style="border-top:1px solid var(--color-divider);padding-top:10px;display:flex;flex-direction:column;gap:6px">
          <b>+ Ajouter un bassin</b>
          <input class="input" placeholder="Nom (ex. Pataugeoire)" aria-label="Nom du nouveau bassin" value="{{ iq.nb.nom }}" onInput="{{ iq.nb.onNom }}">
          <select class="input" aria-label="Type du nouveau bassin" onChange="{{ iq.nb.onType }}"><template data-sc="for" list="{{ iq.nb.types }}" as="o"><option value="{{ o.v }}" selected="{{ o.sel }}">{{ o.l }}</option></template></select>
          <input class="input" placeholder="Volume (m³)" aria-label="Volume du nouveau bassin" value="{{ iq.nb.vol }}" onInput="{{ iq.nb.onVol }}">
          <button class="btn btn-primary" onClick="{{ iq.nb.add }}">Ajouter le bassin</button>
        </div>
      </aside>
    </div></template>

    <!-- ═ Accès client et QR (4a-5) ═ -->
    <template data-sc="if" value="{{ iq.isAcces }}"><div style="padding:18px 22px;display:flex;flex-direction:column;gap:16px">
      <template data-sc="if" value="{{ iq.needAdmin }}"><form onSubmit="{{ iq.ouvrir }}" style="display:flex;flex-direction:column;gap:10px;max-width:420px;border:1px solid var(--color-divider);padding:16px">
        <b>Gestion sécurisée des accès client</b><span style="font-size:14px">Les contacts, codes QR et journaux ne sont pas lisibles avec la clé publique. Confirmez votre mot de passe pour ouvrir une session de gestion de 12 heures.</span>
        <input class="input" type="password" autocomplete="current-password" aria-label="Mot de passe" placeholder="Votre mot de passe" value="{{ iq.pw }}" onInput="{{ iq.onPw }}">
        <button class="btn btn-primary" type="submit">Ouvrir la gestion</button><span style="font-size:14px">{{ iq.adminErr }}</span>
      </form></template>
      <template data-sc="if" value="{{ iq.hasAdmin }}">
        <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
          <div class="field" style="flex:1;min-width:240px"><label>Compte client (organisation)</label><input class="input" value="{{ iq.cp.nom }}" onInput="{{ iq.cp.onNom }}" placeholder="ex. Ville de Granby"></div>
          <label class="btn btn-secondary" style="cursor:pointer">Logo du client<input type="file" accept="image/*" onChange="{{ iq.cp.upLogo }}" style="display:none"></label>
          <button class="btn btn-primary" onClick="{{ iq.cp.save }}">{{ iq.cp.saveLbl }}</button>
        </div>
          <section style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0;font-size:20px">Codes QR</h3><span style="font-size:13px">Le code QR ouvre le portail de cette installation. Il n’ouvre aucune donnée sans un contact autorisé.</span>
            <template data-sc="for" list="{{ iq.qrs }}" as="q"><div style="display:flex;gap:12px;align-items:center;border-top:1px solid var(--color-divider);padding-top:8px">
              <template data-sc="if" value="{{ q.img }}"><img src="{{ q.img }}" alt="Code QR {{ q.code }}" style="width:96px;height:96px"></template>
              <div style="flex:1;display:flex;flex-direction:column;gap:4px"><b>{{ q.nom }}</b><span style="font-size:13px">{{ q.code }} · {{ q.etat }}</span>
                <div style="display:flex;gap:6px;flex-wrap:wrap"><template data-sc="if" value="{{ q.img }}"><button class="btn btn-secondary" onClick="{{ q.print }}">Imprimer l’affiche</button></template><button class="btn btn-secondary" onClick="{{ q.regen }}">{{ q.regenLbl }}</button></div></div>
            </div></template>
            <span style="font-size:13px">« Régénérer » désactive immédiatement l’ancien code.</span>
          </section>
        <template data-sc="if" value="{{ iq.cp.exists }}">
        <div style="display:grid;grid-template-columns:minmax(0,1fr);gap:18px">
          <section style="display:flex;flex-direction:column;gap:8px"><h3 style="margin:0;font-size:20px">Ce que le client voit</h3>

</div></div>
</template><div style="display:{{ sitesRepDisp }};flex-direction:column;gap:26px"><template data-sc="if" value="{{ noNouveaux }}"><div style="margin:12px 28px 0;padding:12px 14px;border:1px dashed var(--color-text);font-size:15px">Aucun site détecté automatiquement en attente.</div></template>

          <section class="blueprint" style="display:flex;flex-direction:column">

            <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

              <thead><tr><th style="text-transform:none;letter-spacing:0;font-size:12px;padding-left:18px">N° ODT</th><th style="text-transform:none;letter-spacing:0;font-size:12px">N° PO</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Client · site</th><th style="text-transform:none;letter-spacing:0;font-size:12px">Date</th><th style="text-transform:none;letter-spacing:0;font-size:12px;text-align:right">Prix calculé</th><th style="text-transform:none;letter-spacing:0;font-size:12px;text-align:right">Prix facturé</th><th style="text-transform:none;letter-spacing:0;font-size:12px;text-align:right">Écart</th><th style="text-transform:none;letter-spacing:0;font-size:12px;padding-right:18px">Statut</th></tr></thead>

/* ═════════════ VUE GLOBALE (le tableau de bord « Vue globale » de SA Platform) ═════════════
   Chiffres clés, charge de chaque technicien sur 4 semaines, alertes, travaux des 7 prochains jours,
   et la file « terminé par l'équipe → à valider » (bons de travail, créneaux, tâches planning). */

    soft('plan?select=id,client,addr,date,heure,emp,emps,descr,status,termine,termine_by,termine_at,valide,updated_at&date=gte.'+iso(addDays(new Date(),-90)),[]),
    soft('planning_tasks?select=id,titre,emp,site_nom,date_debut,date_fin,heure_debut,statut,termine,termine_by,termine_at,valide,updated_at&date_fin=gte.'+iso(addDays(new Date(),-90)),[])])
    .then(function(r){self.glob={wo:r[0],plan:r[1],pt:r[2],a:a,b:b};self.update();});};
/* Les employés d'un élément, en identifiants : SA Platform range des NOMS dans assigne/emp et les identifiants dans assignes/emps. */

Comp.prototype.globData=function(){var self=this,D=this.D,G=this.glob,today=iso(new Date()),mon=mondayOf(new Date()),nm=this.names();
  var wos=G.wo,open=wos.filter(function(w){return!woDone(w.status)&&w.status!=='annule';}),late=open.filter(function(w){return w.date&&w.date<today;});
  var pts=G.pt.filter(function(t){return t.statut!=='annule';}),actives=pts.filter(function(t){return t.date_debut<=today&&t.date_fin>=today;});
  var abs=actives.filter(function(t){return ABS_RE.test(t.titre||'');});
  var q=[];
  wos.forEach(function(w){if(w.termine&&!w.valide)q.push({kind:'wo',table:'workorders',id:w.id,u:w.updated_at,quoi:'Bon de travail',nom:w.client||'Bon de travail',d:w.date,qui:w.termine_by,at:w.termine_at,txt:w.descr||''});});
  G.plan.forEach(function(p){if(p.termine&&!p.valide)q.push({kind:'plan',table:'plan',id:p.id,u:p.updated_at,quoi:'Créneau',nom:p.client||'Créneau',d:p.date,qui:p.termine_by,at:p.termine_at,txt:p.descr||''});});
  G.pt.forEach(function(t){if(t.termine&&!t.valide)q.push({kind:'pt',table:'planning_tasks',id:t.id,u:t.updated_at,quoi:'Tâche planning',nom:t.titre||t.site_nom||'Tâche',d:t.date_debut,qui:t.termine_by,at:t.termine_at,txt:t.site_nom&&t.titre?t.site_nom:''});});
  q.sort(function(a,b){return String(b.at||'').localeCompare(String(a.at||''));});
  var techs=D.comptes.filter(function(c){return c.role!=='admin'&&D.statut[c.id]!=='inactif';});
  var busy=function(id,day){return pts.some(function(t){return t.date_debut<=day&&t.date_fin>=day&&!ABS_RE.test(t.titre||'')&&self.globIds(null,t.emp).indexOf(id)>=0;})
      ||open.some(function(w){return w.date===day&&self.globIds(w.assignes,w.assigne).indexOf(id)>=0;})
      ||G.plan.some(function(p){return p.date===day&&self.globIds(p.emps,p.emp).indexOf(id)>=0;});},
    away=function(id,day){return pts.some(function(t){return t.date_debut<=day&&t.date_fin>=day&&ABS_RE.test(t.titre||'')&&self.globIds(null,t.emp).indexOf(id)>=0;});};
  var weeks=[0,1,2,3].map(function(w){var m=addDays(mon,7*w);return{m:m,lbl:'Sem. '+isoWeek(m)+' · '+m.getDate()+' '+MOIS[m.getMonth()].slice(0,4)+'.'};});
  var charge=techs.map(function(c){var cells=weeks.map(function(w){var occ=0,ab=0;for(var d=0;d<5;d++){var day=iso(addDays(w.m,d));if(away(c.id,day))ab++;else if(busy(c.id,day))occ++;}

    return{id:c.id,nom:(c.prenom+' '+c.nom).trim(),cells:cells,abs:abs.some(function(t){return self.globIds(null,t.emp).indexOf(c.id)>=0;})};})

  var pend=0;(D.ft||[]).forEach(function(r){(r.days||[]).forEach(function(d){((d&&d.tasks)||[]).forEach(function(t){if(t.pendingValidation)pend++;});});});
  var al=[];
  late.slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date));}).slice(0,5).forEach(function(w){var j=Math.round((new Date(today+'T12:00:00')-new Date(w.date+'T12:00:00'))/86400000);
    al.push({lvl:'Retard',t:(w.client||'Client')+' — bon de travail en retard',s:'Prévu le '+fdate(w.date)+', '+j+' jour'+(j>1?'s':'')+' de retard',go:'planning'});});
  if(late.length>5)al.push({lvl:'Retard',t:(late.length-5)+' autre(s) bon(s) de travail en retard',s:'Voir le Planning équipe',go:'planning'});
  charge.filter(function(c){return c.cells[0].pct>=90&&c.cells[0].ab<5;}).forEach(function(c){al.push({lvl:'Charge',t:c.nom+' — charge élevée',s:c.cells[0].pct+' % cette semaine',go:'planning'});});
  if(q.length)al.push({lvl:'À valider',t:q.length+' élément(s) terminé(s) à valider',s:'Bons de travail, créneaux et tâches marqués terminés par l’équipe — voir plus bas',go:null});
  if(pend)al.push({lvl:'Temps',t:pend+' punch(s) à valider',s:'Feuilles de temps — onglet « À valider »',go:'temps'});
  var urg=(D.dem||[]).filter(function(d){return d.statut!=='Traitée'&&d.type==='Urgence';}).length;if(urg)al.push({lvl:'Urgence',t:urg+' demande(s) urgente(s) non traitée(s)',s:'Demandes du terrain',go:'monitoring'});
  var low=(D.inv||[]).filter(function(i){return i.seuil!=null&&i.seuil!==''&&Number(i.qte)<Number(i.seuil);});if(low.length)al.push({lvl:'Stock',t:low.length+' produit(s) sous le seuil',s:low.slice(0,3).map(function(i){return i.nom;}).join(', '),go:'stock'});
  var end=iso(addDays(new Date(),7)),nx=[],who=function(ids){return ids.map(function(x){return nm[x]||x;}).join(', ')||'non assigné';};
  pts.forEach(function(t){if(t.date_debut>=today&&t.date_debut<=end&&!ABS_RE.test(t.titre||''))nx.push({d:t.date_debut,h:t.heure_debut||'',quoi:'Tâche planning',nom:t.titre||t.site_nom||'Tâche',sub:t.site_nom&&t.site_nom!==t.titre?t.site_nom:'',qui:who(self.globIds(null,t.emp))});});
  open.forEach(function(w){if(w.date>=today&&w.date<=end)nx.push({d:w.date,h:'',quoi:'Bon de travail'+(w.priorite==='urgent'?' · urgent':''),nom:w.client||'Bon de travail',sub:w.descr||'',qui:who(self.globIds(w.assignes,w.assigne))});});
  G.plan.forEach(function(p){if(p.date>=today&&p.date<=end&&p.status!=='termine')nx.push({d:p.date,h:p.heure||'',quoi:'Créneau',nom:p.client||'Créneau',sub:p.descr||'',qui:who(self.globIds(p.emps,p.emp))});});
  nx.sort(function(a,b){return(a.d+(a.h||'99')).localeCompare(b.d+(b.h||'99'));});
  return{open:open,late:late,actives:actives,abs:abs,q:q,charge:charge,weeks:weeks,al:al,nx:nx,jobs:actives.filter(function(t){return!ABS_RE.test(t.titre||'');}).length+open.filter(function(w){return w.status==='en_cours';}).length};};
/* Valider : écriture conditionnelle (updated_at) — si l'employé a modifié l'élément entre-temps, rien n'est écrasé. */

  var path=it.table+'?id=eq.'+encodeURIComponent(it.id)+'&updated_at='+(it.u?'eq.'+encodeURIComponent(it.u):'is.null');

/* ---------- sa-admin › Sites & Clients : un client regroupe plusieurs sites ; un site garde ses bassins et installations ----------
   Inséré dans app.js par assemble.py (même portée : get, rest, rpc, Comp, fdate, iso, norm, auditT…).
   Base : tables clients, lieux_alias, sites_fusions et fonctions site_fusionner / lieu_classer (docs/sql/MIGRATION_2026-10-05_clients_sites.sql). */
var CL_TABS=[['clients','Clients'],['lieux','Lieux à classer'],['rep','Répertoire']];
function lieuKey(s){return String(s||'').trim().toLowerCase();}
var CL_VIDES=/^(ccnq|ville|de|des|du|la|le|les|l|d|piscine|residence|complexe|locatif|groupe|quai|place|station|et|a|au)$/;
function clMots(s){return norm(s).split(' ').filter(function(w){return w.length>1&&!CL_VIDES.test(w);});}

/* Site conservé d'un identifiant : suit les fusions (« Fusionné → Nom [id] ») */
Comp.prototype.siteCanon=function(id){var D=this.D,s=D&&D.byId[String(id)],n=0;
  while(s&&s.merged&&n++<5){var m=/\[([^\]]+)\]/.exec(s.notes);if(!m||!D.byId[m[1]])break;s=D.byId[m[1]];}return s||null;};
/* Site d'un punch : identifiant (suivi des fusions), sinon lieu déjà classé, sinon nom identique */
Comp.prototype.siteOfTask=function(t){var D=this.D;if(!D||!t)return null;
  var s=t.siteId?this.siteCanon(t.siteId):null;if(s)return s;
  var a=D.alias&&D.alias[lieuKey(t.lieu)];if(a){s=this.siteCanon(a);if(s)return s;}
  var k=norm(t.lieu);if(!k)return null;return D.sites.filter(function(x){return norm(x.nom)===k;})[0]||null;};

/* Tous les punchs (lecture à la demande, pour « Lieux à classer » et le nombre de punchs par site) */
Comp.prototype.clLoadFt=function(force){var self=this;if(this._clFt&&!force)return;this._clFt=1;
  get('feuilles_temps?select=uid,week,days').then(function(rows){self.clFt=rows||[];self.update();}).catch(function(e){self._clFt=0;self.flash('Lecture des punchs impossible : '+netMsg(e));});};
Comp.prototype.clStats=function(){var self=this,parSite={},lieux={};
  (this.clFt||[]).forEach(function(f){(f.days||[]).forEach(function(d,i){((d&&d.tasks)||[]).forEach(function(t){
    var s=self.siteOfTask(t);if(s){parSite[s.id]=(parSite[s.id]||0)+1;return;}
    var k=norm(t.lieu);if(!k)return;var date=iso(addDays(new Date(f.week+'T12:00:00'),i)),L=lieux[k]||(lieux[k]={k:k,brut:{},n:0,last:''});
    L.brut[String(t.lieu)]=(L.brut[String(t.lieu)]||0)+1;L.n++;if(date>L.last)L.last=date;});});});
  return{parSite:parSite,lieux:Object.keys(lieux).map(function(k){return lieux[k];}).sort(function(a,b){return b.n-a.n;})};};
/* Site le plus probable pour un lieu saisi à la main : mots en commun avec le nom du site et de son client */
Comp.prototype.clSuggest=function(lieu){var D=this.D,cn={},m=clMots(lieu),k=norm(lieu),best=null,bs=0;(D.clients||[]).forEach(function(c){cn[c.id]=c.nom;});
  if(!m.length&&!k)return null;
  D.sites.forEach(function(s){var nom=norm(s.nom),cli=norm(cn[s.client_id]||''),sm=clMots(s.nom+' '+(cn[s.client_id]||'')),sc=0;
    m.forEach(function(w){if(sm.indexOf(w)>=0)sc+=2;else if(sm.some(function(x){return x.length>3&&(x.indexOf(w)===0||w.indexOf(x)===0);}))sc+=1;});
    if(k&&(nom.indexOf(k)>=0||k.indexOf(nom)>=0))sc+=1;if(k&&cli&&k.indexOf(cli)>=0)sc+=0.5;
    if(s.interne&&/\b(entrepot|bureau|shop|garage)\b/.test(k)&&nom.indexOf(k.split(' ')[0])>=0)sc+=3;
    if(sc>bs){bs=sc;best=s;}});
  return bs>=2?best:null;};

Comp.prototype.clSetClient=function(siteId,clientId){var self=this,s=this.D.byId[siteId];
  rest('PATCH','sites?id=eq.'+encodeURIComponent(siteId),{client_id:clientId||null,updated_at:nowIso()})
   .then(function(){s.client_id=clientId||null;auditT(self,'MODIFICATION','sites',siteId,{client_id:clientId||null});var c=self.clientById(clientId);self.flash(c?'« '+s.nom+' » rattaché à '+c.nom:'« '+s.nom+' » n’a plus de client');self.update();})
   .catch(function(e){self.flash('Échec — rien n’a été modifié : '+netMsg(e));});};
Comp.prototype.clientById=function(id){return(this.D.clients||[]).filter(function(c){return c.id===id;})[0]||null;};
Comp.prototype.clSaveClient=function(){var self=this,e=this.state.cle;if(!e||e.busy)return;var nom=String(e.nom||'').trim();
  if(!nom){this.flash('Le nom du client ne peut pas être vide');return;}
  if((this.D.clients||[]).some(function(c){return c.id!==e.id&&norm(c.nom)===norm(nom);})){this.flash('Un client porte déjà ce nom');return;}
  var id=e.id||('cl-'+norm(nom).replace(/ /g,'-').slice(0,40)+'-'+Date.now().toString(36).slice(-4)),body={nom:nom,interne:!!e.interne,updated_at:nowIso()};
  this.setState({cle:Object.assign({},e,{busy:true})});
  (e.id?rest('PATCH','clients?id=eq.'+encodeURIComponent(id),body):rest('POST','clients',Object.assign({id:id},body)))
   .then(function(){auditT(self,e.id?'MODIFICATION':'CREATION','clients',id);var site=e.siteId;self.setState({cle:null});self.flash(e.id?'Client enregistré':'Client « '+nom+' » créé');
     return self.reloadAll().then(function(){if(site)self.clSetClient(site,id);});})
   .catch(function(err){self.setState({cle:Object.assign({},e,{busy:false})});self.flash('Échec — rien n’a été modifié : '+netMsg(err));});};
/* Fusion : la base déplace toutes les données liées en une seule opération (site_fusionner) */
Comp.prototype.clFusionner=function(){var self=this,m=this.state.clm;if(!m||m.busy)return;var s=this.D.byId[m.src],d=this.D.byId[m.dst];
  this.setState({clm:Object.assign({},m,{busy:true})});
  rpc('site_fusionner',{p_src:m.src,p_dst:m.dst,p_par:this.user.id,p_installation:m.garde&&!(s.bassins||[]).length?String(m.inst||'').trim()||null:null})
   .then(function(){auditT(self,'FUSION','sites',m.src,{dans:m.dst});self.setState({clm:null});self.flash('« '+s.nom+' » fusionné dans « '+d.nom+' » — tout l’historique a suivi');self._clFt=0;return self.reloadAll();})
   .catch(function(e){self.setState({clm:Object.assign({},m,{busy:false})});self.flash('Échec — rien n’a été fusionné : '+netMsg(e));});};
Comp.prototype.clClasser=function(L,siteId){var self=this,s=this.D.byId[siteId];if(!s)return;
  rpc('lieu_classer',{p_lieux:Object.keys(L.brut),p_site:siteId,p_par:this.user.id})
   .then(function(n){auditT(self,'CLASSEMENT','lieux_alias',L.k,{site:siteId});Object.keys(L.brut).forEach(function(b){self.D.alias[lieuKey(b)]=siteId;});
     self.flash('« '+Object.keys(L.brut)[0]+' » classé dans « '+s.nom+' » ('+L.n+' punch'+(L.n>1?'s':'')+')');var ls=Object.assign({},self.state.lieuSel);delete ls[L.k];self.setState({lieuSel:ls});})
   .catch(function(e){self.flash('Échec — rien n’a été classé : '+netMsg(e));});};

Comp.prototype.clientsVals=function(){var self=this,st=this.state,D=this.D;
  var off={sitesTabs:[],isClTab:false,isLxTab:false,sitesRepDisp:'flex',cl:{}};
  if(!D||st.mod!=='sites')return off;
  var tab=st.sitesTab||'clients',noDb=!D.hasClients;
  if(tab!=='rep'&&!noDb)this.clLoadFt();
  var S=this.clStats(),clients=(D.clients||[]).slice().sort(function(a,b){return(a.interne-b.interne)||a.nom.localeCompare(b.nom,'fr');});
  var nLieux=S.lieux.length;
  var tabs=CL_TABS.map(function(t){var on=t[0]===tab;return{label:t[1]+(t[0]==='lieux'&&self.clFt&&nLieux?' ('+nLieux+')':''),on:on,bd:on?'var(--color-text)':'transparent',go:function(){self.setState({sitesTab:t[0]});}};});
  var cl={noDb:noDb&&tab!=='rep',q:st.clQ||'',onQ:function(e){self.setState({clQ:e.target.value});},nouveau:function(){self.setState({cle:{id:null,nom:'',interne:false}});},
    close:function(){self.setState({cle:null,clm:null});},closeBg:function(e){if(e.target===e.currentTarget)self.setState({cle:null,clm:null});}};
  if(tab==='clients'&&!noDb){var q=norm(st.clQ||''),cOpts=function(cur){return[{v:'',l:'— Aucun client —',sel:!cur}].concat(clients.map(function(c){return{v:c.id,l:c.nom+(c.interne?' (interne)':''),sel:c.id===cur};})).concat([{v:'__new',l:'+ Nouveau client…',sel:false}]);};
    var row=function(s){var others=D.sites.filter(function(x){return x.id!==s.id;});
      return{nom:s.nom,addr:s.addr||'sans adresse',inst:(s.bassins||[]).map(function(b){return b.nom;}).filter(Boolean).join(' · ')||'—',n:self.clFt?(S.parSite[s.id]||0):'…',go:function(){self.openSiteFiche(s.id);},
        clientOpts:cOpts(s.client_id),onClient:function(e){var v=e.target.value;if(v==='__new'){e.target.value=s.client_id||'';self.setState({cle:{id:null,nom:'',interne:false,siteId:s.id}});return;}self.clSetClient(s.id,v);},
        mergeOpts:[{v:'',l:'—',sel:true}].concat(others.map(function(x){return{v:x.id,l:x.nom,sel:false};})),
        onMerge:function(e){var v=e.target.value;e.target.value='';if(!v)return;var d=D.byId[v],rest_=norm(s.nom).replace(norm(d.nom),'').trim();
          self.setState({clm:{src:s.id,dst:v,garde:!(s.bassins||[]).length&&!!rest_,inst:rest_?s.nom.split(/\s+-\s+/).pop():''}});}};};
    var match=function(s,c){return!q||norm(s.nom+' '+s.addr+' '+(c?c.nom:'')).indexOf(q)>=0;};
    var groupes=clients.map(function(c){var ss=D.sites.filter(function(s){return s.client_id===c.id&&match(s,c);});
      return{nom:c.nom,interne:!!c.interne,sous:ss.length+' site'+(ss.length>1?'s':''),vide:!ss.length,sites:ss.map(row),_ok:!q||ss.length||norm(c.nom).indexOf(q)>=0,
        edit:function(){self.setState({cle:{id:c.id,nom:c.nom,interne:!!c.interne}});}};}).filter(function(g){return g._ok;});
    var sans=D.sites.filter(function(s){return!self.clientById(s.client_id)&&match(s,null);});
    if(sans.length)groupes.push({nom:'Sites sans client',interne:false,sous:sans.length+' à rattacher',vide:false,sites:sans.map(row),edit:null});
    cl.groupes=groupes;cl.resume=clients.length+' client'+(clients.length>1?'s':'')+' · '+D.sites.length+' sites · '+D.sites.filter(function(s){return!self.clientById(s.client_id);}).length+' sans client';}
  if(tab==='lieux'&&!noDb){var sel=st.lieuSel||{},sOpts=D.sites.slice().sort(function(a,b){var ca=(self.clientById(a.client_id)||{}).nom||'~',cb=(self.clientById(b.client_id)||{}).nom||'~';return ca.localeCompare(cb,'fr')||a.nom.localeCompare(b.nom,'fr');});
    cl.lxLoading=!this.clFt;cl.lxVide=!!this.clFt&&!nLieux;
    cl.lieux=S.lieux.slice(0,150).map(function(L){var sg=self.clSuggest(Object.keys(L.brut)[0]),v=sel[L.k]!=null?sel[L.k]:(sg?sg.id:''),br=Object.keys(L.brut);
      return{lieu:br.sort(function(a,b){return L.brut[b]-L.brut[a];})[0],variantes:br.length>1?br.length+' écritures : '+br.slice(0,4).join(' · '):'',n:L.n,dernier:fdate(L.last),sugg:sg&&!sel[L.k]?'Suggestion d’après le nom':'',off:!v,
        opts:[{v:'',l:'— Choisir un site —',sel:!v}].concat(sOpts.map(function(s){var c=self.clientById(s.client_id);return{v:s.id,l:(c?c.nom+' › ':'')+s.nom,sel:s.id===v};})),
        onSite:function(e){var o=Object.assign({},self.state.lieuSel);o[L.k]=e.target.value;self.setState({lieuSel:o});},classer:function(){if(v)self.clClasser(L,v);}};});}
  var ce=st.cle,cm=st.clm,ms=cm&&D.byId[cm.src],md=cm&&D.byId[cm.dst];
  Object.assign(cl,{dlgClient:!!ce,ceTitre:ce&&ce.id?'Modifier le client':'Nouveau client',ceNom:ce?ce.nom:'',ceInterne:!!(ce&&ce.interne),
    onCeNom:function(e){self.setState({cle:Object.assign({},self.state.cle,{nom:e.target.value})});},onCeInterne:function(e){self.setState({cle:Object.assign({},self.state.cle,{interne:e.target.checked})});},ceSave:function(){self.clSaveClient();},
    dlgMerge:!!(ms&&md),mSrc:ms?ms.nom:'',mDst:md?md.nom:'',mSansBassin:!!ms&&!(ms.bassins||[]).length,mGarde:!!(cm&&cm.garde),mInst:cm?cm.inst:'',mLabel:cm&&cm.busy?'Fusion…':'Fusionner',
    onMGarde:function(e){self.setState({clm:Object.assign({},self.state.clm,{garde:e.target.checked})});},onMInst:function(e){self.setState({clm:Object.assign({},self.state.clm,{inst:e.target.value})});},mGo:function(){self.clFusionner();}});
  return{sitesTabs:tabs,isClTab:tab==='clients'&&!noDb,isLxTab:tab==='lieux'&&!noDb,sitesRepDisp:tab==='rep'?'flex':'none',cl:cl};};

})();
