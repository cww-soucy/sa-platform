<!doctype html>
<html lang="fr-CA" data-theme="encre">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050E17">
<title>SA Gestion — Soucy Aquatik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ==TOKENS== */
:root{
  /* — Identité (ne pas modifier) — */
  --sa-marine:#004987;
  --sa-marine-900:#00233F;
  --sa-marine-700:#003766;
  --sa-marine-100:#DCE8F3;

  /* — Encre (neutres froids tirés du marine) — */
  --ink-950:#050E17;
  --ink-900:#0A1826;
  --ink-850:#0F2132;
  --ink-800:#152A3E;
  --ink-700:#223A51;
  --ink-600:#3A5068;
  --ink-500:#5C7187;
  --ink-400:#8697A8;
  --ink-300:#B4C0CB;
  --ink-200:#D6DDE3;
  --ink-100:#E9EDF1;
  --ink-50:#F4F6F8;
  --paper:#FFFFFF;

  /* — Signal : jaune bouée, l'unique couleur d'action — */
  --signal:#FFC400;
  --signal-600:#E0AA00;
  --signal-ink:#1C1500;

  /* — Réactifs : chaque paramètre porte la couleur de son test — */
  --rx-chlore:#C8157A;   /* DPD, magenta */
  --rx-combine:#8A1A5B;  /* DPD 3, prune */
  --rx-ph:#E2472B;       /* rouge phénol */
  --rx-alc:#2E7D32;      /* vert de bromocrésol */
  --rx-temp:#6A3FC8;     /* thermomètre */
  --rx-niveau:#004987;   /* marine */
  --rx-turb:#8C6A00;     /* ocre */
  --rx-cya:#0E7C86;      /* acide cyanurique */

  /* — États (réservés, jamais décoratifs) — */
  --ok:#0B8A4B;
  --warn:#D96C00;
  --crit:#CF1D3A;

  /* — Typographie — */
  --font:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --wide:118%;   /* titres : large, façon signalisation */
  --narrow:78%;  /* chiffres : condensé, façon marquage de profondeur */
  --t-2xs:11px; --t-xs:12px; --t-sm:14px; --t-md:16px; --t-lg:19px;
  --t-xl:24px; --t-2xl:32px; --t-3xl:48px; --t-4xl:72px;

  /* — Espace (base 4) — */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;

  /* — Formes : angles francs, rayon minimal — */
  --r1:2px; --r2:4px; --r3:8px;
  --rule:1px; --rule-strong:3px;
  --touch:56px;          /* cible tactile terrain (gants) */
  --touch-min:48px;

  /* — Motif : corde de couloir — */
  --lane:repeating-linear-gradient(90deg,var(--signal) 0 14px,var(--sa-marine) 14px 28px,var(--paper) 28px 42px,var(--sa-marine) 42px 56px);

  --ease:cubic-bezier(.2,.7,.2,1);
}

/* Thème Papier (défaut terrain — lisible plein soleil) */
[data-theme="papier"]{
  --bg:var(--paper); --surface:var(--ink-50); --surface-2:var(--ink-100);
  --line:var(--ink-200); --line-strong:var(--ink-900);
  --text:var(--ink-950); --text-2:var(--ink-600); --text-3:var(--ink-500);
  --accent:var(--signal); --accent-ink:var(--signal-ink);
  --brand:var(--sa-marine); --brand-ink:#fff;
  --ok-bg:#E3F4EA; --warn-bg:#FFF0DE; --crit-bg:#FDE6EA;
  --focus:0 0 0 3px var(--ink-950),0 0 0 6px var(--signal);
}
/* Thème Encre (défaut gestion — salle de contrôle) */
[data-theme="encre"]{
  --bg:var(--ink-950); --surface:var(--ink-900); --surface-2:var(--ink-850);
  --line:var(--ink-800); --line-strong:var(--ink-600);
  --text:#EEF2F5; --text-2:var(--ink-300); --text-3:var(--ink-400);
  --accent:var(--signal); --accent-ink:var(--signal-ink);
  --brand:var(--sa-marine); --brand-ink:#fff;
  --ok:#2FC27A; --warn:#FF9A2E; --crit:#FF4D67;
  --rx-chlore:#F04AA3; --rx-combine:#D56BAA; --rx-ph:#FF6A4D; --rx-alc:#5DBB63;
  --rx-temp:#A488F0; --rx-niveau:#5AA3E6; --rx-turb:#D9B243; --rx-cya:#3FC1CB;
  --ok-bg:#0C2A1E; --warn-bg:#2E1C07; --crit-bg:#33101A;
  --focus:0 0 0 2px var(--ink-950),0 0 0 4px var(--signal);
}
/* ==/TOKENS== */

/* ════════════════ Base ════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--t-sm);line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--focus)}
.num{font-stretch:var(--narrow);font-weight:800;font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em;font-weight:500}
.dim{color:var(--text-2)} .dim3{color:var(--text-3)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:square;stroke-linejoin:miter}
svg.i.lg{width:22px;height:22px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ════════════════ Coquille ════════════════ */
.shell{display:grid;grid-template-columns:248px 1fr;height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px 16px}
.brand svg{width:48px;height:48px;flex:none}
.brand b{display:block;font-size:var(--t-lg);font-weight:900;font-stretch:var(--wide);line-height:1}
.brand span{display:block;font-size:var(--t-xs);color:var(--text-3);margin-top:3px}
.lane{height:5px;background:var(--lane)}
.nav{flex:1;overflow:auto;padding:10px 0}
.nav-g{font-size:var(--t-2xs);color:var(--text-3);font-weight:650;padding:14px 18px 6px}
.nav button{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:4px;width:100%;border:0;background:none;text-align:left;padding:9px 18px;color:var(--text-2);font-weight:600;position:relative}
.nav button .n{font-family:var(--mono);font-size:var(--t-2xs);color:var(--text-3)}
.nav button:hover{color:var(--text);background:var(--surface-2)}
.nav button[aria-current]{color:var(--text);background:var(--surface-2)}
.nav button[aria-current]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:4px;background:var(--signal)}
.nav button[aria-current] .n{color:var(--signal)}
.nav .badge{font-size:var(--t-2xs);font-weight:800;padding:1px 6px;background:var(--crit);color:#fff}
.nav .badge.y{background:var(--signal);color:var(--signal-ink)}
.me{border-top:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px}
.me .av{width:34px;height:34px;display:grid;place-items:center;background:var(--sa-marine);color:#fff;font-weight:800;font-size:var(--t-xs)}
.me div{flex:1;min-width:0}
.me b{display:block;font-size:var(--t-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .me small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--text-3);font-size:var(--t-xs)}
.iconbtn{border:1px solid var(--line);background:none;width:34px;height:34px;display:grid;place-items:center;color:var(--text-2)}
.iconbtn:hover{color:var(--text);border-color:var(--line-strong)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.strip{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--bg);min-height:64px}
.strip-title{padding:12px 24px;display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1}
.strip-title h1{margin:0;font-size:var(--t-xl);font-weight:900;font-stretch:var(--wide);line-height:1.05;letter-spacing:-.01em}
.strip-title span{font-size:var(--t-xs);color:var(--text-3)}
.kpi{display:flex;flex-direction:column;justify-content:center;padding:8px 20px;border-left:1px solid var(--line);min-width:112px}
.kpi small{font-size:var(--t-2xs);color:var(--text-3);font-weight:600}
.kpi .num{font-size:var(--t-xl);line-height:1}
.kpi .num em{font-style:normal;color:var(--text-3);font-size:var(--t-md)}
.kpi.crit .num{color:var(--crit)}
.kpi.live small::before{content:"";display:inline-block;width:7px;height:7px;background:var(--ok);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.2}}
.search{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding:0 16px;color:var(--text-3);min-width:260px}
.search input{background:none;border:0;outline:none;flex:1;color:var(--text)}
.search kbd{font-family:var(--mono);font-size:var(--t-2xs);border:1px solid var(--line);padding:1px 5px;color:var(--text-3)}
.view{flex:1;overflow:auto;min-height:0}
.pad{padding:20px 24px 40px}

/* ════════════════ Composants ════════════════ */
.panel{border-top:3px solid var(--line-strong);padding-top:10px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
.panel-h h2{margin:0;font-size:var(--t-md);font-weight:850;font-stretch:var(--wide);flex:1}
.panel-h small{color:var(--text-3);font-size:var(--t-xs)}
.grid{display:grid;gap:28px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:none;padding:0 14px;height:36px;font-weight:700;color:var(--text);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.go{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.btn.go:hover{background:var(--signal-600)}
.btn.sm{height:28px;padding:0 10px;font-size:var(--t-xs)}
.seg{display:inline-flex;border:1px solid var(--line-strong)}
.seg button{border:0;border-right:1px solid var(--line-strong);background:none;padding:0 12px;height:32px;font-weight:650;color:var(--text-2);font-size:var(--t-xs)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-2xs);font-weight:750;padding:2px 7px;border:1px solid currentColor;line-height:1.3;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.warn{color:var(--warn)} .chip.crit{color:var(--crit)} .chip.mute{color:var(--text-3)}
.chip.y{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.chip.rec{color:var(--rx-niveau)}
.sq{display:inline-block;width:9px;height:9px;flex:none}
.sq.ok{background:var(--ok)} .sq.warn{background:var(--warn)} .sq.crit{background:var(--crit)} .sq.off{background:var(--ink-600)}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.field{display:flex;flex-direction:column;gap:5px;font-size:var(--t-xs);font-weight:650;color:var(--text-2)}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line-strong);color:var(--text);padding:8px 10px;font-size:var(--t-sm);font-weight:500;min-height:36px}
.field textarea{min-height:90px;resize:vertical}

/* Tables « registre » */
table.t{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
.t th{text-align:left;font-size:var(--t-2xs);font-weight:650;color:var(--text-3);padding:8px 10px;border-bottom:1px solid var(--line-strong);position:sticky;top:0;background:var(--bg);z-index:1;white-space:nowrap}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--surface)}
.t tr.sel td{background:var(--surface-2)}
.t td.r,.t th.r{text-align:right}
.t td.num{font-size:var(--t-md)}
.t tfoot td{border-top:2px solid var(--line-strong);border-bottom:0;font-weight:800}
.t b{font-weight:700}
.sub{display:block;font-size:var(--t-xs);color:var(--text-3)}

/* ════════════════ Monitoring ════════════════ */
.mon{display:grid;grid-template-columns:300px minmax(0,1fr) 320px;gap:28px}
.crew li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.crew .av{width:32px;height:32px;display:grid;place-items:center;font-weight:800;font-size:var(--t-2xs);background:var(--surface-2);color:var(--text-2)}
.crew .av.on{background:var(--sa-marine);color:#fff;box-shadow:inset 0 -3px 0 var(--ok)}
.crew .av.pause{box-shadow:inset 0 -3px 0 var(--signal)}
.crew b{display:block;font-size:var(--t-sm)}
.crew small{display:block;color:var(--text-3);font-size:var(--t-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew .num{font-size:var(--t-lg)}
ul.plain{list-style:none;margin:0;padding:0}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.room{background:var(--bg);padding:14px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;position:relative;min-height:154px}
.room:hover{background:var(--surface)}
.room::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--st,var(--ink-700))}
.room-h{display:flex;gap:8px;align-items:flex-start}
.room-h b{flex:1;font-size:var(--t-sm);line-height:1.25}
.room-h small{display:block;color:var(--text-3);font-size:var(--t-xs);font-weight:500;margin-top:2px}
.gauges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.g small{display:flex;align-items:center;gap:5px;font-size:var(--t-2xs);color:var(--text-3);font-weight:600}
.g small i{width:6px;height:6px;background:var(--rx)}
.g .num{font-size:var(--t-xl);line-height:1.05}
.g.warn .num{color:var(--warn)} .g.crit .num{color:var(--crit)}
.g .bar{height:4px;background:var(--surface-2);position:relative;margin-top:4px}
.g .bar span{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.45}
.g .bar i{position:absolute;top:-3px;width:3px;height:10px;background:var(--text);margin-left:-1px}
.room .age{font-size:var(--t-2xs);color:var(--text-3);font-family:var(--mono)}
.feed li{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.feed .h{font-family:var(--mono);font-size:var(--t-xs);color:var(--text-3);padding-top:1px}
.feed p{margin:0;font-size:var(--t-sm)}
.feed p small{display:block;color:var(--text-3);font-size:var(--t-xs);margin-top:2px}
.feed .crit p b{color:var(--crit)}
.feed li.new{animation:flash 1.4s var(--ease)}
@keyframes flash{from{background:var(--surface-2)}}

/* ════════════════ Carte ════════════════ */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;height:calc(100vh - 65px)}
.map{position:relative;background:var(--surface);overflow:hidden;border-right:1px solid var(--line)}
.map svg{width:100%;height:100%;display:block}
.map .water{fill:var(--sa-marine);opacity:.35}
[data-theme="papier"] .map .water{opacity:.18}
.map .gridl{stroke:var(--line);stroke-width:1}
.map .road{stroke:var(--ink-700);stroke-width:1.5;fill:none}
[data-theme="papier"] .map .road{stroke:var(--ink-200)}
.map .lbl{fill:var(--text-3);font-size:11px;font-family:var(--mono)}
.pin{cursor:pointer}
.pin .dot{stroke:var(--bg);stroke-width:2}
.pin text{fill:var(--text);font-size:11.5px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.map svg.many .pin[data-site] text{display:none}
.map svg.many .pin[data-site]:hover text{display:block}
.pin.tech rect{fill:var(--signal);stroke:var(--ink-950);stroke-width:2}
.pin.tech text.ini{fill:var(--signal-ink);stroke:none;font-size:10px;font-weight:900}
.maplegend{position:absolute;left:16px;bottom:16px;background:var(--bg);border:1px solid var(--line);padding:10px 12px;display:flex;gap:14px;font-size:var(--t-xs);color:var(--text-2)}
.maplegend span{display:flex;align-items:center;gap:6px}
.side{overflow:auto;padding:18px 20px}

/* ════════════════ Inspections ════════════════ */
.insp{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px}
.sitelist button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px}
.sitelist button:hover{background:var(--surface)}
.sitelist button[aria-current]{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--signal)}
.sitelist small{display:block;color:var(--text-3);font-size:var(--t-xs)}
.charts{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:24px 28px}
.chart{position:relative}
.chart-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
.chart-h b{font-size:var(--t-sm);flex:1;display:flex;align-items:center;gap:7px}
.chart-h b i{width:10px;height:10px;background:var(--rx)}
.chart-h .num{font-size:var(--t-xl)}
.chart-h .u{color:var(--text-3);font-size:var(--t-xs)}
.chart svg{width:100%;height:150px;display:block;overflow:visible}
.chart .band{fill:var(--ok);opacity:.14}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--text-3);font-size:10px;font-family:var(--mono)}
.chart .line{fill:none;stroke:var(--rx);stroke-width:2;stroke-linejoin:round}
.chart .pt{stroke:var(--bg);stroke-width:2}
.chart .xh{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 3;display:none}
.chart:hover .xh{display:block}
.tip{position:absolute;pointer-events:none;background:var(--ink-950);color:#fff;border:1px solid var(--ink-700);padding:6px 9px;font-size:var(--t-xs);white-space:nowrap;transform:translate(-50%,-110%);z-index:5;display:none}
.tip b{font-stretch:var(--narrow);font-size:var(--t-md)}

/* ════════════════ Opérations ════════════════ */
.dossier td:first-child{width:28px;color:var(--text-3)}
.visits td{background:var(--surface);font-size:var(--t-xs);padding:7px 10px}
.lanebar{height:8px;background:var(--surface-2);position:relative;min-width:90px}
.lanebar i{position:absolute;inset:0 auto 0 0;background:var(--lane)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;height:calc(100vh - 65px)}
.split>.l{overflow:auto;padding:20px 24px}
.split>.r{overflow:auto;border-left:1px solid var(--line);background:var(--surface);padding:20px}
.detail h3{margin:0;font-size:var(--t-xl);font-weight:900;font-stretch:var(--wide);line-height:1.1}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:16px 0;font-size:var(--t-sm)}
.kv dt{color:var(--text-3);font-size:var(--t-xs);padding-top:2px}
.kv dd{margin:0}

/* ════════════════ Planning ════════════════ */
.week{display:grid;grid-template-columns:170px repeat(7,minmax(0,1fr));border-top:1px solid var(--line-strong)}
.week>div{border-bottom:1px solid var(--line);border-right:1px solid var(--line);min-height:74px;padding:6px}
.week .hd{min-height:0;font-size:var(--t-xs);font-weight:700;color:var(--text-2);padding:8px 6px;border-bottom:1px solid var(--line-strong)}
.week .hd.today{color:var(--signal)}
.week .who{display:flex;flex-direction:column;justify-content:center}
.week .who b{font-size:var(--t-sm)} .week .who small{color:var(--text-3);font-size:var(--t-xs)}
.blk{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--rx-niveau);background:var(--surface-2);padding:4px 6px;margin-bottom:4px;font-size:var(--t-xs);line-height:1.25}
.blk b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{color:var(--text-3)}
.blk.rec{border-left-color:var(--signal)}
.blk.prev{border:1px dashed var(--signal);border-left:3px solid var(--signal);background:none}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dates button{border:1px solid var(--line-strong);background:none;padding:4px 8px;font-family:var(--mono);font-size:var(--t-xs)}
.dates button.off{text-decoration:line-through;color:var(--text-3);border-style:dashed}

/* ════════════════ Facturation ════════════════ */
.ecart{font-variant-numeric:tabular-nums;font-weight:750}
.ecart.pos{color:var(--ok)} .ecart.neg{color:var(--crit)} .ecart.zero{color:var(--text-3)}
.sums{display:grid;grid-template-columns:repeat(4,1fr);border-top:3px solid var(--line-strong);margin-bottom:22px}
.sums>div{padding:12px 16px 12px 0;border-right:1px solid var(--line)}
.sums>div+div{padding-left:16px}
.sums>div:last-child{border-right:0}
.sums small{display:block;color:var(--text-3);font-size:var(--t-xs);font-weight:600}
.sums .num{font-size:var(--t-2xl);line-height:1.1}

/* Sondages / communication */
.score{display:flex;align-items:flex-end;gap:10px}
.score .num{font-size:var(--t-4xl);line-height:.85}
.hbar{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;padding:5px 0;font-size:var(--t-xs)}
.hbar .b{height:14px;background:var(--surface-2);position:relative}
.hbar .b i{position:absolute;inset:0 auto 0 0;background:var(--rx-niveau)}
.news{background:var(--paper);color:var(--ink-950);padding:28px 32px;border-top:8px solid var(--sa-marine);max-width:680px}
.news h3{font-size:var(--t-2xl);font-weight:900;font-stretch:var(--wide);margin:4px 0 12px;line-height:1.05}
.news h4{font-size:var(--t-md);margin:18px 0 6px;font-weight:800}
.news p{margin:0 0 8px;color:var(--ink-700);font-size:var(--t-sm)}
.news .lane{margin:18px 0}
.news .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.news .stats .num{font-size:var(--t-2xl);display:block;color:var(--sa-marine)}
.news .stats small{color:var(--ink-500);font-size:var(--t-xs)}

/* Temps */
.notice{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line-strong);border-left:4px solid var(--signal);padding:10px 14px;margin-bottom:18px;font-size:var(--t-xs);color:var(--text-2)}
.notice b{color:var(--text)}
.hcell{font-variant-numeric:tabular-nums;text-align:right}
.hcell.z{color:var(--text-3)}
.hcell.ot{color:var(--warn);font-weight:800}

.toast{position:fixed;right:20px;bottom:20px;background:var(--ink-950);color:#fff;border:1px solid var(--ink-700);border-left:4px solid var(--signal);padding:12px 16px;font-weight:650;transform:translateY(10px);opacity:0;transition:.2s var(--ease);pointer-events:none;z-index:99}
.toast.on{transform:none;opacity:1}
.mode{font-size:var(--t-2xs);font-weight:700;margin-left:10px;padding:1px 6px;border:1px solid currentColor;white-space:nowrap}
.mode.ok{color:var(--ok)} .mode.warn{color:var(--warn)} .mode.y{color:var(--signal)}
.btn[disabled]{opacity:.35;pointer-events:none}
@media print{.rail,.strip,.r,.toolbar,.notice{display:none!important}.shell{display:block;height:auto}.view,.split,.split>.l{overflow:visible;height:auto}body{background:#fff;color:#000}}
.demo{font-family:var(--mono);font-size:var(--t-2xs);color:var(--signal);border:1px solid var(--signal);padding:1px 6px;margin-left:8px;vertical-align:middle}
@media (max-width:1280px){.mon{grid-template-columns:260px minmax(0,1fr)}.mon>.feedcol{grid-column:1/-1}.split{grid-template-columns:minmax(0,1fr) 340px}.search{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  ['cl','clc','ph'].forEach(function(k){if(last[k]==null)return;var z=zone(k,last[k]);if(z==='crit')w='crit';else if(z==='warn'&&w==='ok')w='warn';});
  return w;
}
function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mondayISO(d){d=new Date(d);d.setHours(12,0,0,0);var k=d.getDay();d.setDate(d.getDate()+(k===0?-6:1-k));return isoDay(d);}
function addDays(iso,n){var d=new Date(iso+'T12:00');d.setDate(d.getDate()+n);return isoDay(d);}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function ago(date,heure){
  if(!date)return '';var t=isoDay(TODAY);
  if(date===t)return heure||"aujourd'hui";
  if(date===addDays(t,-1))return 'hier'+(heure?', '+heure:'');
  return new Date(date+'T12:00').toLocaleDateString('fr-CA',{day:'numeric',month:'short'});
}

  load:function(){

      sbGet('sites?select=id,nom,addr,type,bassins,tel'),
      sbGet('workorders?select=id,client,site,type,priorite,status,date,assigne,assignes,descr,tasks,groupe_id,updated_at'),
      sbGet('planning_tasks?select=id,titre,descr,emp,emp_nom,site_id,site_nom,date_debut,date_fin,heure_debut,heure_fin,statut'),
      sbGet('punch_gps_log?select=id,uid,emp,date,heure,lieu,addr,site_id,lat,lng,src&date=gte.'+isoDay(since)+'&order=date.desc,heure.desc'),
      sbGet('site_journal?select=id,site_id,uid,emp,date,heure,lieu,notes&order=date.desc,heure.desc&limit=60'),
      sbGet('feuilles_temps?select=id,uid,emp,week,days,total_h&week=gte.'+wk0),
      sbGet('sondages?select=slug,titre,client,actif,created_at&order=created_at.desc')
    ]).then(function(r){
      var raw={comptes:r[0],sites:r[1],wo:r[2],pt:r[3],gps:r[4],journal:r[5],ft:r[6],sondages:r[7],at:Date.now()};
      try{localStorage.setItem(self.KEY,JSON.stringify(raw));}catch(e){}
      return raw;
    });
  },
  apply:function(raw){
    TODAY=new Date();var today=isoDay(TODAY),wk=mondayISO(TODAY),di=(TODAY.getDay()+6)%7;
    var ROLE={employe:'Employé·e',superviseur:'Superviseur·e',admin:'Administration'};
    TECHS=raw.comptes.filter(function(c){return c.role!=='admin'&&c.statut!=='inactif';}).map(function(c){
      var nom=((c.prenom||'')+' '+(c.nom||'')).trim()||c.id;
      return {id:c.id,nom:nom,ini:nom.split(/\s+/).map(function(x){return x.charAt(0);}).join('').slice(0,2).toUpperCase(),role:ROLE[c.role]||c.role||''};
    }).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr');});
    var ALL=raw.comptes.map(function(c){return {id:c.id,nom:((c.prenom||'')+' '+(c.nom||'')).trim()||c.id};});
    function nameOf(id,fb){var c=ALL.find(function(x){return x.id===id;});return c?c.nom:(fb||id);}
    /* positions : moyenne des punchs GPS rattachés au site */
    var pos={};raw.gps.forEach(function(g){if(g.site_id&&g.lat&&g.lng){var p=pos[g.site_id]=pos[g.site_id]||{la:0,ln:0,n:0};p.la+=g.lat;p.ln+=g.lng;p.n++;}});
    var TYPE={commercial:'Commercial',creusee:'Résidentiel (creusée)',spa:'Spa',autre:'Autre'};
    SITES=raw.sites.map(function(s){var p=pos[s.id];
      return {id:s.id,nom:s.nom||'(sans nom)',client:s.addr||'',addr:s.addr||'',type:TYPE[s.type]||s.type||'—',rawType:s.type||'',lat:p?p.la/p.n:null,lng:p?p.ln/p.n:null,
        bassins:Array.isArray(s.bassins)&&s.bassins.length?s.bassins.map(function(b){return b.nom||'Bassin';}):['Bassin principal']};
    }).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr');});
    var byName={};SITES.forEach(function(s){byName[norm(s.nom)]=s;});
    EXTRA_SITES=[];
    function siteFor(name,addr){var s=byName[norm(name)]||byName[norm(addr)];if(s)return s;var id='x-'+norm(name||addr).replace(/ /g,'-');
      s=EXTRA_SITES.find(function(x){return x.id===id;});if(!s){s={id:id,nom:name||addr||'Site inconnu',client:addr||'',addr:addr||'',type:'Hors répertoire',lat:null,lng:null,bassins:['Bassin principal']};EXTRA_SITES.push(s);byName[norm(s.nom)]=s;}return s;}
    /* relevés de bassin : saisis dans les tâches de punch (feuilles_temps.days[].tasks[].bassins) */
    HIST={};var nRelToday=0;
    raw.ft.forEach(function(f){(f.days||[]).forEach(function(d,i){(d&&d.tasks||[]).forEach(function(t){(t.bassins||[]).forEach(function(b){
      var s=t.siteId?siteById(t.siteId):siteFor(t.lieu);if(!s)return;var date=addDays(f.week,i);
      (HIST[s.id]=HIST[s.id]||[]).push({date:date,d:Math.round((TODAY-new Date(date+'T12:00'))/864e5),cl:b.cl,ph:b.ph,alc:b.alc,temp:b.temp,clc:b.clc,tech:f.emp||nameOf(f.uid),bassin:b.bassin});
      if(date===today)nRelToday++;
    });});});});
    Object.keys(HIST).forEach(function(k){HIST[k].sort(function(a,b){return a.date<b.date?-1:1;});});
    REL_TODAY=nRelToday;
    /* qui est où : tâche active de la journée dans la feuille de temps de la semaine */
    LIVE=TECHS.map(function(t){
      var f=raw.ft.find(function(x){return x.uid===t.id&&x.week===wk;}),day=f&&f.days&&f.days[di],tasks=(day&&day.tasks)||[];
      var act=tasks.filter(function(x){return x.active;}).pop();
      if(act){var s=act.siteId?siteById(act.siteId):byName[norm(act.lieu)];return {t:t.id,site:s?s.id:null,lieu:act.lieu||(s&&s.nom)||'',depuis:act.start||'',etat:'on'};}
      if(tasks.length){var last=tasks[tasks.length-1];return {t:t.id,site:null,etat:'off',note:'Terminé'+(last.end?' à '+last.end:'')+' — '+(last.lieu||'')};}
      return {t:t.id,site:null,etat:'off',note:'Pas punché aujourd\'hui'};
    });
    /* flux : punchs GPS + journal de chantier */
    var feed=raw.gps.slice(0,40).map(function(g){var s=g.site_id&&siteById(g.site_id);return {date:g.date,h:g.heure||'',t:g.uid,emp:g.emp,site:s?s.id:null,lieu:s?s.nom:g.lieu,txt:'Punch — '+esc(g.lieu||(s&&s.nom)||'lieu inconnu')+(g.src==='gps'?'':' <span class="dim3">(position '+(g.src==='pending'?'en attente':g.src==='addr'?'par adresse':'absente')+')</span>')};});
    raw.journal.forEach(function(j){var s=j.site_id&&siteById(j.site_id);feed.push({date:j.date,h:j.heure||'',t:j.uid,emp:j.emp,site:s?s.id:null,lieu:s?s.nom:j.lieu,txt:'Note de chantier — '+esc((j.notes||'').slice(0,120))});});
    feed.sort(function(a,b){return (b.date+b.h)>(a.date+a.h)?1:-1;});
    FEED=feed.slice(0,30);
    /* dossiers : Work Orders regroupés par groupe_id */
    WO_RAW=raw.wo;PT_RAW=raw.pt;FT_RAW=raw.ft;SONDAGES=raw.sondages;
    var DONE=/^(termine|terminé|complete|complété|fait|ferme|fermé)$/i,groups={};
    raw.wo.forEach(function(w){var g=w.groupe_id||w.id;(groups[g]=groups[g]||[]).push(w);});
    DOSSIERS=Object.keys(groups).map(function(g){
      var l=groups[g].slice().sort(function(a,b){return (a.date||'')<(b.date||'')?-1:1;}),w0=l[0],s=siteFor(w0.client,w0.site);
      var assign=String(w0.assigne||w0.assignes||'').split(/,\s*/).filter(Boolean);
      var vis=l.map(function(w){var d=(w.date||'').slice(0,10);return [d,DONE.test(w.status||'')?'fait':d&&d<today?'passe':d===today?'encours':'prevu',w];});
      var nf=vis.filter(function(v){return v[1]==='fait';}).length;
      var statut=nf===vis.length?'Terminé':!assign.length?'À assigner':vis.some(function(v){return v[1]!=='prevu';})?'En cours':'Planifié';
      var wd={};l.forEach(function(w){if(w.date)wd[new Date(w.date.slice(0,10)+'T12:00').getDay()]=1;});var k=Object.keys(wd).map(Number).sort();
      var J=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'],JL=['dimanches','lundis','mardis','mercredis','jeudis','vendredis','samedis'];
      return {id:l.length>1?'G-'+g.slice(-5).toUpperCase():w0.id,client:w0.client||s.nom,site:s.id,titre:(w0.type?w0.type.charAt(0).toUpperCase()+w0.type.slice(1):'Work Order')+(w0.descr?' — '+w0.descr:''),
        tech:assign[0]||null,techs:assign,statut:statut,rec:l.length>1?(k.length===1?'Tous les '+JL[k[0]]:k.map(function(i){return J[i];}).join(' · ')):null,visites:vis,tasks:w0.tasks||[]};
    }).sort(function(a,b){return a.visites[0][0]<b.visites[0][0]?1:-1;});
    /* à valider : tâches de punch en attente de validation */
    PUNCH_CHECK=[];
    raw.ft.forEach(function(f){(f.days||[]).forEach(function(d,i){(d&&d.tasks||[]).forEach(function(t){if(t.pendingValidation)PUNCH_CHECK.push({t:f.uid,emp:f.emp,date:addDays(f.week,i),h:t.start||'—',type:'site',
      txt:(t.pendingReason==='entrepot_bureau'?'Entrepôt / bureau':'Nouveau site')+' — '+(t.lieu||'lieu inconnu')});});});});
    PUNCH_CHECK.sort(function(a,b){return a.date<b.date?1:-1;});
    /* sites détectés : punchs sans fiche de site */
    var det={};raw.gps.forEach(function(g){if(!g.site_id&&g.lieu){var k=norm(g.lieu);var x=det[k]=det[k]||{nom:g.lieu,addr:g.addr||'',n:0,emps:{}};x.n++;x.emps[g.emp||g.uid]=1;}});
    DETECTES=Object.keys(det).map(function(k){var x=det[k];return {nom:x.nom,addr:x.addr,vu:x.n+' punch'+(x.n>1?'s':'')+' · '+Object.keys(x.emps).join(', '),proche:null};});
    FACT_DEMO=true;
    tempsWeek=mondayISO(TODAY);if(!raw.ft.some(function(f){return f.week===tempsWeek;})){var ws=raw.ft.map(function(f){return f.week;}).sort();if(ws.length)tempsWeek=ws[ws.length-1];}
    inspSite=(Object.keys(HIST)[0])||(SITES[0]&&SITES[0].id);
    opsSel=DOSSIERS[0]&&DOSSIERS[0].id;opsOpen={};if(opsSel)opsOpen[opsSel]=1;
    serie.tech=TECHS[0]&&TECHS[0].id;serie.titre='';serie.fin=addDays(isoDay(TODAY),42);serie.off={};
    planWeek=mondayISO(TODAY);
  }
};

  if(MODE==='demo')return {rel:214,conf:'97 %',vis:58,h:null,n:39};
  var wk=mondayISO(TODAY),prev=addDays(wk,-7),use=FT_RAW.some(function(f){return f.week===wk;})?wk:prev,rel=0,ok=0,vis=0,h=0;
  FT_RAW.filter(function(f){return f.week===use;}).forEach(function(f){(f.days||[]).forEach(function(d){(d&&d.tasks||[]).forEach(function(t){vis++;h+=t.hrs||0;(t.bassins||[]).forEach(function(b){rel++;if(b.cl!=null&&zone('cl',b.cl)!=='crit'&&(b.ph==null||zone('ph',b.ph)!=='crit'))ok++;});});});});
  var d=new Date(use+'T12:00'),start=new Date(d.getFullYear(),0,1);
  return {rel:rel,conf:rel?Math.round(ok/rel*100)+' %':'—',vis:vis,h:h,n:Math.ceil(((d-start)/864e5+start.getDay()+1)/7),week:use};
}

/* ════════════════ 10 · Temps / Suivi / Cumul ════════════════ */
/* Reprise à l'identique de SOUCY OPS : dayTotal = somme des t.hrs de la journée ;
   régulier = min(total, 40) ; supplémentaire = max(0, total − 40) (refreshCumul). */
function ftDayTotal(day){return((day&&day.tasks)||[]).reduce(function(s,t){return s+(t.hrs||0);},0);}
var tempsTab='feuilles';
function vTemps(v){
  var DJ=['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'],rows,weeks=[];
  if(MODE==='demo'){rows=FT.map(function(f){return {t:f.t,nom:techName(f.t),role:(techById(f.t)||{}).role,d:f.d,statut:f.statut};});}
  else{
    weeks=FT_RAW.map(function(f){return f.week;}).filter(function(x,i,a){return a.indexOf(x)===i;}).sort();
    rows=FT_RAW.filter(function(f){return f.week===tempsWeek;}).map(function(f){
      var days=f.days||[],d=[0,1,2,3,4,5,6].map(function(i){return ftDayTotal(days[i]);}),worked=days.filter(function(x){return x&&x.tasks&&x.tasks.length;}),saved=worked.filter(function(x){return x.saved;}).length;
      var pend=days.reduce(function(a,x){return a+((x&&x.tasks)||[]).filter(function(t){return t.pendingValidation;}).length;},0);
      return {t:f.uid,nom:techName(f.uid,f.emp),role:(techById(f.uid)||{}).role||'',d:d,statut:pend?'attente':worked.length&&saved===worked.length?'envoye':'encours',saved:saved,worked:worked.length,pend:pend};
    }).filter(function(r){return r.worked||r.d.some(function(x){return x>0;});}).sort(function(a,b){return a.nom.localeCompare(b.nom,'fr');});
  }
  var wlabel=new Date((MODE==='demo'?'2026-09-21':tempsWeek)+'T12:00').toLocaleDateString('fr-CA',{day:'numeric',month:'long',year:'numeric'});
  var wi=weeks.indexOf(tempsWeek);
  var h='<div class="pad"><div class="notice">'+ic('alert')+'<span><b>Habillage visuel seulement.</b> Calculs repris tels quels de SOUCY OPS : total = somme des heures de chaque tâche, régulier ≤ 40 h, supplémentaire au-delà. '+(MODE==='demo'?'Valeurs affichées : démonstration.':'Lecture seule : la validation se fait toujours dans SOUCY OPS.')+'</span></div>'+
    '<div class="toolbar"><span class="seg" id="tT"><button data-t="feuilles" aria-pressed="'+(tempsTab==='feuilles')+'">Feuilles de temps</button><button data-t="punchs" aria-pressed="'+(tempsTab==='punchs')+'">Punchs à valider · '+PUNCH_CHECK.length+'</button></span><span class="sp"></span>'+
    (tempsTab==='feuilles'?'<button class="btn sm" id="twP" '+(MODE==='demo'||wi<=0?'disabled':'')+'>‹</button><b>Semaine du '+wlabel+'</b><button class="btn sm" id="twN" '+(MODE==='demo'||wi<0||wi>=weeks.length-1?'disabled':'')+'>›</button>':'')+'<button class="btn" id="tExp">Exporter paie</button></div>';
  if(tempsTab==='feuilles'){
    h+=rows.length?'<table class="t"><thead><tr><th>Employé</th>'+DJ.map(function(d){return '<th class="r">'+d+'</th>';}).join('')+'<th class="r">Total</th><th class="r">Régulier ≤40 h</th><th class="r">Supplémentaire</th><th>Statut</th></tr></thead><tbody>'+
    rows.map(function(f){var wt=f.d.reduce(function(a,b){return a+b;},0),reg=Math.min(wt,40),supp=Math.max(0,wt-40);
      var stat=MODE==='demo'?(f.statut==='valide'?'<span class="chip ok">'+ic('check')+'Validée</span>':f.statut==='soumis'?'<button class="btn sm" data-val="'+f.t+'">Valider</button>':'<span class="chip mute">Brouillon</span>')
        :f.statut==='attente'?'<span class="chip warn">'+f.pend+' punch'+(f.pend>1?'s':'')+' à valider</span>':f.statut==='envoye'?'<span class="chip ok">'+ic('check')+'Journées envoyées</span>':'<span class="chip mute">'+f.saved+'/'+f.worked+' envoyée'+(f.saved>1?'s':'')+'</span>';
      return '<tr><td><b>'+esc(f.nom)+'</b><span class="sub">'+esc(f.role)+'</span></td>'+f.d.map(function(x){return '<td class="hcell mono'+(x?'':' z')+'">'+(x?fmtH(x):'—')+'</td>';}).join('')+
      '<td class="hcell num" style="font-size:var(--t-md)">'+fmtH(wt)+'</td><td class="hcell mono">'+fmtH(reg)+'</td><td class="hcell mono'+(supp>0?' ot':' z')+'">'+(supp>0?fmtH(supp):'—')+'</td><td>'+stat+'</td></tr>';}).join('')+'</tbody></table>':'<p class="dim">Aucune feuille de temps pour cette semaine.</p>';
  }else{
    h+=PUNCH_CHECK.length?'<table class="t"><thead><tr><th>Employé</th><th>Date</th><th>Heure</th><th>Motif</th><th></th></tr></thead><tbody>'+
    PUNCH_CHECK.map(function(p,i){return '<tr><td><b>'+esc(techName(p.t,p.emp))+'</b></td><td class="mono">'+p.date+'</td><td class="mono">'+esc(p.h)+'</td><td><span class="sq '+(p.type==='ouvert'?'crit':'warn')+'" style="margin-right:8px"></span>'+esc(p.txt)+'</td><td class="r"><button class="btn sm go" data-pc="'+i+'">'+ic('check')+'Valider</button> <button class="btn sm" data-fix>Corriger</button></td></tr>';}).join('')+'</tbody></table>':'<p class="dim">Aucun punch en attente de validation.</p>';
  }
  v.innerHTML=h+'</div>';
  $$('#tT [data-t]',v).forEach(function(b){b.onclick=function(){tempsTab=b.dataset.t;vTemps(v);};});
  if($('#twP'))$('#twP').onclick=function(){tempsWeek=weeks[wi-1];vTemps(v);};
  if($('#twN'))$('#twN').onclick=function(){tempsWeek=weeks[wi+1];vTemps(v);};
  $('#tExp').onclick=readOnly;$$('[data-fix]',v).forEach(function(b){b.onclick=readOnly;});
  $$('[data-val]',v).forEach(function(b){b.onclick=function(){FT.find(function(f){return f.t===b.dataset.val;}).statut='valide';toast('Feuille validée (démonstration)');vTemps(v);};});
  $$('[data-pc]',v).forEach(function(b){b.onclick=function(){if(MODE!=='demo'){readOnly();return;}PUNCH_CHECK.splice(+b.dataset.pc,1);toast('Punch validé (démonstration)');renderNav();vTemps(v);};});
}

/* ════════════════ Démarrage ════════════════ */
function useReal(raw,mode){
  try{REAL.apply(raw);}catch(e){console.error(e);toast('Données réelles illisibles — démonstration');return;}
  MODE=mode;REAL_AT=raw.at;go(cur);
}
function refresh(manual){
  REAL.load().then(function(raw){useReal(raw,'reel');if(manual)toast('Données rechargées');})
    .catch(function(){var c=REAL.cache();if(c&&MODE!=='cache'&&MODE!=='reel')useReal(c,'cache');if(manual||MODE==='demo')toast('Serveur injoignable — '+(c?'copie locale':'démonstration'));});
}
(function(){
  var th='encre',m='monitoring';
  try{th=localStorage.getItem('saAdmin.theme')||th;m=localStorage.getItem('saAdmin.mod')||m;}catch(e){}
  document.documentElement.dataset.theme=th;
  $('#theme').onclick=function(){var n=document.documentElement.dataset.theme==='encre'?'papier':'encre';document.documentElement.dataset.theme=n;try{localStorage.setItem('saAdmin.theme',n);}catch(e){}};
  $('#reload').onclick=function(){refresh(true);};
  document.addEventListener('keydown',function(e){if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();$('#q').focus();}});
  $('#q').addEventListener('keydown',function(e){if(e.key!=='Enter')return;var q=norm(e.target.value);if(!q)return;
    var t=TECHS.find(function(x){return norm(x.nom).indexOf(q)>=0;});
    var d=DOSSIERS.find(function(x){return norm(x.id)===q||norm(x.client).indexOf(q)>=0;});
    var s=SITES.find(function(x){return norm(x.nom+' '+x.addr).indexOf(q)>=0;});
    var f=FACT.find(function(r){return norm(r[0])===q||norm(r[1])===q;});
    if(f){factF='tous';go('facturation');}else if(d){opsSel=d.id;opsFiltre='tous';opsOpen[d.id]=1;go('operations');}else if(s){inspSite=s.id;go('inspections');}else if(t){go('temps');}else toast('Aucun résultat pour « '+e.target.value+' »');});
  if(!MODS.some(function(x){return x.k===m;}))m='monitoring';
  cur=m;
  var c=REAL.cache();
  if(c)useReal(c,'cache');else go(m);
  refresh(false);
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
